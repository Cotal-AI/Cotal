# Announce the release body's one-sentence highlights, linked to the full Release.
# Use the formatter on the default branch; the body, tag and URL come from the release event.
on:
  release:
    types: [published]

jobs:
  announce:
    # Only the version release is announced, never a per-package one.
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Post the release on Discord
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          TAG: ${{ github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url }}
          BODY: ${{ github.event.release.body }}
        run: |
          printf '%s' "$BODY" | node scripts/release-announcement.mjs "$TAG" "$URL" > "$RUNNER_TEMP/announcement.json"
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          try {
            const body = await readFile(`${process.env.RUNNER_TEMP}/announcement.json`);
            const response = await fetch(process.env.WEBHOOK_URL, {
              method: 'POST', headers: { 'Content-Type': 'application/json' }, body,
              redirect: 'error', signal: AbortSignal.timeout(15_000),
            });
            if (!response.ok) {
              console.error(`Discord rejected the announcement (HTTP ${response.status}); no retry was attempted.`);
              process.exitCode = 1;
            }
          } catch {
            // Fetch errors can include the credential-bearing URL. Do not print them.
            console.error('Discord announcement request failed; delivery may be unknown. Check Discord before retrying.');
            process.exitCode = 1;
          }
          NODE
