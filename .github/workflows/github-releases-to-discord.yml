# Announce a published GitHub Release on Discord. The embed carries the release body's
# `## What changed` layer (one sentence per change) under the upgrade command and links to the
# Release for the full text; scripts/release-announcement.mjs builds it and refuses a body without
# that layer, so a release the Changesets workflow did not write is not announced as if it were.
# The checkout is the default branch, not the released tag: the Release tags the oldest commit that
# carried the version, which may predate the builder, while the event carries the body, tag and url.
on:
  release:
    types: [published]

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Post the release on Discord
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          TAG: ${{ github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url }}
          BODY: ${{ github.event.release.body }}
        run: |
          printf '%s' "$BODY" | node scripts/release-announcement.mjs "$TAG" "$URL" > "$RUNNER_TEMP/announcement.json"
          curl --fail --silent --show-error -H 'Content-Type: application/json' \
            --data @"$RUNNER_TEMP/announcement.json" "$WEBHOOK_URL"
