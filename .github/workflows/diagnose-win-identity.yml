name: Diagnose Windows identity
on:
  push:
    branches: [diag/windows-cold-identity]
permissions:
  contents: read
jobs:
  identity:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
        node: [22, 24, 26]
        replica: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v6.0.8
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cotal-ai/core --filter @cotal-ai/workspace build
      - run: node --import tsx scripts/diagnose-win-native.mjs
      - name: Observe native signal cleanup with an IPC positive control
        if: ${{ always() }}
        run: node scripts/diagnose-win-signals.mjs
