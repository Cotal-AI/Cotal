name: Installed npm first up
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact already-packed product source
        type: string
        required: true
        default: b2b2638bbaf5751db726320a1bea2164361b1575
permissions:
  contents: read
  actions: read
jobs:
  proof:
    if: github.ref == 'refs/heads/measure/checkout-manager-current-main-6906' && inputs.source_sha == 'b2b2638bbaf5751db726320a1bea2164361b1575'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --child-concurrency=2
      - name: Reuse exact guarded candidate from original run
        uses: actions/github-script@v8
        with:
          script: |
            const assert=require('node:assert/strict');
            const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),cp=require('node:child_process');
            const {data:run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:43882152293});
            assert.equal(run.head_sha,'0ac2c825730f472adf5ad57bc0f3075ca4f9e46d');
            const {data:artifact}=await github.rest.actions.getArtifact({...context.repo,artifact_id:14233693519});
            assert.equal(artifact.name,'installed-up-candidate');assert.equal(artifact.workflow_run.id,43882152293);
            const digest='09f96530595d51dfd1a4a284870f1c78204912bda20f87679dadee5591a7ca36';
            assert.equal(artifact.digest,'sha256:'+digest);assert(!artifact.expired);
            const {data:archive}=await github.rest.actions.downloadArtifact({...context.repo,artifact_id:artifact.id,archive_format:'zip'});
            const bytes=Buffer.from(archive);assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'),digest);
            const zip=path.join(process.env.RUNNER_TEMP,'installed-up-candidate.zip'),destination=path.join(process.env.RUNNER_TEMP,'candidate');
            fs.writeFileSync(zip,bytes);fs.mkdirSync(destination);cp.execFileSync('unzip',['-q',zip,'-d',destination]);
            const manifest=JSON.parse(fs.readFileSync(path.join(destination,'manifest.json')));
            assert.equal(manifest.source,'b2b2638bbaf5751db726320a1bea2164361b1575');
            assert(manifest.packages.every(p=>p.version==='0.164.1018'));
            const out=path.join(process.env.RUNNER_TEMP,'installed-up');fs.mkdirSync(out);
            fs.writeFileSync(path.join(out,'candidate-origin.json'),JSON.stringify({product:manifest.source,measurement:context.sha,artifact:artifact.id,run:43882152293,digest},null,2));
      - name: Run the two installed plain npm first-up cells
        shell: bash
        env:
          COTAL_UP_CANDIDATE: ${{ runner.temp }}/candidate
          COTAL_UP_OUTPUT: ${{ runner.temp }}/installed-up
        run: |
          set -euo pipefail
          node scripts/plain-npm-up-proof.mjs 2>&1 | tee "$COTAL_UP_OUTPUT/stdout.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-plain-npm-first-up
          path: |
            ${{ runner.temp }}/installed-up/*.json
            ${{ runner.temp }}/installed-up/*.log
            ${{ runner.temp }}/installed-up/*.txt
            ${{ runner.temp }}/installed-up/*.md
          if-no-files-found: error
