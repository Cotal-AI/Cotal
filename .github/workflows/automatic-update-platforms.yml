name: Upgrade matrix
on:
  release:
    types: [published]
  schedule:
    - cron: '23 5 * * 1'
  workflow_call:
  workflow_dispatch:
  push:
    branches: [test/upgrade-matrix]
    paths:
      - .github/workflows/automatic-update-platforms.yml
      - scripts/automatic-update-platform-baseline.mjs
      - docs/upgrade-matrix.md
concurrency:
  group: upgrade-matrix-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  scheduler-proof:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[scheduler-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Prepare disposable user manager
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" -ne 0
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user show-environment > /dev/null
          printf 'XDG_RUNTIME_DIR=%s\nDBUS_SESSION_BUS_ADDRESS=%s\n' "$XDG_RUNTIME_DIR" "$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
      - name: Published installer 0.160.7 through daemon scheduler only
        shell: bash
        run: node scripts/automatic-update-platform-baseline.mjs --source 0.160.7 --layout installer --state daemon --method scheduler --output "$RUNNER_TEMP/upgrade-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduler-proof-0.160.7-linux
          path: ${{ runner.temp }}/upgrade-evidence
          if-no-files-found: error
  priority:
    if: "!contains(github.event.head_commit.message, '[scheduler-only]')"
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        source: ['0.163.5', '0.164.0']
        include:
          - os: ubuntu-24.04
            source: latest
          - os: ubuntu-24.04
            source: '0.160.7'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Prepare disposable Linux user manager
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$(id -u)" "$(id -u)" >> "$GITHUB_ENV"
      - name: Prioritized published upgrade cells
        shell: bash
        run: |
          failed=0
          if [ '${{ matrix.source }}' = '0.160.7' ]; then
            node scripts/automatic-update-platform-baseline.mjs --source 0.160.7 --layout npm --state fresh --method self --output "$RUNNER_TEMP/upgrade-evidence" || failed=1
            node scripts/automatic-update-platform-baseline.mjs --source 0.160.7 --layout npm --state fresh --prior-status true --method self --output "$RUNNER_TEMP/upgrade-evidence" || failed=1
          fi
          node scripts/automatic-update-platform-baseline.mjs --source '${{ matrix.source }}' --layout npm --state stale-extensions --method self --output "$RUNNER_TEMP/upgrade-evidence" || failed=1
          node scripts/automatic-update-platform-baseline.mjs --source '${{ matrix.source }}' --layout npm --state concurrent --method self --output "$RUNNER_TEMP/upgrade-evidence" || failed=1
          node scripts/automatic-update-platform-baseline.mjs --source '${{ matrix.source }}' --layout npm --state agent --method self --output "$RUNNER_TEMP/upgrade-evidence" || failed=1
          if [ '${{ matrix.source }}' = latest ]; then
            node scripts/automatic-update-platform-baseline.mjs --source latest --layout npm --state agent --method self --stop-agents true --output "$RUNNER_TEMP/upgrade-consent-evidence" || failed=1
          fi
          if [ '${{ runner.os }}' = macOS ] && [ '${{ matrix.source }}' = '0.164.0' ]; then
            node scripts/automatic-update-platform-baseline.mjs --source 0.164.0 --layout installer --state stale-extensions --stale-version 0.161.1 --method self --output "$RUNNER_TEMP/owner-mac-evidence" || failed=1
          fi
          if [ '${{ runner.os }}' != Windows ]; then
            node scripts/automatic-update-platform-baseline.mjs --source '${{ matrix.source }}' --layout installer --state stale-extensions --method installer --output "$RUNNER_TEMP/upgrade-evidence" || failed=1
            node scripts/automatic-update-platform-baseline.mjs --source '${{ matrix.source }}' --layout installer --state daemon --method scheduler --output "$RUNNER_TEMP/upgrade-evidence" || failed=1
          else
            node scripts/automatic-update-platform-baseline.mjs --source '${{ matrix.source }}' --layout npm --state daemon --method scheduler --output "$RUNNER_TEMP/upgrade-evidence" || failed=1
          fi
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: priority-${{ matrix.os }}-${{ matrix.source }}
          path: |
            ${{ runner.temp }}/upgrade-evidence
            ${{ runner.temp }}/upgrade-consent-evidence
            ${{ runner.temp }}/owner-mac-evidence
          if-no-files-found: error
  desktop-beside-cli:
    needs: priority
    if: "!contains(github.event.head_commit.message, '[scheduler-only]') && always() && !cancelled() && (needs.priority.result == 'success' || needs.priority.result == 'failure')"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: desktop-release-Linux-X64
          run-id: 43456519342
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/desktop-release
      - name: Verify released desktop package and prepare disposable user manager
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          package=$(find "$RUNNER_TEMP/desktop-release" -name 'Cotal_0.164.2_amd64.deb' -print -quit)
          test -n "$package"
          printf '%s  %s\n' 87921721f6dcdf01a454a8d62f8d15f12dee8fd2934a470f435e034f60ca5e9d "$package" | sha256sum -c -
          dpkg-deb -x "$package" "$RUNNER_TEMP/released-desktop"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$(id -u)" "$(id -u)" >> "$GITHUB_ENV"
      - name: Real released desktop daemon beside separate CLI
        shell: bash
        run: node scripts/automatic-update-platform-baseline.mjs --source 0.164.0 --layout npm --state daemon --method self --desktop-runtime "$RUNNER_TEMP/released-desktop/usr/lib/Cotal/runtime" --desktop-node "$RUNNER_TEMP/released-desktop/usr/bin/cotal-node" --output "$RUNNER_TEMP/upgrade-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-beside-cli-linux
          path: ${{ runner.temp }}/upgrade-evidence
          if-no-files-found: error
  workspace-native:
    needs: desktop-beside-cli
    if: "!contains(github.event.head_commit.message, '[scheduler-only]') && always() && !cancelled() && (needs.desktop-beside-cli.result == 'success' || needs.desktop-beside-cli.result == 'failure')"
    uses: ./.github/workflows/workspace-native.yml
    with:
      darwin: true
  seat-native:
    needs: workspace-native
    if: "!contains(github.event.head_commit.message, '[scheduler-only]') && always() && !cancelled() && needs.workspace-native.result == 'success'"
    strategy:
      max-parallel: 6
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --child-concurrency=2
      - run: pnpm --filter @cotal-ai/seat build
      - uses: actions/upload-artifact@v4
        with:
          name: upgrade-seat-${{ matrix.arch }}
          path: packages/seat/build/Release/linux-${{ matrix.arch }}/peercred.node
          if-no-files-found: error
  candidate-pack:
    needs: [workspace-native, seat-native]
    if: "!contains(github.event.head_commit.message, '[scheduler-only]') && always() && !cancelled() && needs.workspace-native.result == 'success' && needs.seat-native.result == 'success'"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --child-concurrency=2
      - run: pnpm --workspace-concurrency 3 build
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/native-inputs
      - name: Assemble the source-matched native closure
        run: |
          node scripts/seat-assemble-natives.mjs
          node scripts/workspace-assemble-natives.mjs
        env:
          SEAT_NATIVE_X64: ${{ runner.temp }}/native-inputs/upgrade-seat-x64/peercred.node
          SEAT_NATIVE_ARM64: ${{ runner.temp }}/native-inputs/upgrade-seat-arm64/peercred.node
          SEAT_NATIVE_DARWIN_X64: ${{ runner.temp }}/native-inputs/seat-native-darwin-x64/peercred.node
          SEAT_NATIVE_DARWIN_ARM64: ${{ runner.temp }}/native-inputs/seat-native-darwin-arm64/peercred.node
          SEAT_NATIVE_WIN32_X64: ${{ runner.temp }}/native-inputs/seat-native-win32-x64/peercred.node
          SEAT_NATIVE_WIN32_ARM64: ${{ runner.temp }}/native-inputs/seat-native-win32-arm64/peercred.node
          WORKSPACE_NATIVE_X64: ${{ runner.temp }}/native-inputs/workspace-native-x64
          WORKSPACE_NATIVE_ARM64: ${{ runner.temp }}/native-inputs/workspace-native-arm64
          WORKSPACE_NATIVE_DARWIN_X64: ${{ runner.temp }}/native-inputs/workspace-native-darwin-x64
          WORKSPACE_NATIVE_DARWIN_ARM64: ${{ runner.temp }}/native-inputs/workspace-native-darwin-arm64
      - name: Pack candidate B and A bootstrap versions without publishing
        run: |
          node scripts/automatic-update-platform-baseline.mjs --pack "$RUNNER_TEMP/candidate-B" --version B
          node scripts/automatic-update-platform-baseline.mjs --pack "$RUNNER_TEMP/candidate-A" --version A
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-candidate-B
          path: ${{ runner.temp }}/candidate-B
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-candidate-A
          path: ${{ runner.temp }}/candidate-A
          if-no-files-found: error
  candidate-B:
    needs: candidate-pack
    if: "!contains(github.event.head_commit.message, '[scheduler-only]') && always() && !cancelled() && needs.candidate-pack.result == 'success'"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      max-parallel: 6
      fail-fast: false
      matrix:
        source: ['0.164.0']
        layout: [npm]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --child-concurrency=2
      - uses: actions/download-artifact@v4
        with:
          name: upgrade-candidate-B
          path: ${{ runner.temp }}/candidate-B
      - name: Candidate B synthetic registry, real native processes
        run: node scripts/automatic-update-platform-baseline.mjs --candidate "$RUNNER_TEMP/candidate-B" --direction B --source '${{ matrix.source }}' --layout '${{ matrix.layout }}' --state fresh --method self --output "$RUNNER_TEMP/upgrade-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-B-${{ matrix.source }}-${{ matrix.layout }}
          path: ${{ runner.temp }}/upgrade-evidence
          if-no-files-found: error
  candidate-B-expanded:
    needs: candidate-A
    if: "!contains(github.event.head_commit.message, '[scheduler-only]') && always() && !cancelled() && needs.candidate-A.result == 'success'"
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        source: ['0.155.0', '0.160.7', '0.162.0', '0.163.5', '0.164.0', latest]
        layout: [npm, installer]
        exclude:
          - os: windows-2022
            layout: installer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --child-concurrency=2
      - uses: actions/download-artifact@v4
        with:
          name: upgrade-candidate-B
          path: ${{ runner.temp }}/candidate-B
      - name: Candidate B native state coverage
        shell: bash
        run: |
          failed=0
          for state in fresh configured stale-extensions recovery concurrent agent; do
            node scripts/automatic-update-platform-baseline.mjs --candidate "$RUNNER_TEMP/candidate-B" --direction B --source '${{ matrix.source }}' --layout '${{ matrix.layout }}' --state "$state" --method self --output "$RUNNER_TEMP/upgrade-evidence" || failed=1
            if [ '${{ matrix.layout }}' = installer ]; then
              node scripts/automatic-update-platform-baseline.mjs --candidate "$RUNNER_TEMP/candidate-B" --direction B --source '${{ matrix.source }}' --layout installer --state "$state" --method installer --candidate-installer "$RUNNER_TEMP/candidate-B/installer.sh" --output "$RUNNER_TEMP/upgrade-evidence" || failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-B-expanded-${{ matrix.os }}-${{ matrix.source }}-${{ matrix.layout }}
          path: ${{ runner.temp }}/upgrade-evidence
          if-no-files-found: error
  candidate-native:
    needs: candidate-B-expanded
    if: "!contains(github.event.head_commit.message, '[scheduler-only]') && always() && !cancelled() && (needs.candidate-B-expanded.result == 'success' || needs.candidate-B-expanded.result == 'failure')"
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        source: ['0.155.0', '0.160.7', '0.162.0', '0.163.5', '0.164.0', latest]
        layout: [npm, installer]
        direction: [B]
        method: [self, scheduler, installer]
        exclude:
          - os: windows-2022
            layout: installer
          - layout: npm
            method: installer
        include:
          - os: ubuntu-24.04
            source: latest
            layout: npm
            direction: A
            method: scheduler
          - os: macos-15
            source: latest
            layout: installer
            direction: A
            method: scheduler
          - os: windows-2022
            source: latest
            layout: npm
            direction: A
            method: scheduler
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --child-concurrency=2
      - uses: actions/download-artifact@v4
        with:
          name: upgrade-candidate-${{ matrix.direction }}
          path: ${{ runner.temp }}/candidate
      - name: Prepare disposable Linux user manager
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$(id -u)" "$(id -u)" >> "$GITHUB_ENV"
      - name: Candidate native daemon, synthetic registry and real supervisor
        shell: bash
        run: node scripts/automatic-update-platform-baseline.mjs --candidate "$RUNNER_TEMP/candidate" --direction '${{ matrix.direction }}' --candidate-installer "$RUNNER_TEMP/candidate/installer.sh" --source '${{ matrix.source }}' --layout '${{ matrix.layout }}' --state daemon --method '${{ matrix.method }}' --output "$RUNNER_TEMP/upgrade-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-native-${{ matrix.direction }}-${{ matrix.os }}-${{ matrix.source }}-${{ matrix.layout }}-${{ matrix.method }}
          path: ${{ runner.temp }}/upgrade-evidence
          if-no-files-found: error
  candidate-A:
    needs: candidate-B
    if: "!contains(github.event.head_commit.message, '[scheduler-only]') && always() && !cancelled() && needs.candidate-B.result == 'success'"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --child-concurrency=2
      - uses: actions/download-artifact@v4
        with:
          name: upgrade-candidate-A
          path: ${{ runner.temp }}/candidate-A
      - name: Candidate A below-latest source, public target with installed-version overlay metadata
        run: node scripts/automatic-update-platform-baseline.mjs --candidate "$RUNNER_TEMP/candidate-A" --direction A --source latest --layout npm --state fresh --method self --output "$RUNNER_TEMP/upgrade-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-A-linux
          path: ${{ runner.temp }}/upgrade-evidence
          if-no-files-found: error
  published:
    needs: candidate-native
    if: "!contains(github.event.head_commit.message, '[scheduler-only]') && always() && !cancelled() && github.event_name != 'push'"
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        source: ['0.155.0', '0.160.7', '0.162.0', '0.163.5', '0.164.0', latest]
        layout: [npm, installer]
        exclude:
          - os: windows-2022
            layout: installer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Published self-update states
        shell: bash
        run: |
          failed=0
          for state in fresh configured stale-extensions recovery concurrent agent; do
            node scripts/automatic-update-platform-baseline.mjs --source '${{ matrix.source }}' --layout '${{ matrix.layout }}' --state "$state" --method self --output "$RUNNER_TEMP/upgrade-evidence" || failed=1
          done
          exit "$failed"
      - name: Published installer rerun states
        if: "!contains(github.event.head_commit.message, '[scheduler-only]') && always() && matrix.layout == 'installer'"
        shell: bash
        run: |
          failed=0
          for state in fresh configured stale-extensions recovery concurrent agent; do
            node scripts/automatic-update-platform-baseline.mjs --source '${{ matrix.source }}' --layout installer --state "$state" --method installer --output "$RUNNER_TEMP/upgrade-evidence" || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-${{ matrix.os }}-${{ matrix.source }}-${{ matrix.layout }}
          path: ${{ runner.temp }}/upgrade-evidence
          if-no-files-found: error
  native:
    needs: published
    if: "!contains(github.event.head_commit.message, '[scheduler-only]') && always() && !cancelled() && github.event_name != 'push'"
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        source: ['0.155.0', '0.160.7', '0.162.0', '0.163.5', '0.164.0', latest]
        layout: [npm, installer]
        method: [self, scheduler, installer]
        exclude:
          - os: windows-2022
            layout: installer
          - layout: npm
            method: installer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Prepare disposable Linux user manager
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" -ne 0
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user show-environment > /dev/null
          printf 'XDG_RUNTIME_DIR=%s\nDBUS_SESSION_BUS_ADDRESS=%s\n' "$XDG_RUNTIME_DIR" "$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
      - name: Published automatic daemon state
        shell: bash
        run: node scripts/automatic-update-platform-baseline.mjs --source '${{ matrix.source }}' --layout '${{ matrix.layout }}' --state daemon --method '${{ matrix.method }}' --output "$RUNNER_TEMP/upgrade-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-native-${{ matrix.os }}-${{ matrix.source }}-${{ matrix.layout }}-${{ matrix.method }}
          path: ${{ runner.temp }}/upgrade-evidence
          if-no-files-found: error
