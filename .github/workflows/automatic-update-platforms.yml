                assert.equal(report.environment?.registryOverridden, false);
                assert.equal(report.candidate, undefined);
              }
              if (!['fresh', 'foreign-config-recovery'].includes(cell.scenario)) assert(report.extensionsBefore?.length >= 8, 'configured scenarios require populated extension inventory');
              const ok = name => report.assertions.some(a => a.name === name && a.passed === true);
              const assertions = {
                'target-version': report.target === plan.targetVersion && ok('CLI version is target') && ok('selected CLI reports target'),
                'extension-versions': ok('every recorded extension is at target') && ok('recorded extension package versions match target'),
                'inventory-preserved': ok('every prior extension remains recorded'),
                'status-healthy': ok('cotal status exits zero'),
                'no-recovery': ok('no paused recovery record'),
                'no-manual-intervention': ok('no manual step or refusal'),
                'installer-source-receipt': report.candidateInstaller?.source === plan.sourceSHA,
                'foreign-snapshot-retained': ok('foreign snapshot bytes remain untouched'),
                'container-manager-preserved': ok('foreign container Manager remains running and untouched') && ok('host selected remote user-sign-in mesh before upgrade') && report.participant?.remote === true && report.participant?.localManagerStarted === false,
                'native-scheduler': ok('scheduler completed within observation deadline') && ok('daemon scheduler performed a replacement or reported up to date'),
