name: Windows elevated cleanup advice observation
on:
  workflow_dispatch:
    inputs:
      source_sha:
        type: string
        required: true
        default: '2cc295ebe45f9215f7604d441c3236a2e8188265'
permissions:
  contents: read
  actions: read
jobs:
  observation:
    if: github.ref == 'refs/heads/measure/windows-cleanup-owner-advice' && inputs.source_sha == '2cc295ebe45f9215f7604d441c3236a2e8188265'
    strategy:
      fail-fast: false
      matrix:
        seed_integrity: [elevated, medium]
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Retrieve exact existing fixed-source installers and published baseline
        uses: actions/github-script@v8
        with:
          script: |
            const assert=require('node:assert/strict');
            const fs=require('node:fs'), path=require('node:path'), crypto=require('node:crypto');
            const out=path.join(process.env.RUNNER_TEMP,'owner-advice-inputs');fs.mkdirSync(out,{recursive:true});
            const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
            const source='2cc295ebe45f9215f7604d441c3236a2e8188265';
            const {data:run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:43860543912});
            assert.equal(run.head_sha,source);assert.equal(run.path,'.github/workflows/windows-setup-proof.yml');
            const artifacts=[
              {id:14224402097,name:'setup-candidate',run:43860543912,sha256:'cab3fd85d80e3b80dad26ae17f602ef99cf2c6e10251e6b7d6e7aa4d49158fc3',version:'0.164.1018'},
              {id:14224537668,name:'setup-synthetic-next',run:43860543912,sha256:'b416dc287bf5615e58b7a36711603958e2f8dae65ba469a3b9a21582d6c4a3c0',version:'0.164.2018'},
              {id:14228353387,name:'owner-advice-third',run:43870928447,sha256:'1ff639039376649df24fd5e2a4ed53bdba56377ec0837ae6fdfc7ebe19e72398',version:'0.164.3018'}];
            const {data:third}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:43870928447});
            assert.equal(third.head_sha,'aca44c8bd193852139b47efa3f0ca33d4d3fca57');
            for(const item of artifacts){
              const {data:a}=await github.rest.actions.getArtifact({...context.repo,artifact_id:item.id});
              assert.equal(a.name,item.name);assert.equal(a.workflow_run.id,item.run);assert.equal(a.digest,'sha256:'+item.sha256);assert(!a.expired);
              const {data:b}=await github.rest.actions.downloadArtifact({...context.repo,artifact_id:item.id,archive_format:'zip'});
              assert.equal(sha(Buffer.from(b)),item.sha256);fs.writeFileSync(path.join(out,item.version+'.zip'),Buffer.from(b));
            }
            const {data:release}=await github.rest.repos.getReleaseByTag({...context.repo,tag:'v0.164.18'});
            const asset=release.assets.find(a=>a.name==='Cotal_0.164.18_x64-setup.exe');assert(asset);
            assert.equal(asset.digest,'sha256:96fe18c73a461be889e272ceeccfa519a78f757757a52f3e4e06837d80c5d431');
            const response=await fetch(asset.browser_download_url);assert(response.ok);const bytes=Buffer.from(await response.arrayBuffer());
            assert.equal(sha(bytes),asset.digest.slice(7));fs.writeFileSync(path.join(out,asset.name),bytes);
            fs.writeFileSync(path.join(out,'origin.json'),JSON.stringify({source,product:'fae81a8237c06d374255bb7560ab0454ff799e02',measurement:context.sha,artifacts,published:{name:asset.name,id:asset.id,digest:asset.digest}},null,2));
      - name: Bind all four actual installer inputs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'owner-advice-inputs'
          Expand-Archive -LiteralPath "$out/0.164.1018.zip" -DestinationPath "$out/first"
          Expand-Archive -LiteralPath "$out/0.164.2018.zip" -DestinationPath "$out/second"
          Expand-Archive -LiteralPath "$out/0.164.3018.zip" -DestinationPath "$out/third"
          $origin=Get-Content -Raw "$out/origin.json" | ConvertFrom-Json
          $rows=@()
          foreach($r in @(@{version='0.164.18';path="$out/Cotal_0.164.18_x64-setup.exe";source='v0.164.18';kind='published'},@{version='0.164.1018';path="$out/first/Cotal_0.164.1018_x64-setup.exe";source='${{ inputs.source_sha }}';kind='fixed-observed'},@{version='0.164.2018';path="$out/second/Cotal_0.164.2018_x64-setup.exe";source='${{ inputs.source_sha }}';kind='fixed-observed'},@{version='0.164.3018';path="$out/third/Cotal_0.164.3018_x64-setup.exe";source='${{ inputs.source_sha }}';kind='fixed-observed'})){
            if(!(Test-Path -LiteralPath $r.path)){throw "Missing exact installer $($r.path)"}
            $rows+=@{version=$r.version;file=$r.path;source=$r.source;kind=$r.kind;sha256=(Get-FileHash $r.path -Algorithm SHA256).Hash.ToLowerInvariant()}
          }
          $rows | ConvertTo-Json -Depth 5 | Set-Content "$out/installers.json"
      - name: Measure actual elevated install repairs and two updates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'owner-advice'
          $null=New-Item -ItemType Directory -Path $out -Force
          $env:COTAL_ADVICE_SEED_INTEGRITY='${{ matrix.seed_integrity }}'
          $env:COTAL_ADVICE_INSTALLERS=Get-Content -Raw "$env:RUNNER_TEMP/owner-advice-inputs/installers.json"
          & node scripts/windows-cleanup-owner-advice.mjs *> "$out/driver.log"
          $code=$LASTEXITCODE
          Get-Content "$out/driver.log"
          if($code -ne 0){throw 'Owner advice observation failed; inspect original record'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-cleanup-owner-rights-${{ matrix.seed_integrity }}
          path: |
            ${{ runner.temp }}/owner-advice/
            ${{ runner.temp }}/owner-advice-inputs/origin.json
            ${{ runner.temp }}/owner-advice-inputs/installers.json
          if-no-files-found: error
