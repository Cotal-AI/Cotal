          const manifest = JSON.parse(bytes), bootstrap = JSON.parse(readFileSync(root + 'bootstrap.json'));
          assert.equal(manifest.source, process.env.PRODUCT_SOURCE);
          assert.equal(bootstrap.source, manifest.source);
          assert.equal(bootstrap.version, '0.164.4');
          assert.equal(manifest.packages.length, 24);
