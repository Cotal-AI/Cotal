name: Installed npm first up
on:
  workflow_dispatch:
    inputs:
      source_sha:
        type: string
        required: true
        default: dc78960217785242b01f5536da908d466ad44e1f
      candidate_run:
        type: string
        required: true
      candidate_artifact:
        type: string
        required: true
      candidate_digest:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  proof:
    if: github.ref == 'refs/heads/measure/checkout-manager-current-main-6906' && inputs.source_sha == 'dc78960217785242b01f5536da908d466ad44e1f'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --child-concurrency=2
      - name: Reuse new candidate's exact guarded release closure
        uses: actions/github-script@v8
        env:
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          CANDIDATE_ARTIFACT: ${{ inputs.candidate_artifact }}
          CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
          PRODUCT_SOURCE: ${{ inputs.source_sha }}
        with:
          script: |
            const assert=require('node:assert/strict');
            const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),cp=require('node:child_process');
            const runId=Number(process.env.CANDIDATE_RUN),id=Number(process.env.CANDIDATE_ARTIFACT),digest=process.env.CANDIDATE_DIGEST.replace(/^sha256:/,'');
            assert(Number.isSafeInteger(runId)&&runId>0&&Number.isSafeInteger(id)&&id>0);assert.match(digest,/^[a-f0-9]{64}$/);
            const {data:run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:runId});
            assert.equal(run.head_sha,process.env.PRODUCT_SOURCE);assert.equal(run.path,'.github/workflows/automatic-update-platforms.yml');
            const {data:artifact}=await github.rest.actions.getArtifact({...context.repo,artifact_id:id});
            assert.equal(artifact.name,'release-candidate');assert.equal(artifact.workflow_run.id,runId);assert.equal(artifact.digest,'sha256:'+digest);assert(!artifact.expired);
            const {data:archive}=await github.rest.actions.downloadArtifact({...context.repo,artifact_id:id,archive_format:'zip'});
            const bytes=Buffer.from(archive);assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'),digest);
            const zip=path.join(process.env.RUNNER_TEMP,'installed-up-candidate.zip'),destination=path.join(process.env.RUNNER_TEMP,'candidate');
            fs.writeFileSync(zip,bytes);fs.mkdirSync(destination);cp.execFileSync('unzip',['-q',zip,'-d',destination]);
            const manifest=JSON.parse(fs.readFileSync(path.join(destination,'manifest.json')));
            assert.equal(manifest.source,process.env.PRODUCT_SOURCE);assert(manifest.packages.every(p=>p.version==='0.165.0'));
            const out=path.join(process.env.RUNNER_TEMP,'installed-up');fs.mkdirSync(out);
            fs.writeFileSync(path.join(out,'candidate-origin.json'),JSON.stringify({product:manifest.source,measurement:context.sha,artifact:id,run:runId,digest},null,2));
      - name: Require FIRST up success in both inherited environments
        env:
          COTAL_UP_CANDIDATE: ${{ runner.temp }}/candidate
          COTAL_UP_OUTPUT: ${{ runner.temp }}/installed-up
        run: |
          set -euo pipefail
          node scripts/plain-npm-up-proof.mjs 2>&1 | tee "$COTAL_UP_OUTPUT/stdout.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-plain-npm-first-up
          path: ${{ runner.temp }}/installed-up/
          if-no-files-found: error
