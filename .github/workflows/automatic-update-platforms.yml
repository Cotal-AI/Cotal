name: Combined connector set acceptance
on:
  workflow_dispatch:
    inputs:
      source_sha:
        type: string
        required: true
      target_version:
        type: string
        default: '0.164.18'
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: connector-sets-final-${{ github.ref }}
  cancel-in-progress: false
env:
  PRODUCT_SOURCE: 41445f527952bf9d39f4179f0320a1d0e15ff257
jobs:
  windows-first:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Bind exact approved product source
        shell: pwsh
        run: |
          if ('${{ inputs.source_sha }}' -ne $env:PRODUCT_SOURCE -or '${{ inputs.target_version }}' -ne '0.164.18') { throw 'Unapproved measurement inputs' }
          if ((git rev-parse HEAD) -ne $env:PRODUCT_SOURCE) { throw 'Product checkout differs' }
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts --child-concurrency=2
      - name: Build real Windows primitives
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" exit /b 1
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -property installationPath`) do set "VS=%%i"
          if not defined VS exit /b 1
          call "%VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=amd64 -host_arch=amd64
          if errorlevel 1 exit /b 1
          node packages/workspace/scripts/build-native.mjs
          if errorlevel 1 exit /b 1
          node packages/seat/scripts/build-native.mjs --host
          if errorlevel 1 exit /b 1
      - name: Build ordinary binary dependency closure
        run: |
          pnpm --filter cotal-ai... --workspace-concurrency 3 build
          node_modules/.bin/tsc -p implementations/cli/tsconfig.json
          node_modules/.bin/tsc -p bin/tsconfig.json
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: diagnostic-source
          persist-credentials: false
      - name: Overlay only the authorized diagnostic smoke
        shell: pwsh
        run: |
          $file='bin/smoke/connector-set-cleanup-win32.smoke.ts'
          $out=Join-Path $env:RUNNER_TEMP 'windows-consuming-evidence'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $before=@{}
          foreach ($p in @('bin/execution-store.ts','packages/workspace/src/extension-set-win32.ts','packages/workspace/src/extension-set.ts')) { $before[$p]=(Get-FileHash -Algorithm SHA256 $p).Hash }
          Copy-Item -LiteralPath (Join-Path 'diagnostic-source' $file) -Destination $file
          if ((Get-FileHash $file).Hash -ne (Get-FileHash (Join-Path 'diagnostic-source' $file)).Hash) { throw 'Diagnostic smoke copy differs' }
          foreach ($p in $before.Keys) { if ((Get-FileHash -Algorithm SHA256 $p).Hash -ne $before[$p]) { throw "Product implementation changed: $p" } }
          git diff --exit-code -- bin/execution-store.ts packages/workspace/src/extension-set-win32.ts packages/workspace/src/extension-set.ts
          if ($LASTEXITCODE -ne 0) { throw 'Product implementation differs from approved source' }
          @{product=$env:PRODUCT_SOURCE;measurement='${{ github.sha }}';diagnosticFile=$file;diagnosticSha256=(Get-FileHash -Algorithm SHA256 $file).Hash;implementationSha256=$before} | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $out 'diagnostic-origin.json')
      - name: Windows consuming collector first and foreign-file tree reader
        shell: pwsh
        run: |
          $env:DO_NOT_TRACK='1'
          $out=Join-Path $env:RUNNER_TEMP 'windows-consuming-evidence'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          git rev-parse HEAD | Set-Content (Join-Path $out 'source.txt')
          $env:COTAL_OWNER_PROBE_OUTPUT=Join-Path $out 'collector'
          node --import tsx bin/smoke/connector-set-cleanup.smoke.ts 2>&1 | Tee-Object (Join-Path $out 'collector.log')
          if ($LASTEXITCODE -ne 0) { throw 'Native consuming collector failed' }
          $env:COTAL_OWNER_PROBE_OUTPUT=Join-Path $out 'reader'
          node --import tsx packages/workspace/smoke/extension-set-owner-win32.smoke.ts 2>&1 | Tee-Object (Join-Path $out 'reader.log')
          if ($LASTEXITCODE -ne 0) { throw 'Native tree reader failed' }
          @{source=$env:PRODUCT_SOURCE;collector='passed';reader='passed';platform='win32';arch='x64'} | ConvertTo-Json | Set-Content (Join-Path $out 'result.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connector-sets-windows-consuming
          path: ${{ runner.temp }}/windows-consuming-evidence
          if-no-files-found: error
  native:
    needs: windows-first
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {platform: linux, arch: x64, runner: ubuntu-24.04}
          - {platform: linux, arch: arm64, runner: ubuntu-24.04-arm}
          - {platform: darwin, arch: x64, runner: macos-15-intel}
          - {platform: darwin, arch: arm64, runner: macos-15}
          - {platform: win32, arch: x64, runner: windows-2022}
          - {platform: win32, arch: arm64, runner: windows-11-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Compile Unix primitives
        if: matrix.platform != 'win32'
        shell: bash
        run: |
          node packages/seat/scripts/build-native.mjs --host
          if [ '${{ matrix.platform }}' = darwin ]; then node packages/workspace/scripts/build-native.mjs; fi
      - name: Compile Windows primitives
        if: matrix.platform == 'win32'
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -property installationPath`) do set "VS=%%i"
          if not defined VS exit /b 1
          call "%VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=${{ fromJSON('{"x64":"amd64","arm64":"arm64"}')[matrix.arch] }} -host_arch=${{ fromJSON('{"x64":"amd64","arm64":"arm64"}')[matrix.arch] }}
          if errorlevel 1 exit /b 1
          node packages/workspace/scripts/build-native.mjs
          if errorlevel 1 exit /b 1
          node packages/seat/scripts/build-native.mjs --host
          if errorlevel 1 exit /b 1
      - uses: actions/upload-artifact@v4
        with:
          name: release-seat-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/seat/build/Release/${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.platform != 'linux'
        with:
          name: release-workspace-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/workspace/build/Release/${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
  pack:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          path: product
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --child-concurrency=2
      - run: pnpm install --frozen-lockfile --child-concurrency=2
        working-directory: product
      - run: pnpm --workspace-concurrency 3 build
        working-directory: product
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: ${{ runner.temp }}/natives
      - name: Assemble exact product native closure with normal guards
        working-directory: product
        run: |
          node scripts/seat-assemble-natives.mjs
          node scripts/workspace-assemble-natives.mjs
          node packages/seat/scripts/assert-shipped-natives.mjs
          node packages/workspace/scripts/assert-shipped-natives.mjs
        env:
          NATIVE_SOURCE: ${{ inputs.source_sha }}
          SEAT_NATIVE_X64: ${{ runner.temp }}/natives/release-seat-linux-x64/peercred.node
          SEAT_NATIVE_ARM64: ${{ runner.temp }}/natives/release-seat-linux-arm64/peercred.node
          SEAT_NATIVE_DARWIN_X64: ${{ runner.temp }}/natives/release-seat-darwin-x64/peercred.node
          SEAT_NATIVE_DARWIN_ARM64: ${{ runner.temp }}/natives/release-seat-darwin-arm64/peercred.node
          SEAT_NATIVE_WIN32_X64: ${{ runner.temp }}/natives/release-seat-win32-x64/peercred.node
          SEAT_NATIVE_WIN32_ARM64: ${{ runner.temp }}/natives/release-seat-win32-arm64/peercred.node
          WORKSPACE_NATIVE_X64: ${{ runner.temp }}/natives/release-workspace-win32-x64
          WORKSPACE_NATIVE_ARM64: ${{ runner.temp }}/natives/release-workspace-win32-arm64
          WORKSPACE_NATIVE_DARWIN_X64: ${{ runner.temp }}/natives/release-workspace-darwin-x64
          WORKSPACE_NATIVE_DARWIN_ARM64: ${{ runner.temp }}/natives/release-workspace-darwin-arm64
      - name: Guarded A, B and C from the same clean product commit
        run: |
          node scripts/automatic-update-platform-baseline.mjs --pack "$RUNNER_TEMP/A" --version 0.164.18 --source-root "$GITHUB_WORKSPACE/product"
          node scripts/pack-candidate-next.mjs --source-root "$GITHUB_WORKSPACE/product" --candidate "$RUNNER_TEMP/A" --output "$RUNNER_TEMP/B"
          node scripts/pack-candidate-next.mjs --source-root "$GITHUB_WORKSPACE/product" --candidate "$RUNNER_TEMP/A" --output "$RUNNER_TEMP/C" --offset 2000
      - uses: actions/upload-artifact@v4
        with:
          name: connector-set-packs
          path: |
            ${{ runner.temp }}/A
            ${{ runner.temp }}/B
            ${{ runner.temp }}/C
          if-no-files-found: error
  linux-acceptance:
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --child-concurrency=2
      - uses: actions/download-artifact@v4
        with:
          name: connector-set-packs
          path: ${{ runner.temp }}/packs
      - name: Prepare verified broker executable
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/broker"
          curl -fsSL https://github.com/nats-io/nats-server/releases/download/v2.14.0/nats-server-v2.14.0-linux-amd64.tar.gz -o "$RUNNER_TEMP/broker/nats-server.tar.gz"
          curl -fsSL https://github.com/nats-io/nats-server/releases/download/v2.14.0/SHA256SUMS -o "$RUNNER_TEMP/broker/SHA256SUMS"
          (cd "$RUNNER_TEMP/broker" && awk '$2 == "nats-server-v2.14.0-linux-amd64.tar.gz" {print $1 "  nats-server.tar.gz"}' SHA256SUMS > selected.sha256 && test -s selected.sha256 && sha256sum -c selected.sha256)
          tar -xzf "$RUNNER_TEMP/broker/nats-server.tar.gz" -C "$RUNNER_TEMP/broker"
          echo "$RUNNER_TEMP/broker/nats-server-v2.14.0-linux-amd64" >> "$GITHUB_PATH"
      - name: Same-install old Manager, npm and pnpm IDs, live retention and missing set
        run: node scripts/connector-sets-final-acceptance.mjs --packs "$RUNNER_TEMP/packs" --source '${{ inputs.source_sha }}' --output "$RUNNER_TEMP/connector-set-evidence"
      - name: Legacy shared-store migration preserves removals and bytes
        run: node scripts/connector-sets-final-migration.mjs --packs "$RUNNER_TEMP/packs" --source '${{ inputs.source_sha }}' --output "$RUNNER_TEMP/connector-migration-evidence"
      - name: Actual removal denial remains nonfatal under the real cleaner
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/protected-cleanup-root"
          chmod 700 "$RUNNER_TEMP/protected-cleanup-root"
          pnpm --filter cotal-ai... --workspace-concurrency 3 build
          TMPDIR="$RUNNER_TEMP/protected-cleanup-root" pnpm exec tsx bin/smoke/connector-set-cleanup.smoke.ts | tee "$RUNNER_TEMP/connector-set-evidence/removal-failure.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connector-sets-linux-acceptance
          path: |
            ${{ runner.temp }}/connector-set-evidence
            ${{ runner.temp }}/connector-migration-evidence
          if-no-files-found: error
  desktop:
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          path: desktop-product
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --child-concurrency=2
      - uses: actions/download-artifact@v4
        with:
          name: connector-set-packs
          path: ${{ runner.temp }}/packs
      - uses: actions/download-artifact@v4
        with:
          name: desktop-release-Linux-X64
          run-id: 43456519342
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/desktop-release
      - name: Verify actual released desktop and prepare user manager
        run: |
          package=$(find "$RUNNER_TEMP/desktop-release" -name 'Cotal_0.164.2_amd64.deb' -print -quit)
          test -n "$package"
          printf '%s  %s\n' 87921721f6dcdf01a454a8d62f8d15f12dee8fd2934a470f435e034f60ca5e9d "$package" | sha256sum -c -
          dpkg-deb -x "$package" "$RUNNER_TEMP/released-desktop"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$(id -u)" "$(id -u)" >> "$GITHUB_ENV"
      - name: Prepare verified broker executable
        run: |
          mkdir -p "$RUNNER_TEMP/broker"
          curl -fsSL https://github.com/nats-io/nats-server/releases/download/v2.14.0/nats-server-v2.14.0-linux-amd64.tar.gz -o "$RUNNER_TEMP/broker/nats-server.tar.gz"
          curl -fsSL https://github.com/nats-io/nats-server/releases/download/v2.14.0/SHA256SUMS -o "$RUNNER_TEMP/broker/SHA256SUMS"
          (cd "$RUNNER_TEMP/broker" && awk '$2 == "nats-server-v2.14.0-linux-amd64.tar.gz" {print $1 "  nats-server.tar.gz"}' SHA256SUMS > selected.sha256 && test -s selected.sha256 && sha256sum -c selected.sha256)
          tar -xzf "$RUNNER_TEMP/broker/nats-server.tar.gz" -C "$RUNNER_TEMP/broker"
          echo "$RUNNER_TEMP/broker/nats-server-v2.14.0-linux-amd64" >> "$GITHUB_PATH"
      - run: pnpm --filter @cotal-ai/auth... --workspace-concurrency 3 build
      - name: Build genuine product desktop runtimes A and B
        run: |
          pnpm --dir desktop-product install --frozen-lockfile --child-concurrency=2
          pnpm exec node scripts/connector-sets-runtime-build.mjs --source "$GITHUB_WORKSPACE/desktop-product" --output "$RUNNER_TEMP/desktop-A" --version 0.164.18
          pnpm exec node scripts/connector-sets-runtime-build.mjs --source "$GITHUB_WORKSPACE/desktop-product" --output "$RUNNER_TEMP/desktop-B" --version 0.164.1018
      - name: Released desktop beside CLI update
        run: |
          node --import tsx --input-type=module - --source 0.164.18 --layout npm --state daemon --method self --candidate "$RUNNER_TEMP/packs/A" --candidate-next "$RUNNER_TEMP/packs/B" --next-hop-source candidate --next-hop-phase candidate --running-desktop-beside-cli true --expected-target 0.164.1018 --desktop-runtime "$RUNNER_TEMP/released-desktop/usr/lib/Cotal/runtime" --desktop-node "$RUNNER_TEMP/released-desktop/usr/bin/cotal-node" --output "$RUNNER_TEMP/desktop-neighbor-evidence" <<'NODE'
          import { matrixCell, cellExitCode } from './scripts/automatic-update-platform-baseline.mjs';
          import { prepareUpdateParticipant } from './implementations/auth/smoke/update-participant.fixture.ts';
          const args = process.argv.slice(2);
          const options = Object.fromEntries(args.reduce((rows, value, index, all) => index % 2 === 0 ? [...rows, [value.slice(2), all[index + 1]]] : rows, []));
          options.prepare = prepareUpdateParticipant;
          process.exitCode = cellExitCode(await matrixCell(options));
          NODE
      - name: Inverse desktop-first with original CLI Manager and new spawn
        run: |
          mv "$RUNNER_TEMP/released-desktop/usr/lib/Cotal/runtime" "$RUNNER_TEMP/desktop-legacy-retired"
          node scripts/connector-sets-desktop-first.mjs --cli-candidate "$RUNNER_TEMP/packs/A" --desktop-candidate-A "$RUNNER_TEMP/desktop-A/runtime" --desktop-next "$RUNNER_TEMP/desktop-B/runtime" --desktop-node "$RUNNER_TEMP/desktop-A/cotal-node" --desktop-runtime "$RUNNER_TEMP/released-desktop/usr/lib/Cotal/runtime" --output "$RUNNER_TEMP/desktop-first-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connector-sets-desktop-bidirectional
          path: |
            ${{ runner.temp }}/desktop-neighbor-evidence
            ${{ runner.temp }}/desktop-first-evidence
          if-no-files-found: error
