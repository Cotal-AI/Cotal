      - name: Retrieve original candidate without rebuilding
        uses: actions/github-script@v8
        with:
          script: |
            const assert = require('node:assert/strict');
            const { createHash } = require('node:crypto');
            const { writeFileSync } = require('node:fs');
            const { join } = require('node:path');
            const artifact_id = 14084125820;
            const expected = 'e10786970077b6e035606b37a81531a9f35137a8155345e53a275858cd387430';
            const { data: identity } = await github.rest.actions.getArtifact({ ...context.repo, artifact_id });
            assert.equal(identity.workflow_run.id, 43521878657);
            assert.equal(identity.name, 'transition-candidate-A');
            assert.equal(identity.digest, `sha256:${expected}`);
            assert.equal(identity.expired, false);
            const { data } = await github.rest.actions.downloadArtifact({ ...context.repo, artifact_id, archive_format: 'zip' });
            const bytes = Buffer.from(data);
            assert.equal(createHash('sha256').update(bytes).digest('hex'), expected);
            writeFileSync(join(process.env.RUNNER_TEMP, 'candidate-A.zip'), bytes);
            writeFileSync(join(process.env.RUNNER_TEMP, 'candidate-origin.json'), JSON.stringify({ artifact_id, run: 43521878657, sha256: expected }));
      - name: Verify original candidate source and manifest
        shell: bash
