              actual.push({ id: cell.id, status: genuine ? report.result : 'failed', assertions });
            }
          }
          const verdict = verifyResults(plan.cells, actual);
          writeFileSync(join(root, 'census.json'), JSON.stringify(verdict, null, 2));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n## Expected coordinate census\n\n${verdict.passed.length}/${verdict.requiredCount} required cells passed. Acceptance: ${verdict.acceptance}.\n\n${verdict.failures.join('\n')}\n`);
          if (!verdict.acceptance) process.exitCode = 1;
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-summary
          path: ${{ runner.temp }}/upgrade-results
          if-no-files-found: error
