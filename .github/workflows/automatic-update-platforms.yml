name: Upgrade matrix
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: [Changesets]
    types: [completed]
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [candidate, published]
        required: true
      target_version:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      profile:
        type: choice
        options: [bounded, extended]
        default: bounded
        required: true
  push:
    branches: [test/upgrade-matrix]
    paths:
      - .github/workflows/automatic-update-platforms.yml
      - scripts/automatic-update-platform-baseline.mjs
      - docs/upgrade-matrix.md
# No workflow-level queue: every immutable PR head and publication must finish.
permissions:
  contents: read
  actions: read
env:
  PRODUCT_SOURCE: 252d3a03f3550a784c7784efc57155e70a7e5d83
jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      applicable: ${{ steps.plan.outputs.applicable }}
      phase: ${{ steps.plan.outputs.phase }}
      source: ${{ steps.plan.outputs.source }}
      target: ${{ steps.plan.outputs.target }}
      profile: ${{ steps.plan.outputs.profile }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # On workflow_run this is the trusted default-branch workflow revision, never PR code.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Freeze applicability and immutable target
        id: plan
        uses: actions/github-script@v8
        with:
          script: |
            const assert = require('node:assert/strict');
            const { mkdirSync, writeFileSync } = require('node:fs');
            const { pathToFileURL } = require('node:url');
            const { execFileSync } = require('node:child_process');
            const { planPhase, boundedCells, jobsMatrix, compareVersions } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/upgrade-matrix-plan.mjs`));
            const event = context.payload;
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const metadata = { eventName: context.eventName, repository };
            let source, phase;
            let publication;
            if (context.eventName === 'pull_request') {
              const pr = event.pull_request;
              if (pr.base.ref === 'main' && pr.head.ref === 'changeset-release/main' && pr.head.repo.full_name === repository && pr.base.repo.full_name === repository) {
                source = pr.head.sha;
                phase = 'candidate';
              }
            } else if (context.eventName === 'workflow_dispatch') {
              source = event.inputs.source_sha;
              phase = event.inputs.phase;
            } else if (context.eventName === 'workflow_run') {
              const run = event.workflow_run;
              if (run.name === 'Changesets' && run.status === 'completed' && run.head_branch === 'main' && run.head_repository?.full_name === repository && event.repository.full_name === repository) {
                const { data: actual } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: run.id });
                assert.equal(actual.head_sha, run.head_sha);
                assert.equal(actual.head_branch, 'main');
                assert.equal(actual.head_repository.full_name, repository);
                assert.equal(actual.path, '.github/workflows/changesets.yml');
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { ...context.repo, run_id: run.id, filter: 'latest', per_page: 100 });
                const publish = jobs.find(job => job.name === 'publish');
                const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { ...context.repo, run_id: run.id, per_page: 100 });
                const receipts = artifacts.filter(artifact => artifact.name === 'upgrade-publication' && !artifact.expired);
                assert(receipts.length <= 1, 'ambiguous publication receipt');
                if (publish?.conclusion === 'success' && receipts.length === 1) {
                  const artifact = receipts[0];
                  assert.equal(artifact.workflow_run.id, run.id);
                  assert.equal(artifact.workflow_run.head_sha, run.head_sha);
                  const { data: archive } = await github.rest.actions.downloadArtifact({ ...context.repo, artifact_id: artifact.id, archive_format: 'zip' });
                  const zip = `${process.env.RUNNER_TEMP}/upgrade-publication.zip`;
                  writeFileSync(zip, Buffer.from(archive));
                  publication = JSON.parse(execFileSync('unzip', ['-p', zip, 'publication.json'], { encoding: 'utf8', maxBuffer: 1024 * 1024 }));
                  assert.equal(publication.sourceSHA, run.head_sha);
                  assert.equal(String(publication.runId), String(run.id));
                  assert.equal(publication.published, true);
                  assert.equal(publication.promoted, true);
                }
                const published = Boolean(publication);
                if (published) {
                  // The public webhook identifies the repository at the event root.
                  event.workflow_run.repository = event.repository;
                  source = run.head_sha;
                  phase = 'published';
                  metadata.published = true;
                  metadata.publishJobConclusion = 'success';
                }
              }
            }
            if (source) {
              assert.match(source, /^[a-f0-9]{40}$/);
              assert(['candidate', 'published'].includes(phase));
              const { data } = await github.rest.repos.getContent({ ...context.repo, path: 'bin/package.json', ref: source });
              assert.equal(data.type, 'file');
              metadata.packageManifest = JSON.parse(Buffer.from(data.content, 'base64').toString());
              metadata.targetVersion = metadata.packageManifest.version;
              if (publication) assert.equal(publication.version, metadata.targetVersion);
              if (context.eventName === 'workflow_dispatch') assert.equal(event.inputs.target_version, metadata.targetVersion, 'manual target must match the immutable source manifest');
              assert(compareVersions(metadata.targetVersion, '0.164.6') > 0, 'target must upgrade the fixed published baseline');
              const response = await fetch('https://registry.npmjs.org/cotal-ai');
              assert(response.ok, 'public npm metadata unavailable');
              const registry = await response.json();
              if (phase === 'candidate') assert(compareVersions(metadata.targetVersion, registry['dist-tags'].latest) > 0, 'candidate target must be newer than public latest');
              else assert.equal(registry.versions[metadata.targetVersion]?.version, metadata.targetVersion, 'exact published target not present on npm');
            }
            const plan = planPhase(event, metadata);
            assert(plan.status !== 'planned' || plan.profile === 'bounded', 'extended profile is not implemented by durable orchestration');
            const cells = boundedCells(plan);
            mkdirSync(`${process.env.RUNNER_TEMP}/upgrade-plan`, { recursive: true });
            writeFileSync(`${process.env.RUNNER_TEMP}/upgrade-plan/plan.json`, JSON.stringify({ ...plan, cells }, null, 2));
            core.setOutput('applicable', String(plan.status === 'planned'));
            for (const [key, value] of Object.entries({ phase: plan.phase, source: plan.sourceSHA, target: plan.targetVersion, profile: plan.profile, matrix: JSON.stringify(jobsMatrix(cells)) })) core.setOutput(key, value ?? '');
            await core.summary.addHeading('Upgrade matrix selection').addRaw(plan.status === 'skipped' ? `Not applicable: ${plan.reason}` : `${plan.phase}: ${plan.targetVersion} from ${plan.sourceSHA}, ${cells.filter(c => c.required).length} isolated cells`).write();
      - uses: actions/upload-artifact@v4
        with:
          name: upgrade-plan
          path: ${{ runner.temp }}/upgrade-plan
          if-no-files-found: error
  release-native:
    needs: select
    if: needs.select.outputs.applicable == 'true' && needs.select.outputs.phase == 'candidate'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { platform: linux, arch: x64, runner: ubuntu-24.04 }
          - { platform: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { platform: darwin, arch: x64, runner: macos-15-intel }
          - { platform: darwin, arch: arm64, runner: macos-15 }
          - { platform: win32, arch: x64, runner: windows-latest }
          - { platform: win32, arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.select.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Compile Unix host primitives
        if: matrix.platform != 'win32'
        shell: bash
        run: |
          node packages/seat/scripts/build-native.mjs --host
          if [ '${{ matrix.platform }}' = darwin ]; then
            node packages/workspace/scripts/build-native.mjs
          fi
      - name: Compile Windows host primitives and process identity
        if: matrix.platform == 'win32'
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" exit /b 1
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -property installationPath`) do set "VS=%%i"
          if not defined VS exit /b 1
          call "%VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=${{ fromJSON('{"x64":"amd64","arm64":"arm64"}')[matrix.arch] }} -host_arch=${{ fromJSON('{"x64":"amd64","arm64":"arm64"}')[matrix.arch] }}
          if errorlevel 1 exit /b 1
          node packages/workspace/scripts/build-native.mjs
          if errorlevel 1 exit /b 1
          node packages/seat/scripts/build-native.mjs --host
          if errorlevel 1 exit /b 1
      - uses: actions/upload-artifact@v4
        with:
          name: release-seat-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/seat/build/Release/${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.platform != 'linux'
        with:
          name: release-workspace-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/workspace/build/Release/${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
  release-pack:
    needs: [select, release-native]
    if: needs.select.outputs.phase == 'candidate' && needs.release-native.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.candidate.outputs.artifact-id }}
      digest: ${{ steps.candidate.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.select.outputs.source }}
          path: product
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Require pack-runner disk budget
        run: node -e "const s=require('node:fs').statfsSync(process.env.RUNNER_TEMP);if(s.bavail*s.bsize<20*1024**3)throw Error('Less than 20 GiB free before candidate installation and build')"
      - run: pnpm install --frozen-lockfile --child-concurrency=2
      - run: pnpm install --frozen-lockfile --child-concurrency=2
        working-directory: product
      - run: pnpm --workspace-concurrency 3 build
        working-directory: product
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release-natives
      - name: Assemble and guard the complete source-matched native closure
        working-directory: product
        run: |
          node scripts/seat-assemble-natives.mjs
          node scripts/workspace-assemble-natives.mjs
          node packages/seat/scripts/assert-shipped-natives.mjs
          node packages/workspace/scripts/assert-shipped-natives.mjs
        env:
          NATIVE_SOURCE: ${{ needs.select.outputs.source }}
          SEAT_NATIVE_X64: ${{ runner.temp }}/release-natives/release-seat-linux-x64/peercred.node
          SEAT_NATIVE_ARM64: ${{ runner.temp }}/release-natives/release-seat-linux-arm64/peercred.node
          SEAT_NATIVE_DARWIN_X64: ${{ runner.temp }}/release-natives/release-seat-darwin-x64/peercred.node
          SEAT_NATIVE_DARWIN_ARM64: ${{ runner.temp }}/release-natives/release-seat-darwin-arm64/peercred.node
          SEAT_NATIVE_WIN32_X64: ${{ runner.temp }}/release-natives/release-seat-win32-x64/peercred.node
          SEAT_NATIVE_WIN32_ARM64: ${{ runner.temp }}/release-natives/release-seat-win32-arm64/peercred.node
          WORKSPACE_NATIVE_X64: ${{ runner.temp }}/release-natives/release-workspace-win32-x64
          WORKSPACE_NATIVE_ARM64: ${{ runner.temp }}/release-natives/release-workspace-win32-arm64
          WORKSPACE_NATIVE_DARWIN_X64: ${{ runner.temp }}/release-natives/release-workspace-darwin-x64
          WORKSPACE_NATIVE_DARWIN_ARM64: ${{ runner.temp }}/release-natives/release-workspace-darwin-arm64
      - name: Pack exact candidate version using the guarded harness packer
        env:
          TARGET_VERSION: ${{ needs.select.outputs.target }}
          SOURCE_SHA: ${{ needs.select.outputs.source }}
        run: |
          node scripts/automatic-update-platform-baseline.mjs --pack "$RUNNER_TEMP/release-candidate" --version "$TARGET_VERSION" --source-root "$GITHUB_WORKSPACE/product"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/release-candidate/manifest.json'));
          assert.equal(manifest.source, process.env.SOURCE_SHA);
          assert(manifest.packages.every(pkg => pkg.version === process.env.TARGET_VERSION));
          assert.equal(manifest.packages.length, 24);
          NODE
      - uses: actions/upload-artifact@v4
        id: candidate
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release-candidate
          if-no-files-found: error
  release-cells:
    needs: [select, release-pack]
    if: always() && needs.select.result == 'success' && needs.select.outputs.applicable == 'true' && (needs.select.outputs.phase == 'published' || needs.release-pack.result == 'success')
    name: upgrade-${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --child-concurrency=2
      - uses: actions/download-artifact@v4
        if: needs.select.outputs.phase == 'candidate'
        with:
          artifact-ids: ${{ needs.release-pack.outputs.artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-candidate
      - name: Verify candidate immutable source and full package census
        if: needs.select.outputs.phase == 'candidate'
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.select.outputs.source }}
          TARGET_VERSION: ${{ needs.select.outputs.target }}
          CANDIDATE_ARTIFACT: ${{ needs.release-pack.outputs.artifact }}
          CANDIDATE_DIGEST: ${{ needs.release-pack.outputs.digest }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, mkdirSync, writeFileSync } from 'node:fs';
          const root = process.env.RUNNER_TEMP + '/release-candidate/';
          const manifest = JSON.parse(readFileSync(root + 'manifest.json'));
          const bootstrap = JSON.parse(readFileSync(root + 'bootstrap.json'));
          assert.equal(manifest.source, process.env.SOURCE_SHA);
          assert.equal(bootstrap.source, manifest.source);
          assert.equal(bootstrap.version, process.env.TARGET_VERSION);
          assert.equal(manifest.packages.length, 24);
          assert(manifest.packages.every(pkg => pkg.version === process.env.TARGET_VERSION));
          mkdirSync(process.env.RUNNER_TEMP + '/upgrade-evidence', { recursive: true });
          writeFileSync(process.env.RUNNER_TEMP + '/upgrade-evidence/candidate-origin.json', JSON.stringify({ source: manifest.source, artifact: process.env.CANDIDATE_ARTIFACT, digest: process.env.CANDIDATE_DIGEST }));
          NODE
      - name: Prepare disposable Linux user manager
        if: matrix.platform == 'linux' && matrix.scenario == 'daemon-scheduler'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" -ne 0
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$(id -u)" "$(id -u)" >> "$GITHUB_ENV"
      - name: Prepare owned broker fixture dependencies
        if: matrix.platform == 'linux' && (matrix.scenario == 'container-manager' || matrix.scenario == 'agent-stop-consent')
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/matrix-broker"
          mkdir -p "$work"
          curl -fsSL https://github.com/nats-io/nats-server/releases/download/v2.14.0/nats-server-v2.14.0-linux-amd64.tar.gz -o "$work/nats-server.tar.gz"
          curl -fsSL https://github.com/nats-io/nats-server/releases/download/v2.14.0/SHA256SUMS -o "$work/SHA256SUMS"
          (cd "$work" && awk '$2 == "nats-server-v2.14.0-linux-amd64.tar.gz" {print $1 "  nats-server.tar.gz"}' SHA256SUMS > selected.sha256 && test -s selected.sha256 && sha256sum -c selected.sha256)
          tar -xzf "$work/nats-server.tar.gz" -C "$work"
          echo "$work/nats-server-v2.14.0-linux-amd64" >> "$GITHUB_PATH"
      - name: Build only the signed-in participant fixture dependencies
        if: matrix.scenario == 'container-manager'
        shell: bash
        run: |
          node --input-type=module -e "import {statfsSync} from 'node:fs'; const d=statfsSync('.'); if(d.bavail*d.bsize<20*1024**3) throw Error('Less than 20 GiB before fixture build');"
          pnpm --filter @cotal-ai/auth... --workspace-concurrency 3 build
      - name: Run one real product upgrade coordinate
        shell: bash
        env:
          CELL: ${{ toJSON(matrix) }}
          PHASE: ${{ needs.select.outputs.phase }}
        run: |
          node --import tsx --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { pathToFileURL } from 'node:url';
          import { mkdirSync, writeFileSync } from 'node:fs';
          const cell = JSON.parse(process.env.CELL);
          const directory = process.env.RUNNER_TEMP + '/upgrade-evidence';
          mkdirSync(directory, { recursive: true });
          writeFileSync(directory + '/coordinate.json', JSON.stringify(cell));
          const states = { fresh: 'fresh', configured: 'configured', 'stale-self': 'stale-extensions', 'configured-rerun': 'configured', 'daemon-scheduler': 'daemon', 'agent-stop-consent': 'agent', 'foreign-config-recovery': 'recovery', 'container-manager': 'configured' };
          const method = cell.scenario === 'configured-rerun' ? 'installer' : cell.scenario === 'daemon-scheduler' ? 'scheduler' : 'self';
          const args = ['scripts/automatic-update-platform-baseline.mjs', '--source', '0.164.6', '--layout', cell.channel, '--state', states[cell.scenario], '--method', method, '--expected-target', cell.targetVersion, '--output', directory];
          if (process.env.PHASE === 'candidate') {
            const candidate = process.env.RUNNER_TEMP + '/release-candidate';
            args.push('--candidate', candidate, '--direction', 'B');
            if (method === 'installer') args.push('--candidate-installer', candidate + '/installer.sh');
          }
          if (cell.scenario === 'agent-stop-consent') args.push('--stop-agents', 'true');
          if (cell.scenario === 'foreign-config-recovery') args.push('--foreign-config-snapshot', 'true');
          if (cell.scenario === 'container-manager') args.push('--container-manager', 'true');
          if (cell.platform === 'darwin' && method === 'scheduler') {
            args.push('--launchd-proof', 'transition');
            if (process.env.PHASE === 'published') args.push('--published-launchd', 'true');
          }
          if (cell.scenario === 'container-manager') {
            const { matrixCell, cellExitCode } = await import(pathToFileURL(process.cwd() + '/scripts/automatic-update-platform-baseline.mjs'));
            const { prepareUpdateParticipant } = await import(pathToFileURL(process.cwd() + '/implementations/auth/smoke/update-participant.fixture.ts'));
            const options = Object.fromEntries(args.slice(1).reduce((rows, value, index, all) => index % 2 === 0 ? [...rows, [value.slice(2), all[index + 1]]] : rows, []));
            const report = await matrixCell({ ...options, prepare: prepareUpdateParticipant });
            process.exitCode = cellExitCode(report);
          } else {
            const result = spawnSync(process.execPath, args, { stdio: 'inherit' });
            if (result.error) throw result.error;
            process.exitCode = result.status ?? 1;
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-cell-${{ matrix.id }}
          path: ${{ runner.temp }}/upgrade-evidence
          if-no-files-found: error
  release-summary:
    needs: [select, release-native, release-pack, release-cells]
    if: always() && needs.select.outputs.applicable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: upgrade-plan
          path: ${{ runner.temp }}/upgrade-plan
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: upgrade-cell-*
          path: ${{ runner.temp }}/upgrade-results
      - name: Render raw harness evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/upgrade-results"
          node scripts/automatic-update-platform-baseline.mjs --summary "$RUNNER_TEMP/upgrade-results"
          cat "$RUNNER_TEMP/upgrade-results/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify expected coordinate census and assertion contract
        if: always()
        shell: bash
        env:
          EXPECTED_CANDIDATE_ARTIFACT: ${{ needs.release-pack.outputs.artifact }}
          EXPECTED_CANDIDATE_DIGEST: ${{ needs.release-pack.outputs.digest }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readdirSync, readFileSync, mkdirSync, writeFileSync, existsSync, appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { verifyResults } from './scripts/upgrade-matrix-plan.mjs';
          const root = process.env.RUNNER_TEMP + '/upgrade-results';
          mkdirSync(root, { recursive: true });
          const plan = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/upgrade-plan/plan.json'));
          const actual = [];
          for (const entry of readdirSync(root, { withFileTypes: true }).filter(x => x.isDirectory())) {
            const directory = join(root, entry.name);
            if (!existsSync(join(directory, 'coordinate.json'))) continue;
            const cell = JSON.parse(readFileSync(join(directory, 'coordinate.json')));
            const expected = plan.cells.find(candidate => candidate.id === cell.id && candidate.required);
            assert(expected, 'evidence coordinate must be required by the frozen plan');
            assert.deepEqual(cell, expected, 'complete evidence coordinate must match the frozen plan');
            assert.equal(entry.name, `upgrade-cell-${cell.id}`, 'artifact name must match its coordinate');
            if (plan.phase === 'candidate') {
              const origin = JSON.parse(readFileSync(join(directory, 'candidate-origin.json')));
              assert.equal(origin.source, plan.sourceSHA);
              assert.equal(origin.artifact, process.env.EXPECTED_CANDIDATE_ARTIFACT);
              assert.equal(origin.digest, process.env.EXPECTED_CANDIDATE_DIGEST);
              assert(origin.artifact && origin.digest, 'candidate artifact identity must be present');
            }
            const reports = readdirSync(directory).filter(x => x.endsWith('.json')).map(x => JSON.parse(readFileSync(join(directory, x)))).filter(x => x.tier && Array.isArray(x.assertions));
            assert.equal(reports.length, 1, 'each coordinate must have exactly one raw harness report');
            for (const report of reports) {
              const states = { fresh: 'fresh', configured: 'configured', 'stale-self': 'stale-extensions', 'configured-rerun': 'configured', 'daemon-scheduler': 'daemon', 'agent-stop-consent': 'agent', 'foreign-config-recovery': 'recovery', 'container-manager': 'configured' };
              const method = cell.scenario === 'configured-rerun' ? 'installer' : cell.scenario === 'daemon-scheduler' ? 'scheduler' : 'self';
              assert.equal(report.layout, cell.channel);
              assert.equal(report.state, states[cell.scenario]);
              assert.equal(report.method, method);
              assert.equal(report.source, '0.164.6');
              assert.equal(report.target, plan.targetVersion);
              if (plan.phase === 'candidate') {
                assert.equal(report.tier, 'candidate-B (synthetic registry, real native processes)');
                assert.equal(report.candidate?.direction, 'B');
                assert.equal(report.environment?.registryOverridden, true);
              } else {
