name: Windows cleanup owner proof
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact reviewed product source'
        type: string
        required: true
        default: 'fae81a8237c06d374255bb7560ab0454ff799e02'
permissions:
  contents: read
jobs:
  owner:
    if: github.ref == 'refs/heads/measure/native-cleanup-owner-6906' && inputs.source_sha == 'fae81a8237c06d374255bb7560ab0454ff799e02'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: fixture-source
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Bind product and architecture evidence
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim()
          if($head -cne '${{ inputs.source_sha }}'){throw 'Product checkout differs from requested source'}
          $arch=(& node -p process.arch).Trim()
          if($arch -cne '${{ matrix.arch }}'){throw 'Native process architecture differs from proof job'}
          $output=Join-Path $env:RUNNER_TEMP 'native-owner-proof'
          $null=New-Item -ItemType Directory -Path $output -Force
          @{product=$head;measurement='${{ github.sha }}';arch=$arch;node=(& node --version);readerSha256=(Get-FileHash packages/workspace/native/win32-process.c -Algorithm SHA256).Hash.ToLowerInvariant();adapterSha256=(Get-FileHash packages/workspace/src/extension-set-win32.ts -Algorithm SHA256).Hash.ToLowerInvariant();collectorSha256=(Get-FileHash bin/execution-store.ts -Algorithm SHA256).Hash.ToLowerInvariant()} | ConvertTo-Json | Set-Content "$output/source.json"
      - name: Overlay only reviewed measurement fixture
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $fixture='packages/workspace/smoke/extension-set-owner-win32.smoke.ts'
          Copy-Item -LiteralPath "fixture-source/$fixture" -Destination $fixture
          $changes=@(git diff --name-only)
          if($changes.Count -ne 1 -or $changes[0] -cne $fixture){throw 'Measurement overlay changed more than the reader fixture'}
          $hash=(Get-FileHash $fixture -Algorithm SHA256).Hash.ToLowerInvariant()
          @{measurement='${{ github.sha }}';product='${{ inputs.source_sha }}';fixture=$fixture;sha256=$hash} | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/native-owner-proof/fixture-origin.json"
      - run: pnpm install --frozen-lockfile
      - name: Build exact source Windows binding
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -property installationPath`) do set "VS=%%i"
          if not defined VS exit /b 1
          call "%VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=${{ matrix.arch == 'x64' && 'amd64' || 'arm64' }} -host_arch=${{ matrix.arch == 'x64' && 'amd64' || 'arm64' }}
          if errorlevel 1 exit /b 1
          node packages/workspace/scripts/build-native.mjs
          if errorlevel 1 exit /b 1
          node packages/seat/scripts/build-native.mjs --host
          if errorlevel 1 exit /b 1
      - run: pnpm --workspace-concurrency=3 --filter cotal-ai... build
      - run: pnpm --filter @cotal-ai/workspace --filter cotal-ai typecheck
      - name: Run native owner reader security cells directly
        shell: pwsh
        env:
          COTAL_OWNER_PROBE_OUTPUT: ${{ runner.temp }}/native-owner-proof/reader
        run: |
          $ErrorActionPreference='Stop'
          $output=Join-Path $env:RUNNER_TEMP 'native-owner-proof'
          & node --import tsx packages/workspace/smoke/extension-set-owner-win32.smoke.ts *> "$output/reader.log"
          $code=$LASTEXITCODE
          Get-Content "$output/reader.log"
          @{exitCode=$code} | ConvertTo-Json | Set-Content "$output/reader-exit.json"
          if($code -ne 0){throw 'Native directory owner reader security cells failed'}
      - name: Verify source and built native provenance
        if: always() && !cancelled()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node --input-type=module -e "import {verifyNative} from './packages/workspace/scripts/native-contract.mjs'; verifyNative('win32',process.arch,undefined,'${{ inputs.source_sha }}');"
          if($LASTEXITCODE -ne 0){throw 'Native source/binary provenance failed'}
          $changes=@(git diff --name-only)
          if($changes.Count -ne 1 -or $changes[0] -cne 'packages/workspace/smoke/extension-set-owner-win32.smoke.ts'){throw 'Proof changed product source outside approved fixture'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-cleanup-owner-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/native-owner-proof/
            packages/workspace/build/Release/win32-${{ matrix.arch }}/build.json
            packages/workspace/build/Release/win32-${{ matrix.arch }}/creation.node
          if-no-files-found: error
