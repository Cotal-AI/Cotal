name: Attribution

# Refuse AI attribution before it can reach main.
#
# AGENTS.md bans tool and AI attribution in commits, PRs, issues and comments. Six commits on
# main carry it anyway (ten Co-Authored-By trailers in the #1350 squash, one in each of four
# 2026-08-29 squashes, two model ids in the #1419 squash). Every one arrived through a squash
# merge, which concatenates each constituent commit body into the merge commit, so the person
# merging never typed the trailer and a merge-time read of a 59-line generated body did not
# catch it. The gate therefore reads what the squash body is built FROM: every commit on the
# PR branch, plus the PR title and body. It runs on the pull_request event only; a push to
# main is already merged and a red there would be a report, not a gate.
#
# The grammar is closed and lives in scripts/check-attribution.mjs with its own self-test,
# which runs first so a broken grader cannot report clean.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attribution:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The whole PR branch and its merge base, so the range below is complete. A shallow
          # clone would truncate the range and the check would grade fewer commits than the
          # squash will fold.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6.0.8
      - name: Install gate dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Operator literal self-test and scan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          COTAL_PRIVACY_HOST_TOKENS: ${{ vars.COTAL_PRIVACY_HOST_TOKENS }}
        run: |
          git fetch --no-tags origin "$BASE" "$HEAD"
          node scripts/check-operator-literals.mjs --range "$BASE..$HEAD" --event "$GITHUB_EVENT_PATH"
      # THIS STEP LIVES IN THE REQUIRED JOB ON PURPOSE, AND THAT IS THE WHOLE POINT OF IT.
      #
      # Measured during review: `attribution` is the ONLY required status context on main
      # (`gh api repos/.../rules/branches/main` -> ["attribution"]). A gate that reds in any
      # other job is ADVISORY: it reports, and the merge proceeds anyway. An advisory gate for
      # "did anyone document this breaking change" is precisely the decoration this PR exists
      # to remove, because a red nobody has to answer is indistinguishable from a green to the
      # person clicking merge.
      #
      # So the check runs where refusal is load-bearing. The changeset reader now uses the same
      # declared YAML parser as release tooling, so the frozen dependency graph is installed above
      # before this step. `--ignore-scripts` keeps that setup data-only: no package build or native
      # lifecycle hook runs in the attribution job.
      #
      # The checkout above is already the right shape for it: `fetch-depth: 0` and
      # actions/checkout's default PR ref, which is the two-parent merge snapshot this gate
      # requires and verifies for itself.
      # THE SELF-TEST PROVES THE GATE WORKS; THIS RUNS IT ON THE COMMITS ACTUALLY BEING MERGED,
      # and only the second one can keep docs/UPGRADING.md true (#1578). Measured during review:
      # the suite registry ran `--self-test` alone, which grades two FIXED historical ranges, so
      # tomorrow's breaking change with no upgrade section was examined by nothing. A gate that
      # exists and is never pointed at the change is decoration, and worse than absent, because
      # a green check tells a reviewer somebody looked.
      - name: Upgrade section present for breaking changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          # BOTH ENDS OF THE RANGE COME FROM THE CHECKED-OUT SNAPSHOT, NEVER FROM THE EVENT PAYLOAD.
          #
          # `github.event.pull_request.base.sha` is the base recorded when the event was CREATED,
          # while actions/checkout gives you GitHub's synthetic merge commit, whose first parent is
          # whatever main was when that merge was computed. Those two drift apart the moment main
          # moves, and the drift is silent. Measured on this very PR: the event base was
          # 0e2d46409e44cbcd10eeaa90c90f13418c6c0801 while the merge's first parent was already
          # 04f1b610bb2334e4c72ebb2a5582d49ac736ef48, so the step graded 26 changed paths and six
          # commits instead of the eight paths and five commits the contribution actually carries.
          #
          # That is not a cosmetic widening, it INVERTS the verdict. A main commit that happens to
          # add any release section is swallowed into the range and reads as coverage for a
          # breaking commit on the branch that documented nothing. Reproduced end to end: with an
          # unrelated main-side section in range, a `feat(core)!` carrying no section of its own
          # exits 0 and prints "covered by 1 new section(s)"; over HEAD^1..HEAD the identical
          # commit exits 1 and REFUSES. A gate that can be made to pass by someone else's unrelated
          # commit is the reporter's own defect one level up.
          #
          # HEAD^1..HEAD reads both ends off one object, so nothing can move between them. The
          # parent-count check below is a SECOND line of defence and not the only one: the script
          # itself refuses `--merge-snapshot` on a single-parent checkout, because a guard that
          # lives only in its caller protects only the callers that remember it.
          # THIS WORKFLOW IS PULL-REQUEST-ONLY AND THE STEP GRADES ONLY THAT SHAPE. There is
          # deliberately no push branch here. A push to main is ALREADY MERGED, so a red on it
          # would be a report rather than a gate, which is the same reasoning this workflow states
          # in its own header for the attribution check. Carrying a `HEAD~1..HEAD` branch that the
          # triggers can never reach would advertise coverage this job cannot exercise and leave a
          # second range path to drift out of step with the one that runs.
          #
          # The event is ASSERTED rather than assumed. If a trigger is ever added, this refuses to
          # grade instead of silently taking a path nobody re-checked.
          [ "$EVENT" = "pull_request" ] || {
            echo "this gate grades pull request merge snapshots only; got event '$EVENT'."
            echo "A push to main is already merged and cannot be gated here. Refusing to grade."
            exit 2
          }
          # A `pull_request` checkout is the merge snapshot, so it MUST have two parents. If it
          # has one, the workflow was reconfigured to check out the PR head (`ref: ...head.sha`)
          # and HEAD^1 silently becomes the branch's previous commit rather than the merge base.
          # That reads as a tiny clean range and greens everything, so it is a misuse exit, not a
          # guess: the gate says it cannot grade rather than grading the wrong thing.
          parents="$(git rev-list --parents -n 1 HEAD | wc -w)"
          [ "$parents" = "3" ] || {
            echo "pull_request checkout is not a merge snapshot ($((parents - 1)) parent(s));"
            echo "expected actions/checkout's default merge ref. Refusing to guess a base."
            exit 2
          }
          base="$(git rev-parse HEAD^1)"
          echo "grading the merge snapshot's own range: $base..$(git rev-parse HEAD)"
          mode="--merge-snapshot"
          # The range must be REACHABLE before it can be graded. An unreachable base makes the
          # gate misuse-exit, and a misuse must never be mistaken for "no breaking change here".
          git cat-file -e "$base^{commit}" || { echo "base $base is not in this checkout"; exit 2; }
          out="$(node scripts/upgrade-section-gate.mjs $mode 2>&1)" && rc=0 || rc=$?
          printf '%s\n' "$out"
          # EXIT 2 IS THE GATE SAYING IT COULD NOT GRADE. Treating it as a pass is the whole
          # defect class this gate was written to catch, so it fails the job loudly instead.
          if [ "$rc" = 2 ]; then echo "gate could not grade this range; failing rather than assuming a pass"; exit 2; fi
          # A verdict line must be present, or an empty stdout with rc=0 would read as a pass.
          printf '%s\n' "$out" | grep -qE 'REFUSED|OK' || { echo "gate printed no verdict"; exit 2; }
          exit "$rc"
      - name: Grader self-test
        run: node scripts/check-attribution.mjs --selftest
      - name: Commits, PR title and PR body
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE" "$HEAD"
          echo "range $BASE..$HEAD"
          node scripts/check-attribution.mjs --range "$BASE..$HEAD" --event "$GITHUB_EVENT_PATH"
