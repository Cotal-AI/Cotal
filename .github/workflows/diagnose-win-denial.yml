name: Diagnose native Windows query denial
on:
  push:
    branches: [diag/windows-native-denial-1016]
permissions:
  contents: read
jobs:
  observe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Compile instrumented diagnostic binaries only
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -property installationPath`) do set "VS=%%i"
          if not defined VS exit /b 1
          call "%VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=amd64 -host_arch=amd64
          if errorlevel 1 exit /b 1
          node packages/workspace/scripts/build-native.mjs
          if errorlevel 1 exit /b 1
          mkdir packages\workspace\build\test\win32-x64
          cl /nologo /O2 /MT /W4 /WX /std:c11 /Fopackages\workspace\build\test\win32-x64\query-control.obj /Fepackages\workspace\build\test\win32-x64\query-control.exe packages\workspace\smoke\fixtures\win32-denied-process.c /link /Brepro advapi32.lib
          if errorlevel 1 exit /b 1
      - run: pnpm --filter @cotal-ai/workspace... build
      - name: Observe actual probe and caller privileges without changing them
        run: node --import tsx packages/workspace/smoke/win32-creation-native.smoke.ts
