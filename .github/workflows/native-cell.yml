name: Native cell

# Runs one smoke file on Linux, macOS and Windows at the dispatched ref. For a change whose
# behaviour differs by platform and whose proof is a single suite.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Repository path of one smoke file, for example implementations/manager/smoke/list-dir-native.smoke.ts"
        type: string
        required: true

permissions:
  contents: read

jobs:
  cell:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest, windows-2022]
    env:
      DO_NOT_TRACK: "1"
      COTAL_TELEMETRY: "off"
      SUITE: ${{ inputs.suite }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Refuse anything that is not one tracked smoke file
        shell: bash
        run: |
          [[ "$SUITE" =~ ^[A-Za-z0-9_./-]+\.smoke\.ts$ && "$SUITE" != *..* ]] || { echo "::error::suite must be a repository path ending in .smoke.ts"; exit 1; }
          git ls-files --error-unmatch -- "$SUITE"
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Compile the Windows process binding
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" exit /b 1
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -property installationPath`) do set "VS=%%i"
          if not defined VS exit /b 1
          call "%VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=amd64 -host_arch=amd64
          if errorlevel 1 exit /b 1
          node packages/workspace/scripts/build-native.mjs
          if errorlevel 1 exit /b 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "cotal-ai..." build
      - name: Run the suite
        if: runner.os != 'Windows' || inputs.suite != 'packages/core/smoke/secret-fs-long-path.smoke.ts'
        shell: bash
        run: pnpm exec tsx "$SUITE"
      - name: Verify Windows secret ACL paths under image and default policy
        if: runner.os == 'Windows' && inputs.suite == 'packages/core/smoke/secret-fs-long-path.smoke.ts'
        shell: pwsh
        run: ./packages/core/smoke/secret-fs-long-path-policy.ps1
