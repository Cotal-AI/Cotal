name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Same coverage as before, fanned across parallel jobs so wall-clock is the slowest job, not the sum:
#   • unit  — typecheck + build + unit tests + the broker-free view/pack checks (fast).
#   • smoke — the protocol/security suite (smoke:ci), round-robin sharded across runners by
#             bin/smoke/shard.mjs (each smoke still runs in its own broker; shards are on separate
#             runners, so no cross-smoke port contention).
#   • live  — the Linux-only live/lifecycle e2es (real broker + real agents, tmux/cmux/opencode).
# `ci-ok` fans them back in for a single required status.
jobs:
  unit:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Docs bundle in sync
        run: pnpm check:docsbundle
      - name: Unit tests
        run: pnpm test
      - name: View smoke
        run: pnpm smoke:view
      - name: Verify Claude connector package
        run: pnpm --filter @cotal-ai/connector-claude-code pack --dry-run
      # Grades the convention, not one suite: every file that defaults COTAL_SERVERS with `||=`
      # must also print what it resolved. Pure — reads sources, spawns nothing, dials nothing.
      # Placed here rather than in the smoke:ci chain so the chain migration lands without a
      # rebase; `gate-inventory` counts a suite named in a workflow as reached.
      - name: Broker disclosure
        run: pnpm smoke:broker-disclosure

  smoke:
    name: smoke (shard ${{ matrix.shard }}/4)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache nats-server
        id: nats
        uses: actions/cache@v4
        with:
          path: ~/nats-bin
          key: nats-server-v2.12.12-${{ runner.os }}
      - name: Install nats-server
        if: steps.nats.outputs.cache-hit != 'true'
        run: |
          NATS_VERSION=v2.12.12
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/nats-server-${NATS_VERSION}-linux-amd64.tar.gz" -o /tmp/nats-server.tar.gz
          tar -xzf /tmp/nats-server.tar.gz -C /tmp
          mkdir -p ~/nats-bin
          install "/tmp/nats-server-${NATS_VERSION}-linux-amd64/nats-server" ~/nats-bin/nats-server
      - name: nats-server on PATH
        run: echo "$HOME/nats-bin" >> "$GITHUB_PATH"
      - name: Build
        run: pnpm build
      - name: Protocol & security smoke tests (shard ${{ matrix.shard }}/4)
        run: node bin/smoke/shard.mjs ${{ matrix.shard }} 4

  live:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache nats-server
        id: nats
        uses: actions/cache@v4
        with:
          path: ~/nats-bin
          key: nats-server-v2.12.12-${{ runner.os }}
      - name: Install nats-server
        if: steps.nats.outputs.cache-hit != 'true'
        run: |
          NATS_VERSION=v2.12.12
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/nats-server-${NATS_VERSION}-linux-amd64.tar.gz" -o /tmp/nats-server.tar.gz
          tar -xzf /tmp/nats-server.tar.gz -C /tmp
          mkdir -p ~/nats-bin
          install "/tmp/nats-server-${NATS_VERSION}-linux-amd64/nats-server" ~/nats-bin/nats-server
      - name: nats-server on PATH
        run: echo "$HOME/nats-bin" >> "$GITHUB_PATH"
      - name: Install tmux
        run: tmux -V || (sudo apt-get update && sudo apt-get install -y tmux)
      # smoke:runtime includes smoke:herdr, which exits 0 with a SKIPPED notice when herdr is
      # absent. Without this step the whole herdr suite is a silent no-op on every run — which is
      # exactly how a driver incompatible with current stable herdr passed CI green.
      - name: Install herdr
        run: |
          set -euo pipefail
          HERDR_VERSION=v0.8.0
          curl -fsSL "https://github.com/herdrdev/herdr/releases/download/${HERDR_VERSION}/herdr-linux-x86_64" -o /tmp/herdr
          sudo install -m 0755 /tmp/herdr /usr/local/bin/herdr
          herdr --version
      - name: Build
        run: pnpm build
      # Broker-free boundary/preflight guards + the live target-resolution / spawn-from-anywhere /
      # readiness / up-stack / up-manifest / ext / dogfood e2es (real broker, real agents).
      - name: Core boundary, mesh preflight & resolution
        run: pnpm smoke:core-boundary && pnpm smoke:preflight && pnpm smoke:server-resolution:live && pnpm smoke:spawn-from-anywhere:live && pnpm smoke:spawn-detach:live && pnpm smoke:readiness:live && pnpm smoke:setup-pure:live && pnpm smoke:up-stack:live && pnpm smoke:up-manifest:live && pnpm smoke:ext:live && pnpm smoke:dogfood:live
      - name: Manager lifecycle e2e (real broker + real agents)
        run: pnpm smoke:lifecycle-e2e
      - name: Runtime smoke tests (tmux, orca, herdr)
        run: pnpm smoke:runtime
      # Runs BEFORE the soak because it grades the soak's own instrument: the wait behind the
      # positive control, and the nonce the survivor count matches on. If either is wrong the soak
      # still goes green — a control that can pass while the payload is absent, or a count that
      # includes a neighbouring run's processes. Deterministic (fake clock, injected probe), so it
      # is a cheap gate on the expensive one, not a second copy of it.
      - name: herdr soak instrument (visibility wait + nonce)
        run: pnpm smoke:herdr:probe
      # Accumulation is invisible to a single-shot suite: a per-cycle leak of a pane, workspace,
      # launcher dir or process only shows up over many spawn/stop cycles, which is what a
      # long-lived manager actually does.
      - name: herdr endurance soak (spawn/stop churn, leak deltas)
        run: pnpm smoke:herdr:soak
      # The integration the unit suite cannot reach: real broker + real Manager + a real agent in
      # presence, then SIGKILL the manager to prove the agent outlives it.
      - name: herdr e2e (real broker + manager + agent, manager-kill survival)
        run: pnpm smoke:herdr-e2e:live
      - name: cmux launcher secret-hygiene smoke
        run: pnpm smoke:cmux
      - name: OpenCode cooperative-stop smoke test
        run: pnpm smoke:opencode-coop

  ci-ok:
    # Single required status: green only if unit + every smoke shard + live all passed.
    if: always()
    needs: [unit, smoke, live]
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          echo "unit=${{ needs.unit.result }} smoke=${{ needs.smoke.result }} live=${{ needs.live.result }}"
          [ "${{ needs.unit.result }}" = "success" ] && [ "${{ needs.smoke.result }}" = "success" ] && [ "${{ needs.live.result }}" = "success" ]
