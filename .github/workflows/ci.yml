name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A new push to a PR supersedes the run already going; a merge to main does not.
#
# Deliberately not unconditional: a main commit's CI result is the record for that commit, not a
# preview of the next, and a cancelled run leaves a merge ungradable, neither red nor green.
# Superseding is only right where the earlier answer has stopped being interesting, which is true
# of a PR revision and false of a merge.
#
# `cancel-in-progress: false` on its own does not deliver that, which is what #976 measured. A
# group holds one pending run by default, so when a third push arrives the queued run is evicted
# rather than made to wait: it is cancelled with zero jobs, and that commit ends up with no CI
# result of any kind. It happened to 13 of 29 consecutive main runs. `queue: max` is the part that
# actually makes them wait, FIFO, up to 100 deep.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  # `queue: max` with `cancel-in-progress: true` is a validation error, so this tracks the line
  # above: a PR keeps the default single slot and supersedes, main queues instead of evicting.
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

# Same coverage as before, fanned across parallel jobs so wall-clock is the slowest job, not the sum:
#   • unit  — typecheck + build + unit tests + the broker-free view/pack checks (fast).
#   • smoke — the protocol/security suite (smoke:ci), round-robin sharded across runners by
#             bin/smoke/shard.mjs (each smoke still runs in its own broker; shards are on separate
#             runners, so no cross-smoke port contention).
#   • live  — the Linux-only live/lifecycle e2es (real broker + real agents, tmux/cmux/opencode).
# `ci-ok` fans them back in for a single required status.
jobs:
  unit:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The shard-stability check reads ci-suites.txt at the base commit, which a
          # depth-1 clone does not contain.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ci-suites.txt is round-robin `index % count`. Inserting a line mid-file moves every
      # suite below it while membership, count, and duplicate checks stay green.
      - name: Smoke chain shard stability
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          base="$BASE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD~1)" || { echo "no base commit or first parent"; exit 2; }
            echo "no base commit on this event; using first parent $base"
          fi

          # Four checks keep an unrelated exit 1 from impersonating a real re-shard.
          test -s bin/smoke/shard-stability.ts || { echo "detector missing"; exit 2; }
          out="$(pnpm -s check:shard-stability "$base" "$(git rev-parse HEAD)" 2>&1)" && rc=0 || rc=$?
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q 'v1 starting' || { echo "detector never started"; exit 2; }
          tok="$(printf '%s\n' "$out" | grep -oE 'shard-stability: [A-Z]+=[0-9]' || true)"
          tok_count="$(printf '%s\n' "$tok" | grep -c . || true)"
          [ "$tok_count" = 1 ] || { echo "no single verdict"; exit 2; }
          [ "${tok##*=}" = "$rc" ] || { echo "verdict $tok disagrees with exit $rc"; exit 2; }
          exit "$rc"
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Docs bundle in sync
        run: pnpm check:docsbundle
      # Broker-free and network-free, and it reads the BUILT connector, so it belongs after Build.
      # It was reachable from `check` and executed by nothing, which is how it sat red on main.
      - name: Docs smoke
        run: pnpm smoke:docs
      - name: Unit tests
        run: pnpm test
      - name: View smoke
        run: pnpm smoke:view
      - name: Verify Claude connector package
        run: pnpm --filter @cotal-ai/connector-claude-code pack --dry-run
      # Grades the convention, not one suite: every file that defaults COTAL_SERVERS with `||=`
      # must also print what it resolved. Pure — reads sources, spawns nothing, dials nothing.
      # Placed here rather than in the smoke:ci chain so the chain migration lands without a
      # rebase; `gate-inventory` counts a suite named in a workflow as reached.
      - name: Broker disclosure
        run: pnpm smoke:broker-disclosure

  smoke:
    name: smoke (shard ${{ matrix.shard }}/4)
    timeout-minutes: 40
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6.0.8
        with:
          standalone: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Capture smoke toolchain
        id: smoke-tools
        shell: /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS /usr/bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          node_path="$(command -v node)"
          pnpm_path="$(command -v pnpm)"
          node_target="$(/usr/bin/readlink -f "$node_path")"
          pnpm_target="$(/usr/bin/readlink -f "$pnpm_path")"
          echo "node_path=$node_path" >> "$GITHUB_OUTPUT"
          echo "node_target=$node_target" >> "$GITHUB_OUTPUT"
          echo "node_sha=$(/usr/bin/sha256sum "$node_target" | /usr/bin/cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "pnpm_path=$pnpm_path" >> "$GITHUB_OUTPUT"
          echo "pnpm_target=$pnpm_target" >> "$GITHUB_OUTPUT"
          echo "pnpm_sha=$(/usr/bin/sha256sum "$pnpm_target" | /usr/bin/cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - name: Cache nats-server
        id: nats
        uses: actions/cache@v4
        with:
          path: ~/nats-bin
          key: nats-server-v2.12.12-${{ runner.os }}
      - name: Install nats-server
        if: steps.nats.outputs.cache-hit != 'true'
        run: |
          NATS_VERSION=v2.12.12
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/nats-server-${NATS_VERSION}-linux-amd64.tar.gz" -o /tmp/nats-server.tar.gz
          tar -xzf /tmp/nats-server.tar.gz -C /tmp
          mkdir -p ~/nats-bin
          install "/tmp/nats-server-${NATS_VERSION}-linux-amd64/nats-server" ~/nats-bin/nats-server
      - name: nats-server on PATH
        run: echo "$HOME/nats-bin" >> "$GITHUB_PATH"
      - name: Build
        run: pnpm build
      - name: Protocol & security smoke tests (shard ${{ matrix.shard }}/4)
        # The detector grades committed blobs. Earlier steps must not change inputs or execution hooks.
        shell: /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS /usr/bin/bash --noprofile --norc -e -o pipefail {0}
        run: /usr/bin/git --no-replace-objects show "$GITHUB_SHA:bin/smoke/verify-shard-inputs.sh" | /usr/bin/bash --noprofile --norc -s -- "$GITHUB_SHA" ${{ matrix.shard }} 4 ci "${{ steps.smoke-tools.outputs.node_path }}" "${{ steps.smoke-tools.outputs.node_target }}" "${{ steps.smoke-tools.outputs.node_sha }}" "${{ steps.smoke-tools.outputs.pnpm_path }}" "${{ steps.smoke-tools.outputs.pnpm_target }}" "${{ steps.smoke-tools.outputs.pnpm_sha }}"

  live:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache nats-server
        id: nats
        uses: actions/cache@v4
        with:
          path: ~/nats-bin
          key: nats-server-v2.12.12-${{ runner.os }}
      - name: Install nats-server
        if: steps.nats.outputs.cache-hit != 'true'
        run: |
          NATS_VERSION=v2.12.12
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/nats-server-${NATS_VERSION}-linux-amd64.tar.gz" -o /tmp/nats-server.tar.gz
          tar -xzf /tmp/nats-server.tar.gz -C /tmp
          mkdir -p ~/nats-bin
          install "/tmp/nats-server-${NATS_VERSION}-linux-amd64/nats-server" ~/nats-bin/nats-server
      - name: nats-server on PATH
        run: echo "$HOME/nats-bin" >> "$GITHUB_PATH"
      - name: Install tmux
        run: tmux -V || (sudo apt-get update && sudo apt-get install -y tmux)
      # smoke:runtime includes smoke:herdr, which exits 0 with a SKIPPED notice when herdr is
      # absent. Without this step the whole herdr suite is a silent no-op on every run — which is
      # exactly how a driver incompatible with current stable herdr passed CI green.
      - name: Install herdr
        run: |
          set -euo pipefail
          HERDR_VERSION=v0.8.0
          curl -fsSL "https://github.com/herdrdev/herdr/releases/download/${HERDR_VERSION}/herdr-linux-x86_64" -o /tmp/herdr
          sudo install -m 0755 /tmp/herdr /usr/local/bin/herdr
          herdr --version
      - name: Build
        run: pnpm build
      # Broker-free boundary/preflight guards + the live target-resolution / spawn-from-anywhere /
      # readiness / up-stack / up-manifest / ext / dogfood e2es (real broker, real agents).
      - name: Core boundary, mesh preflight & resolution
        run: pnpm smoke:core-boundary && pnpm smoke:preflight && pnpm smoke:server-resolution:live && pnpm smoke:spawn-from-anywhere:live && pnpm smoke:spawn-detach:live && pnpm smoke:readiness:live && pnpm smoke:setup-pure:live && pnpm smoke:up-stack:live && pnpm smoke:up-manifest:live && pnpm smoke:ext:live && pnpm smoke:dogfood:live
      - name: Manager lifecycle e2e (real broker + real agents)
        run: pnpm smoke:lifecycle-e2e
      - name: Runtime smoke tests (tmux, orca, herdr)
        run: pnpm smoke:runtime
      # Runs BEFORE the soak because it grades the soak's own instrument: the wait behind the
      # positive control, and the nonce the survivor count matches on. If either is wrong the soak
      # still goes green — a control that can pass while the payload is absent, or a count that
      # includes a neighbouring run's processes. Deterministic (fake clock, injected probe), so it
      # is a cheap gate on the expensive one, not a second copy of it.
      - name: herdr soak instrument (visibility wait + nonce)
        run: pnpm smoke:herdr:probe
      # Accumulation is invisible to a single-shot suite: a per-cycle leak of a pane, workspace,
      # launcher dir or process only shows up over many spawn/stop cycles, which is what a
      # long-lived manager actually does.
      - name: herdr endurance soak (spawn/stop churn, leak deltas)
        run: pnpm smoke:herdr:soak
      # The integration the unit suite cannot reach: real broker + real Manager + a real agent in
      # presence, then SIGKILL the manager to prove the agent outlives it.
      - name: herdr e2e (real broker + manager + agent, manager-kill survival)
        run: pnpm smoke:herdr-e2e:live
      - name: cmux launcher secret-hygiene smoke
        run: pnpm smoke:cmux
      - name: OpenCode cooperative-stop smoke test
        run: pnpm smoke:opencode-coop

  ci-ok:
    # Single required status. It owns the explicit live diagnosis too: adding a separate dependent
    # job was measured on PR #1043 and left a superseded run queued through TWO later runner jobs,
    # which held the replacement run behind it. One existing aggregate is the minimal queue shape.
    name: ci-ok (live outcome classified)
    if: always()
    needs: [unit, smoke, live]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Classify a cancelled live job
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVE_RESULT: ${{ needs.live.result }}
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
          HEAD_REF: ${{ github.head_ref }}
        run: >-
          node scripts/live-job-conclusion.mjs
          --result "$LIVE_RESULT"
          --repo "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID"
          --attempt "$GITHUB_RUN_ATTEMPT"
          --workflow ci.yml
          --job live
          --timeout-seconds 1500
          --event "$GITHUB_EVENT_NAME"
          --pr-number "$PR_NUMBER"
          --head-ref "$HEAD_REF"
      - name: Gate
        run: |
          echo "unit=${{ needs.unit.result }} smoke=${{ needs.smoke.result }} live=${{ needs.live.result }}"
          [ "${{ needs.unit.result }}" = "success" ] && [ "${{ needs.smoke.result }}" = "success" ] && [ "${{ needs.live.result }}" = "success" ]
