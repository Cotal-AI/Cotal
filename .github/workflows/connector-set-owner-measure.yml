name: Connector set Windows ownership measurement
on:
  push:
    branches: [measure/connector-set-windows-owner]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts --child-concurrency=2
      - name: Build shipped Windows identity in MSVC environment
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" exit /b 1
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -property installationPath`) do set "VS=%%i"
          if not defined VS exit /b 1
          call "%VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=amd64 -host_arch=amd64
          if errorlevel 1 exit /b 1
          node packages/workspace/scripts/build-native.mjs
          if errorlevel 1 exit /b 1
      - name: Measure actual owner SID against current token and foreign account
        shell: pwsh
        run: |
          $env:DO_NOT_TRACK='1'
          $env:COTAL_OWNER_PROBE_OUTPUT=Join-Path $env:RUNNER_TEMP 'connector-owner-evidence'
          node --import tsx packages/workspace/smoke/extension-set-owner-win32.smoke.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connector-owner-windows
          path: ${{ runner.temp }}/connector-owner-evidence
          if-no-files-found: error
