name: Docs

# Build and deploy the docs site (website/) to Cloudflare Pages, with the TypeScript reference
# TypeDoc generates from the published packages' sources at /api/typescript/.
#  - push to main touching docs sources   -> production deploy (docs.cotal.ai)
#  - pull request touching docs sources   -> preview deploy (URL in the job summary)
#  - release published                    -> immutable snapshot on a branch alias
#                                             (<tag>.cotal-docs.pages.dev)
# Needs repo secrets CLOUDFLARE_API_TOKEN (Pages:Edit + Account Settings:Read)
# and CLOUDFLARE_ACCOUNT_ID. Fork PRs build but skip the deploy (no secrets).

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'website/**'
      - 'tools/docs-content/**'
      - 'docs/**'
      - 'spec/**'
      - 'implementations/web/openapi.json'
      - 'implementations/auth/openapi.json'
      - 'implementations/auth/host.openapi.json'
      - 'implementations/manager/openapi.json'
      - 'implementations/delivery/openapi.json'
      - 'SPEC.md'
      - 'assets/**'
      - 'typedoc.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/*/src/**'
      - 'packages/*/package.json'
      - 'implementations/*/src/**'
      - 'implementations/*/package.json'
      - 'extensions/*/src/**'
      - 'extensions/*/package.json'
      - 'extensions/*/typedoc.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'install.sh'
      - 'website/**'
      - 'tools/docs-content/**'
      - 'docs/**'
      - 'spec/**'
      - 'implementations/web/openapi.json'
      - 'implementations/auth/openapi.json'
      - 'implementations/auth/host.openapi.json'
      - 'implementations/manager/openapi.json'
      - 'implementations/delivery/openapi.json'
      - 'SPEC.md'
      - 'assets/**'
      - 'typedoc.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/*/src/**'
      - 'packages/*/package.json'
      - 'implementations/*/src/**'
      - 'implementations/*/package.json'
      - 'extensions/*/src/**'
      - 'extensions/*/package.json'
      - 'extensions/*/typedoc.json'
      - '.github/workflows/docs.yml'
  release:
    types: [published]

# A new push to a PR supersedes the preview build already running for it; main and release builds
# queue behind each other, because a deploy result is the record for that commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: pnpm install --frozen-lockfile
      # The site publishes the TypeScript reference; TypeDoc's warnings stay visible in this log.
      - run: pnpm gen:tsdocs
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website

      - name: Pick the Pages branch
        id: target
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "branch=$(echo "$TAG" | tr -c 'a-zA-Z0-9-' '-' | sed 's/-*$//')" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "branch=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        # Fork PRs have no secrets; they stop at the build check above.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: pages deploy dist --project-name=cotal-docs --branch=${{ steps.target.outputs.branch }}

      - name: Verify live installer hosts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          deadline=$((SECONDS + 360))
          pending=(get.cotal.ai install.cotal.ai)
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          while ((${#pending[@]})); do
            retry=()
            for host in "${pending[@]}"; do
              remaining=$((deadline - SECONDS))
              if ((remaining <= 0)); then
                echo "::error::Installer hosts did not match website/dist/install.sh within six minutes: ${pending[*]}"
                exit 1
              fi
              timeout=$((remaining < 20 ? remaining : 20))
              if curl --fail --silent --show-error --location --max-time "$timeout" "https://$host/" -o "$body" &&
                cmp -s website/dist/install.sh "$body"; then
                echo "$host matches website/dist/install.sh"
              else
                echo "$host has not served the deployed installer yet"
                retry+=("$host")
              fi
            done
            pending=("${retry[@]}")
            if ((${#pending[@]})); then
              remaining=$((deadline - SECONDS))
              if ((remaining > 0)); then
                sleep "$((remaining < 10 ? remaining : 10))"
              fi
            fi
          done

      - name: Summary
        if: steps.deploy.outcome == 'success'
        run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
