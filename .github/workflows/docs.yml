name: Docs

# Build and deploy the docs site (website/) to Cloudflare Pages, with the TypeScript reference
# TypeDoc generates from the published packages' sources at /api/typescript/.
#  - push to main touching docs sources   -> production deploy (docs.cotal.ai)
#  - pull request touching docs sources   -> build check only; the built site is attached to
#                                             the run as the `docs-site` artifact
#  - release published                    -> immutable snapshot on a branch alias
#                                             (the tag with every character outside
#                                             letters, digits and `-` turned into `-`, so
#                                             v1.2.3 is v1-2-3.cotal-docs.pages.dev)
# Needs repo secrets CLOUDFLARE_API_TOKEN (Pages:Edit + Account Settings:Read)
# and CLOUDFLARE_ACCOUNT_ID. Only the `docs` job reads them, and it never runs for a pull
# request: a pull request's own build scripts run in `pull-request-build`, which holds no secret.

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'website/**'
      - 'tools/docs-content/**'
      - 'docs/**'
      - 'spec/**'
      - 'implementations/web/openapi.json'
      - 'implementations/auth/openapi.json'
      - 'implementations/auth/host.openapi.json'
      - 'implementations/manager/openapi.json'
      - 'implementations/delivery/openapi.json'
      - 'SPEC.md'
      - 'assets/**'
      - 'typedoc.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/*/src/**'
      - 'packages/*/package.json'
      - 'implementations/*/src/**'
      - 'implementations/*/package.json'
      - 'extensions/*/src/**'
      - 'extensions/*/package.json'
      - 'extensions/*/typedoc.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'install.sh'
      - 'website/**'
      - 'tools/docs-content/**'
      - 'docs/**'
      - 'spec/**'
      - 'implementations/web/openapi.json'
      - 'implementations/auth/openapi.json'
      - 'implementations/auth/host.openapi.json'
      - 'implementations/manager/openapi.json'
      - 'implementations/delivery/openapi.json'
      - 'SPEC.md'
      - 'assets/**'
      - 'typedoc.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/*/src/**'
      - 'packages/*/package.json'
      - 'implementations/*/src/**'
      - 'implementations/*/package.json'
      - 'extensions/*/src/**'
      - 'extensions/*/package.json'
      - 'extensions/*/typedoc.json'
      - '.github/workflows/docs.yml'
  release:
    types: [published]

# A new push to a PR supersedes the build already running for it. On main the deploy in progress
# finishes and only the newest waiting push is kept: a deploy publishes the whole site at its commit,
# so the newest one covers every push before it, and a queue of one deploy per push fell 13 hours
# behind main on a day with many merges. Runs for one release tag still queue in order, because a
# snapshot is the record for that tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: ${{ github.event_name == 'release' && 'max' || 'single' }}

permissions:
  contents: read

jobs:
  # A pull request's build runs the pull request's own scripts, so this job holds no secret and
  # deploys nothing. The built site is kept as an artifact for whoever wants to look at it.
  pull-request-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: pnpm install --frozen-lockfile
      # The site publishes the TypeScript reference; TypeDoc's warnings stay visible in this log.
      - run: pnpm gen:tsdocs
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-site
          path: website/dist
          retention-days: 7

  docs:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The condition above lives in this file, so a pull request that edits the file can remove
    # it. The lasting boundary is this environment: once the Cloudflare secrets are stored on it
    # with a deployment rule that admits only `main` and release tags, no pull request run can
    # read them, whatever its copy of this file says.
    environment: docs-deploy
    steps:
      # A release builds the tagged commit with the deploy credentials in this job, so the tag
      # must point at a commit that is already on main. Checked before anything is checked out.
      - name: Refuse a release whose commit is not on main
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          status=$(gh api "repos/$REPO/compare/main...$SHA" --jq .status)
          case "$status" in
            identical|behind) echo "release commit $SHA is on main ($status)" ;;
            *) echo "::error::release commit $SHA is not on main (compare status: ${status:-unknown}); refusing to build it with the deploy credentials"; exit 1 ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: pnpm install --frozen-lockfile
      # The site publishes the TypeScript reference; TypeDoc's warnings stay visible in this log.
      - run: pnpm gen:tsdocs
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website

      - name: Pick the Pages branch
        id: target
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT" = "release" ]; then
            branch=$(echo "$TAG" | tr -c 'a-zA-Z0-9-' '-' | sed 's/^-*//; s/-*$//')
            # The production branch is deployed only by a push to main. A tag that sanitizes to
            # it, or to nothing, is refused.
            if [ -z "$branch" ] || [ "$(printf %s "$branch" | tr '[:upper:]' '[:lower:]')" = "main" ]; then
              echo "::error::release tag '$TAG' maps to the Pages branch '${branch}', which a release may not deploy"
              exit 1
            fi
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "branch=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: pages deploy dist --project-name=cotal-docs --branch=${{ steps.target.outputs.branch }}

      - name: Verify live installer hosts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          deadline=$((SECONDS + 360))
          pending=(get.cotal.ai install.cotal.ai)
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          while ((${#pending[@]})); do
            retry=()
            for host in "${pending[@]}"; do
              remaining=$((deadline - SECONDS))
              if ((remaining <= 0)); then
                echo "::error::Installer hosts did not match website/dist/install.sh within six minutes: ${pending[*]}"
                exit 1
              fi
              timeout=$((remaining < 20 ? remaining : 20))
              if curl --fail --silent --show-error --location --max-time "$timeout" "https://$host/" -o "$body" &&
                cmp -s website/dist/install.sh "$body"; then
                echo "$host matches website/dist/install.sh"
              else
                echo "$host has not served the deployed installer yet"
                retry+=("$host")
              fi
            done
            pending=("${retry[@]}")
            if ((${#pending[@]})); then
              remaining=$((deadline - SECONDS))
              if ((remaining > 0)); then
                sleep "$((remaining < 10 ? remaining : 10))"
              fi
            fi
          done

      - name: Summary
        if: steps.deploy.outcome == 'success'
        run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
