name: Deleted macOS app daemon measurement
on:
  push:
    branches:
      - measure/mac-app-deleted-daemon
      - fix/macos-deleted-app-service
permissions:
  contents: read
concurrency:
  group: mac-app-deleted-daemon
  cancel-in-progress: false
jobs:
  measure:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Prepare existing loopback authority fixture
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec tsx bin/smoke/daemon-repair-replies.smoke.ts
          pnpm --filter @cotal-ai/seat build:native
          brew install nats-server
          pnpm --filter cotal-ai seeded-connectors
          pnpm --filter cotal-ai --config.node-linker=hoisted deploy --prod --ignore-scripts "$RUNNER_TEMP/repair-cli"
          test -f "$RUNNER_TEMP/repair-cli/node_modules/@cotal-ai/seat/build/Release/darwin-arm64/peercred.node"
      - name: Record released app deletion and CLI recovery
        shell: bash
        run: |
          export NPM_BIN="$(command -v npm)"
          export DESKTOP_REPAIR_CLI="$RUNNER_TEMP/repair-cli/dist/cotal.js"
          export DESKTOP_REPAIR_COMMAND=install
          node --import tsx desktop/e2e/mac-app-deleted-daemon.mjs
      - name: Check evidence publication gate
        id: evidence
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/mac-app-deleted-daemon/upload-safe"; then
            echo 'safe=true' >> "$GITHUB_OUTPUT"
          else
            echo 'safe=false' >> "$GITHUB_OUTPUT"
            echo 'Evidence upload refused because the secret scan did not finish.'
          fi
      - name: Retain command receipts
        if: always() && steps.evidence.outputs.safe == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mac-app-deleted-daemon
          path: ${{ runner.temp }}/mac-app-deleted-daemon/evidence
          if-no-files-found: error
          retention-days: 7
