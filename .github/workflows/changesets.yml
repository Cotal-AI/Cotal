name: Changesets
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Publish packages' || 'Prepare release versions' }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
  queue: max

jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      plan: ${{ steps.select.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action/select-mode@v2.1.2
        id: select
      - name: Require versioned packages before publication
        if: github.event_name == 'workflow_dispatch' && steps.select.outputs.mode == 'version'
        run: |
          printf '%s\n' 'Merge the Changesets version PR before publishing.'
          exit 1

  version-pr:
    needs: select
    if: github.event_name == 'push' && needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action/version@v2.1.2
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: pnpm ci:version
          pr-title: 'chore(release): version packages'
          commit-message: 'chore(release): version packages'

  native:
    needs: select
    if: github.event_name == 'workflow_dispatch' && needs.select.outputs.mode == 'publish'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @cotal-ai/seat build
      - uses: actions/upload-artifact@v4
        with:
          name: seat-native-${{ matrix.arch }}
          path: packages/seat/build/Release/linux-${{ matrix.arch }}/peercred.node
          if-no-files-found: error

  workspace-native:
    needs: select
    if: github.event_name == 'workflow_dispatch' && needs.select.outputs.mode == 'publish'
    uses: ./.github/workflows/workspace-native.yml

  pack:
    needs: [select, native, workspace-native]
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-native-*'
          path: ${{ runner.temp }}/native
      - name: Assemble Cotal's native binaries
        run: |
          node scripts/seat-assemble-natives.mjs
          node scripts/workspace-assemble-natives.mjs
        env:
          SEAT_NATIVE_X64: ${{ runner.temp }}/native/seat-native-x64/peercred.node
          SEAT_NATIVE_ARM64: ${{ runner.temp }}/native/seat-native-arm64/peercred.node
          WORKSPACE_NATIVE_X64: ${{ runner.temp }}/native/workspace-native-x64
          WORKSPACE_NATIVE_ARM64: ${{ runner.temp }}/native/workspace-native-arm64
      - uses: changesets/action/pack@v2.1.2
        id: pack
        with:
          publish-plan-artifact-id: ${{ needs.select.outputs.plan }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action/publish@v2.1.2
        id: publish
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.artifact }}
          create-github-releases: true
      - name: Verify the published CLI installs and runs
        if: steps.publish.outputs.published == 'true'
        run: |
          version=$(node --print "require('./bin/package.json').version")
          node scripts/verify-release-installable.mjs "$version" --deadline-ms=600000
