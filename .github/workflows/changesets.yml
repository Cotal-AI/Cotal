name: Changesets
run-name: ${{ github.event_name == 'workflow_dispatch' && format('publication-direct {0} {1} {2} {3}', inputs.version, inputs.source, inputs.native_run, inputs.requested_at) || 'Prepare release versions' }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version already present in the release source."
        type: string
        required: true
      source:
        description: "Immutable first-parent main source to publish."
        type: string
        required: true
      native_run:
        description: "Run containing successful source-matched native builder artifacts."
        type: string
        required: true
      tag:
        description: "Registry dist-tag."
        type: string
        default: latest
      requested_at:
        description: "Original human publish-command UTC time; never reset it."
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
  queue: max

jobs:
  version-pr:
    if: github.event_name == 'push'
    timeout-minutes: 35
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm ci:version
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
          setupGitUser: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

  version:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_SOURCE: ${{ inputs.source }}
      RELEASE_NATIVE_RUN: ${{ inputs.native_run }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_REQUESTED_AT: ${{ inputs.requested_at }}
    steps:
      - name: Record execution start without resetting the command time
        run: printf 'RELEASE_ATTEMPT_STARTED_AT=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install publisher tools without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Select successful native builds
        id: native
        run: node scripts/select-release-natives.mjs
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.native.outputs.artifact-ids }}
          run-id: ${{ inputs.native_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native
      - name: Check out the requested release source
        run: |
          [[ "$RELEASE_SOURCE" =~ ^[a-f0-9]{40}$ ]]
          git rev-list --first-parent HEAD | grep -Fx "$RELEASE_SOURCE"
          git worktree add --detach "$RUNNER_TEMP/release-source" "$RELEASE_SOURCE"
          printf 'RELEASE_ROOT=%s/release-source\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build and publish directly
        id: publish
        run: node scripts/direct-release.mjs
      - name: Create the release announcement
        if: steps.publish.outputs.published == 'true' && inputs.tag == 'latest'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if ! gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release create "v$RELEASE_VERSION" --target "$RELEASE_SOURCE" --title "v$RELEASE_VERSION" --latest --generate-notes
          fi
      - name: Observe fresh install after publication
        if: steps.publish.outputs.published == 'true'
        run: node scripts/verify-release-installable.mjs "$RELEASE_VERSION" --deadline-ms=120000
      - name: Keep publication outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/publication.json
            ${{ runner.temp }}/registry-archives.json
            ${{ runner.temp }}/direct-candidate/manifest.json
          if-no-files-found: warn
