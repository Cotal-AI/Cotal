name: Changesets

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Snapshot release: publish <version>-<tag>-<datetime> under this npm dist-tag (e.g. next). Leave empty for the normal release flow."
        type: string
        default: ""

# The release path, so a run is never superseded: a cancelled version run is a merge that silently
# staged nothing, badged the same as a run somebody tidied up. The short form used here before was
# not neutral, it selected `queue: single`, which holds ONE pending run and evicts it when the next
# merge arrives. That is the #976 defect on the workflow that publishes.
#
# Neither key is conditional because there is no `pull_request` trigger to distinguish: an
# expression here would carry a branch no event can reach.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  seat-native-linux-x64:
    name: seat native (linux-x64)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build host native
        run: pnpm --filter @cotal-ai/seat build
      - uses: actions/upload-artifact@v4
        with:
          name: seat-native-linux-x64
          path: packages/seat/build/Release/linux-x64/peercred.node
          if-no-files-found: error
          retention-days: 7

  seat-native-linux-arm64:
    name: seat native (linux-arm64)
    timeout-minutes: 15
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build host native
        run: pnpm --filter @cotal-ai/seat build
      - uses: actions/upload-artifact@v4
        with:
          name: seat-native-linux-arm64
          path: packages/seat/build/Release/linux-arm64/peercred.node
          if-no-files-found: error
          retention-days: 7

  version:
    if: github.event_name == 'push' || inputs.snapshot == ''
    needs: [seat-native-linux-x64, seat-native-linux-arm64]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: seat-native-linux-x64
          path: ${{ runner.temp }}/seat-native-linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: seat-native-linux-arm64
          path: ${{ runner.temp }}/seat-native-linux-arm64

      - name: Create versions and publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm ci:publish
          version: pnpm ci:version
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
          setupGitUser: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          SEAT_NATIVE_X64: ${{ runner.temp }}/seat-native-linux-x64/peercred.node
          SEAT_NATIVE_ARM64: ${{ runner.temp }}/seat-native-linux-arm64/peercred.node

      # Keep the "version packages" PR out of the generated release notes (excluded via .github/release.yml).
      - name: Label the release PR
        if: steps.changesets.outputs.pullRequestNumber
        run: gh pr edit ${{ steps.changesets.outputs.pullRequestNumber }} --add-label skip-changelog
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      # Gate: verify that EVERY package in the lockstep group reached the registry before cutting
      # a Release. The old check asked only about `cotal-ai`; if that single package published and
      # a sibling did not, the Release was cut and the announcement went out for a version a consumer
      # could not resolve. The closure gate polls the whole fixed group and distinguishes registry
      # propagation lag from a genuine partial publish (#1286).
      - name: Verify publish closure
        id: closure-gate
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          version=$(git show "$GITHUB_SHA:bin/package.json" | jq -r .version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          set +e
          node scripts/verify-publish-closure.mjs "$version"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "closure_ok=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 1 ]; then
            echo "PARTIAL PUBLISH — failing the job."
            exit 1
          elif [ "$rc" -eq 2 ]; then
            echo "UNSETTLED — the registry has not converged. Skipping the Release."
          elif [ "$rc" -eq 3 ]; then
            echo "NONE — this push published nothing. Skipping the Release."
          else
            echo "Unexpected exit code $rc from verify-publish-closure.mjs — failing the job."
            exit 1
          fi

      # Cut the GitHub Release ONLY when this push actually published a new version to npm AND the
      # full closure gate passed. The gate exits non-zero on a partial publish, an unsettled registry,
      # or a version nothing serves, so the Release step runs only after every package in the fixed
      # group is verified present at the requested version on the registry.
      - name: Tag and cut the GitHub Release on publish
        id: release-step
        if: success() && github.event_name == 'push' && steps.closure-gate.outputs.closure_ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          version="${{ steps.closure-gate.outputs.version }}"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — nothing to do."
            exit 0
          fi
          notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" --jq .body)
          # The generated notes are merged-PR *titles* only. Prepend the changeset summaries (the actual
          # per-change descriptions changesets wrote into the package CHANGELOGs) so a release reads as
          # more than a list of one-liners. Best-effort: the package is already published, so a hiccup in
          # this cosmetic step must never block cutting the Release (|| true).
          detail=$(node scripts/release-notes-detail.mjs "$version" 2>/dev/null || true)
          {
            printf '**Cotal %s is out!**\n\nGrab it: `npm i cotal-ai@%s`\n\n' "$version" "$version"
            if [ -n "$detail" ]; then printf '%s\n\n' "$detail"; fi
            printf '%s\n' "$notes"
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --latest \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          echo "Created GitHub Release $tag."

  # Post-publish installability probe (#1412). Pack the workspace cotal-ai package, extract the
  # tarball, verify the bin entry exists, and run the binary (`--version`, `--help`). A broken
  # tarball or a version mismatch reds this job. The probe is a LEAF job: it runs after `version`
  # completes, so `gh release create` has already run, and nothing depends on this job. It reds the
  # overall workflow but does NOT gate the GitHub Release (which is gated by the closure gate from
  # #1502). It validates the SHAPE of cotal-ai's OWN packed artifact (structure, binary presence,
  # startup). It does not pack the sibling workspace packages, so their packaging is not exercised,
  # and it does not cover registry-side propagation or native-asset loading.
  install-probe:
    if: github.event_name == 'push' || inputs.snapshot == ''
    needs: [version]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run install probe
        run: node scripts/post-publish-install-probe.mjs

  # Snapshot release — publishes <version>-<tag>-<datetime> under the given npm dist-tag.
  # Bound to the npm-publish Environment; the operator's deployment branch policy controls
  # which refs can request an OIDC token. If the policy allows only main, snapshots from
  # other branches are refused by the Environment gate before the OIDC exchange.
  snapshot:
    if: github.event_name == 'workflow_dispatch' && inputs.snapshot != ''
    needs: [seat-native-linux-x64, seat-native-linux-arm64]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: seat-native-linux-x64
          path: ${{ runner.temp }}/seat-native-linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: seat-native-linux-arm64
          path: ${{ runner.temp }}/seat-native-linux-arm64

      - name: Version snapshot
        run: pnpm changeset version --snapshot ${{ inputs.snapshot }}

      - name: Preflight, build, assemble natives, and publish
        env:
          SEAT_NATIVE_X64: ${{ runner.temp }}/seat-native-linux-x64/peercred.node
          SEAT_NATIVE_ARM64: ${{ runner.temp }}/seat-native-linux-arm64/peercred.node
        run: |
          node scripts/preflight-npm-publish.mjs
          pnpm build
          node scripts/seat-assemble-natives.mjs
          pnpm publish -r --provenance --access=public --no-git-checks --tag ${{ inputs.snapshot }}
