name: CLI startup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows native identity and job API probe
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DO_NOT_TRACK: "1"
      COTAL_TELEMETRY: "off"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Compile and exercise documented Windows APIs
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" exit /b 1
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -property installationPath`) do set "VS=%%i"
          if not defined VS exit /b 1
          call "%VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=amd64 -host_arch=amd64
          if errorlevel 1 exit /b 1
          set "SRC=%CD%\packages\workspace\smoke\win32-api-probe"
          set "OUT=%RUNNER_TEMP%\win32-api-probe"
          mkdir "%OUT%"
          if errorlevel 1 exit /b 1
          pushd "%OUT%"
          cl /nologo /O2 /MT /W4 /std:c11 /Fe:probe.exe "%SRC%\probe.c" /link advapi32.lib bcrypt.lib
          if errorlevel 1 exit /b 1
          cl /nologo /O2 /MT /EHsc /std:c++17 /permissive- /W4 /I "%WindowsSdkDir%Include\%WindowsSDKVersion%cppwinrt" /Fe:sysid.exe "%SRC%\sysid.cpp" /link windowsapp.lib
          popd
          node "%SRC%\run.mjs" "%OUT%"
