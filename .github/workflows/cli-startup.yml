name: CLI startup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows native job and custodian
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DO_NOT_TRACK: "1"
      COTAL_TELEMETRY: "off"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Compile the shipped Windows binding
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" exit /b 1
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -property installationPath`) do set "VS=%%i"
          if not defined VS exit /b 1
          call "%VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=amd64 -host_arch=amd64
          if errorlevel 1 exit /b 1
          node packages/workspace/scripts/build-native.mjs
          if errorlevel 1 exit /b 1
      - run: pnpm install --frozen-lockfile
      - id: build
        run: pnpm --filter "cotal-ai..." build
      - name: Exercise the real kernel job binding
        run: pnpm exec tsx packages/workspace/smoke/win32-job-native.smoke.ts
      - name: Exercise detached custody and authenticated IPC
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm exec tsx packages/workspace/smoke/win32-custody.smoke.ts
