name: Windows setup service proof
on:
  push:
    branches: [measure/win-setup-keeps-service]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Stamp disposable proof version
        run: pnpm exec node desktop/test/setup-candidate-version.mjs
      - name: Build stock Windows native bindings
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -property installationPath`) do set "VS=%%i"
          if not defined VS exit /b 1
          call "%VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=amd64 -host_arch=amd64
          if errorlevel 1 exit /b 1
          node packages/workspace/scripts/build-native.mjs
          if errorlevel 1 exit /b 1
          node packages/seat/scripts/build-native.mjs --host
          if errorlevel 1 exit /b 1
      - run: pnpm --workspace-concurrency=3 --filter cotal-ai... build
      - run: pnpm --filter cotal-ai seeded-connectors
      - run: pnpm --dir desktop prepare:runtime
      - run: pnpm --dir desktop check:runtime
      - run: pnpm --dir desktop exec tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: setup-candidate
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: Build cannot-start helper invalid-input control
        shell: pwsh
        run: |
          node desktop/test/setup-invalid-helper.mjs
          if($LASTEXITCODE -ne 0){throw 'Invalid-helper fixture preparation failed'}
          pnpm --dir desktop exec tauri build --bundles nsis --config src-tauri/invalid-helper.json
          if($LASTEXITCODE -ne 0){throw 'Invalid-helper control build failed'}
      - uses: actions/upload-artifact@v4
        with:
          name: setup-invalid-helper
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
  native:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        repeat: [0]
        cell: [running, occupied, stopped, absent, locker, early, interactive, occupied-ui, interrupted, app-open, app-tray, foreign, fresh, cannot-start]
        include:
          - { cell: running, repeat: 1 }
          - { cell: running, repeat: 2 }
          - { cell: running, repeat: 3 }
          - { cell: running, repeat: 4 }
          - { cell: running, repeat: 5 }
          - { cell: running, repeat: 6 }
          - { cell: running, repeat: 7 }
          - { cell: running, repeat: 8 }
          - { cell: running, repeat: 9 }
          - { cell: app-tray, repeat: 1 }
          - { cell: app-tray, repeat: 2 }
          - { cell: app-tray, repeat: 3 }
          - { cell: app-tray, repeat: 4 }
          - { cell: app-tray, repeat: 5 }
          - { cell: app-tray, repeat: 6 }
          - { cell: app-tray, repeat: 7 }
          - { cell: app-tray, repeat: 8 }
          - { cell: app-tray, repeat: 9 }
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build stock bindings for fixture process
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -property installationPath`) do set "VS=%%i"
          call "%VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=amd64 -host_arch=amd64
          if errorlevel 1 exit /b 1
          node packages/workspace/scripts/build-native.mjs
          if errorlevel 1 exit /b 1
          node packages/seat/scripts/build-native.mjs --host
          if errorlevel 1 exit /b 1
      - run: pnpm --workspace-concurrency=3 --filter cotal-ai... build
      - uses: actions/download-artifact@v4
        with:
          name: setup-candidate
          path: candidate
      - uses: actions/download-artifact@v4
        if: matrix.cell == 'cannot-start'
        with:
          name: setup-invalid-helper
          path: invalid-candidate
      - name: Prepare independent published CLI service
        if: matrix.cell == 'foreign'
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/cli-service" cotal-ai@0.164.7
          if($LASTEXITCODE -ne 0){throw 'Published CLI fixture install failed'}
      - name: Verify published installers and fixture broker
        shell: pwsh
        env:
          RELEASE_METADATA_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          foreach($version in @('0.164.7','0.157.0')) {
            $name="Cotal_${version}_x64-setup.exe"
            $meta=Invoke-RestMethod -Headers @{Authorization="Bearer $env:RELEASE_METADATA_TOKEN"} "https://api.github.com/repos/Cotal-AI/Cotal/releases/tags/v$version"
            $asset=@($meta.assets|Where-Object {$_.name -ceq $name})
            if($asset.Count -ne 1 -or $asset[0].digest -notmatch '^sha256:([a-f0-9]{64})$'){throw 'Published asset digest unavailable'}
            $expected=$Matches[1]
            $path=Join-Path $env:RUNNER_TEMP $name
            Invoke-WebRequest $asset[0].browser_download_url -OutFile $path
            if((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected){throw 'Published installer digest mismatch'}
          }
          $version='2.12.2'
          $zip=Join-Path $env:RUNNER_TEMP 'nats.zip'
          Invoke-WebRequest "https://github.com/nats-io/nats-server/releases/download/v$version/nats-server-v$version-windows-amd64.zip" -OutFile $zip
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP 'nats')
          (Join-Path $env:RUNNER_TEMP "nats/nats-server-v$version-windows-amd64") >> $env:GITHUB_PATH
          $folder=if('${{ matrix.cell }}' -eq 'cannot-start'){'invalid-candidate'}else{'candidate'}
          $candidate=@(Get-ChildItem "$folder/*-setup.exe")
          if($candidate.Count -ne 1){throw 'Candidate not singular'}
          "COTAL_SETUP_CANDIDATE=$($candidate[0].FullName)" >> $env:GITHUB_ENV
      - name: Exercise actual installed setup
        env:
          COTAL_SETUP_REPEAT: ${{ matrix.repeat }}
          COTAL_SETUP_CANDIDATE_KIND: ${{ matrix.cell == 'cannot-start' && 'invalid-helper-control' || 'product' }}
        run: pnpm exec tsx desktop/test/setup-proof.mjs ${{ matrix.cell }}
      - name: Existing Windows service lifecycle suites
        if: always() && matrix.cell == 'absent'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $suites=@('daemon-ownership-imports','daemon-ownership-win32','daemon-install-native','daemon-install-entry','daemon-owned-uninstall','daemon-transport','desktop-setup')
          foreach($suite in $suites) {
            pnpm exec tsx "bin/smoke/$suite.smoke.ts"
            if($LASTEXITCODE -ne 0){throw "$suite failed"}
          }
          $env:COTAL_TEST_REAL_SERVICE='1'
          node bin/smoke/daemon-install-real.smoke.mjs
          if($LASTEXITCODE -ne 0){throw 'real installed service lifecycle failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: setup-proof-${{ matrix.cell }}-${{ matrix.repeat }}
          path: |
            ${{ runner.temp }}/setup-proof/
            ${{ runner.temp }}/daemon-service-result.json
          if-no-files-found: error
  stock-ui-control:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Exercise unchanged UI driver against published fresh setup
        shell: pwsh
        env:
          RELEASE_METADATA_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if(Test-Path "$env:LOCALAPPDATA/Cotal"){throw 'Control requires a clean installation'}
          $name='Cotal_0.164.8_x64-setup.exe'
          $meta=Invoke-RestMethod -Headers @{Authorization="Bearer $env:RELEASE_METADATA_TOKEN"} 'https://api.github.com/repos/Cotal-AI/Cotal/releases/tags/v0.164.8'
          $asset=@($meta.assets|Where-Object {$_.name -ceq $name})
          if($asset.Count -ne 1 -or $asset[0].digest -notmatch '^sha256:([a-f0-9]{64})$'){throw 'Published control digest unavailable'}
          $expected=$Matches[1]
          $installer=Join-Path $env:RUNNER_TEMP $name
          Invoke-WebRequest $asset[0].browser_download_url -OutFile $installer
          if((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected){throw 'Published control digest mismatch'}
          $output=Join-Path $env:RUNNER_TEMP 'stock-ui-control'
          $null=New-Item -ItemType Directory -Path $output
          @{head=$env:GITHUB_SHA;version='0.164.8';sha256=$expected;driverSha256=(Get-FileHash desktop/test/setup-ui.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()} | ConvertTo-Json | Set-Content "$output/identity.json"
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File desktop/test/setup-ui.ps1 -Installer $installer -Mode install -Output "$output/ui.json" > "$output/stdout.txt" 2> "$output/stderr.txt"
          $code=$LASTEXITCODE
          @{exitCode=$code} | ConvertTo-Json | Set-Content "$output/result.json"
          if($code -ne 0){throw 'Stock published UI control did not complete'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: setup-proof-stock-ui-control
          path: ${{ runner.temp }}/stock-ui-control/
          if-no-files-found: error
