name: Desktop apps
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      real_service:
        description: 'Install and remove an isolated per-user daemon service on disposable Linux/macOS/Windows runners'
        type: boolean
        default: false
      updater_compile:
        description: 'Compile configured and no-key updater branches with a disposable test key on macOS and Windows'
        type: boolean
        default: false
      updater_apply:
        description: 'Run debug Mac and Windows app updates with real native services and an occupied fixture PTY'
        type: boolean
        default: false
      updater_fixture_head:
        description: 'Immutable reviewed source head containing the shared real-seat fixture'
        type: string
        default: ''
  schedule:
    - cron: '17 6 * * 1'
  pull_request:
    paths:
      - 'desktop/**'
      - 'bin/cotal.ts'
      - 'bin/daemon/**'
      - 'bin/smoke/daemon-install-*.smoke.*'
      - 'packages/seat/**'
      - 'packages/workspace/native/**'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
env:
  DO_NOT_TRACK: '1'
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir desktop exec playwright-core install --with-deps chromium
      - run: pnpm --dir desktop test:render
      - name: Verify desktop motion
        run: pnpm --dir desktop test:render
        env:
          MOTION: '1'
          CASES: waiting,signed-in,spaces,connecting,ready,no-application,declined,progress-done,notice,details-open
          SHOTS: test/render/artifacts/motion
      - name: Upload desktop renders
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-render
          path: desktop/test/render/artifacts
          if-no-files-found: error
          retention-days: 7
  native-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb,rpm
          - os: macos-15
            bundles: app,dmg
          - os: macos-15-intel
            bundles: app,dmg
          - os: windows-2022
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    # A tag's macOS build waits for Apple's notary service inside the build step, which can take well over an hour.
    timeout-minutes: ${{ startsWith(matrix.os, 'macos') && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 180 || 60 }}
    steps:
      # A version tag builds, signs and notarizes the tagged commit with the signing credentials in
      # this job, so the tag must point at a commit that is already on main. Checked before anything
      # is checked out.
      - name: Refuse a version tag whose commit is not on main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          status=$(gh api "repos/$REPO/compare/main...$SHA" --jq .status)
          case "$status" in
            identical|behind) echo "tagged commit $SHA is on main ($status)" ;;
            *) echo "::error::tagged commit $SHA is not on main (compare status: ${status:-unknown}); refusing to build it with the signing credentials"; exit 1 ;;
          esac
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Install Linux webview and tray build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - name: Build the stock Windows identity bindings
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" exit /b 1
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -property installationPath`) do set "VS=%%i"
          if not defined VS exit /b 1
          call "%VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=amd64 -host_arch=amd64
          if errorlevel 1 exit /b 1
          node packages/workspace/scripts/build-native.mjs
          if errorlevel 1 exit /b 1
      - name: Build the stock macOS identity bindings
        if: runner.os == 'macOS'
        run: node packages/workspace/scripts/build-native.mjs
      - run: pnpm --workspace-concurrency=1 --filter cotal-ai... build
      - name: Build the daemon host primitives
        if: runner.os != 'Windows'
        run: pnpm --filter @cotal-ai/seat build:native
      - name: Build the daemon host primitives in the MSVC developer environment
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -property installationPath`) do set "VS=%%i"
          if not defined VS exit /b 1
          call "%VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=amd64 -host_arch=amd64
          if errorlevel 1 exit /b 1
          node packages/seat/scripts/build-native.mjs --host
          if errorlevel 1 exit /b 1
      - run: pnpm smoke:daemon-transport
      - run: pnpm --dir desktop test
      - run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --no-default-features --lib
      - run: pnpm smoke:daemon-install-native
      - name: Prepare the disposable Linux user manager
        if: inputs.real_service && runner.os == 'Linux'
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" -ne 0
          test "$USER" = "$(id -un)"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user show-environment > /dev/null
          test "$(loginctl show-user "$USER" --property=Linger --value)" = yes
          printf 'XDG_RUNTIME_DIR=%s\nDBUS_SESSION_BUS_ADDRESS=%s\n' "$XDG_RUNTIME_DIR" "$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
      - name: Verify the real per-user daemon service
        if: inputs.real_service
        env:
          COTAL_TEST_REAL_SERVICE: '1'
        run: node bin/smoke/daemon-install-real.smoke.mjs
      - name: Upload the real service result
        if: always() && inputs.real_service
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daemon-service-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/daemon-service-result.json
          if-no-files-found: error
          retention-days: 7
      - run: pnpm --filter cotal-ai seeded-connectors
      - name: Agent apps through the desktop bridge
        if: runner.os != 'Windows'
        run: pnpm smoke:daemon-desktop-agent-apps
      # Notarization refuses unsigned nested code, and Tauri does not sign Mach-O files under Resources, so a
      # release build signs the runtime's own before prepare:runtime hashes them. This keychain exists only for
      # that step; Tauri imports the certificate again for the bundle.
      - name: Import the macOS signing certificate for the runtime
        if: runner.os == 'macOS' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ]; then echo 'No macOS signing certificate: the runtime stays unsigned.'; exit 0; fi
          keychain="$RUNNER_TEMP/cotal-runtime-signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # shellcheck disable=SC2046 # the existing search list is one keychain path per word
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cotal-runtime-signing.p12"
          security import "$RUNNER_TEMP/cotal-runtime-signing.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cotal-runtime-signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          echo "COTAL_RUNTIME_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "COTAL_RUNTIME_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
      - run: pnpm --dir desktop prepare:runtime
      - name: Remove the runtime signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "${COTAL_RUNTIME_SIGNING_KEYCHAIN:-}" ] && [ -e "$COTAL_RUNTIME_SIGNING_KEYCHAIN" ]; then security delete-keychain "$COTAL_RUNTIME_SIGNING_KEYCHAIN"; fi
      - run: pnpm --dir desktop check:runtime
      - name: Compile configured and no-key updater branches
        if: inputs.updater_compile && runner.os != 'Linux'
        shell: pwsh
        run: ./desktop/scripts/check-updater-native.ps1
      - name: Upload updater native compiler evidence
        if: always() && inputs.updater_compile && runner.os != 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-updater-native-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/desktop-updater-native/
          if-no-files-found: error
          retention-days: 7
      - name: Check notarization credential selection
        shell: pwsh
        run: ./desktop/scripts/check-notarization.ps1
      - name: Prepare release signing
        id: signing
        shell: pwsh
        env:
          RELEASE_BUILD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          APPLE_CERTIFICATE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_ISSUER: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_CONTENT: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_API_KEY_CONTENT || '' }}
          WINDOWS_CERTIFICATE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          WINDOWS_TIMESTAMP_URL: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_TIMESTAMP_URL || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          'signed=false' >> $env:GITHUB_OUTPUT
          if ($env:RELEASE_BUILD -ne 'true') { exit 0 }
          if ($env:RUNNER_OS -eq 'macOS') {
            $cert = @($env:APPLE_CERTIFICATE, $env:APPLE_CERTIFICATE_PASSWORD, $env:APPLE_SIGNING_IDENTITY)
            $appleId = @($env:APPLE_ID, $env:APPLE_PASSWORD, $env:APPLE_TEAM_ID)
            $api = @($env:APPLE_API_ISSUER, $env:APPLE_API_KEY, $env:APPLE_API_KEY_CONTENT)
            $present = @($cert + $appleId + $api | Where-Object { $_ })
            if ($present.Count -eq 0) { Write-Output 'No macOS signing secrets: unsigned validation packages.'; exit 0 }
            if (@($cert | Where-Object { $_ }).Count -ne 3) { throw 'Incomplete macOS signing certificate configuration.' }
            $idCount = @($appleId | Where-Object { $_ }).Count
            $apiCount = @($api | Where-Object { $_ }).Count
            if (($idCount -ne 0 -and $idCount -ne 3) -or ($apiCount -ne 0 -and $apiCount -ne 3) -or ($idCount + $apiCount -ne 3)) { throw 'Configure one complete notarization credential set.' }
            if ($apiCount -eq 3) {
              $keyPath = Join-Path $env:RUNNER_TEMP 'cotal-notary-key.p8'
              [IO.File]::WriteAllText($keyPath, $env:APPLE_API_KEY_CONTENT)
              & chmod 600 $keyPath
              if ($LASTEXITCODE -ne 0) { throw 'Could not protect notarization key.' }
              "APPLE_API_KEY_PATH=$keyPath" >> $env:GITHUB_ENV
            }
            'signed=true' >> $env:GITHUB_OUTPUT
          } elseif ($env:RUNNER_OS -eq 'Windows') {
            $values = @($env:WINDOWS_CERTIFICATE, $env:WINDOWS_CERTIFICATE_PASSWORD, $env:WINDOWS_TIMESTAMP_URL)
            $count = @($values | Where-Object { $_ }).Count
            if ($count -eq 0) { Write-Output 'No Windows signing secrets: unsigned validation packages.'; exit 0 }
            if ($count -ne 3) { throw 'Incomplete Windows signing certificate configuration.' }
            $pfx = Join-Path $env:RUNNER_TEMP 'cotal-signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            try {
              $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
              if (-not $cert.HasPrivateKey) { throw 'The signing certificate has no private key.' }
              "WINDOWS_SIGNING_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
              $config = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = $env:WINDOWS_TIMESTAMP_URL } } }
              $path = Join-Path $env:RUNNER_TEMP 'cotal-signing.json'
              $config | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 $path
              "WINDOWS_SIGNING_CONFIG=$path" >> $env:GITHUB_ENV
            } finally { Remove-Item -LiteralPath $pfx }
            'signed=true' >> $env:GITHUB_OUTPUT
          }
      - name: Build desktop packages
        id: build
        shell: pwsh
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
          SIGNED_BUILD: ${{ steps.signing.outputs.signed }}
          RELEASE_BUILD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          UPDATER_PUBLIC_KEY: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && runner.os != 'Linux' && vars.COTAL_UPDATER_PUBLIC_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && runner.os != 'Linux' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && runner.os != 'Linux' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          APPLE_CERTIFICATE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SIGNED_BUILD -ne 'true') {
            Get-ChildItem Env:APPLE_* | Remove-Item
            Write-Output 'Building unsigned validation packages.'
          } else {
            # Tauri uses the Apple ID login whenever APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID exist, even
            # empty, so the unused notarization set must be absent, not blank.
            Get-ChildItem Env:APPLE_* | Where-Object { -not $_.Value } | Remove-Item
            Write-Output 'Building signed release packages.'
          }
          $args = @('--dir', 'desktop', 'exec', 'tauri', 'build', '--bundles', '${{ matrix.bundles }}')
          if ($env:WINDOWS_SIGNING_CONFIG) { $args += @('--config', $env:WINDOWS_SIGNING_CONFIG) }
          if ($env:RUNNER_OS -eq 'macOS' -and $env:SIGNED_BUILD -ne 'true') {
            # Without a certificate the bundle is signed ad hoc. A linker-signed binary alone leaves the
            # bundle's resources unsealed, and macOS reports a downloaded copy as damaged.
            $adhoc = Join-Path $env:RUNNER_TEMP 'cotal-adhoc-signing.json'
            '{"bundle":{"macOS":{"signingIdentity":"-"}}}' | Set-Content -Encoding utf8 $adhoc
            $args += @('--config', $adhoc)
          }
          # macOS and Windows release builds carry the app updater: the compiled public key turns it on, and
          # the private key signs each update bundle. Linux packages update through their installer.
          if ($env:RELEASE_BUILD -eq 'true' -and $env:RUNNER_OS -ne 'Linux') {
            if (@($env:UPDATER_PUBLIC_KEY, $env:TAURI_SIGNING_PRIVATE_KEY, $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD | Where-Object { $_ }).Count -ne 3) {
              throw 'A macOS or Windows release build needs the app updater key: repository variable COTAL_UPDATER_PUBLIC_KEY and secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.'
            }
            $env:COTAL_UPDATER_PUBLIC_KEY = $env:UPDATER_PUBLIC_KEY
            $updater = Join-Path $env:RUNNER_TEMP 'cotal-updater.json'
            @{ bundle = @{ createUpdaterArtifacts = $true }; plugins = @{ updater = @{ pubkey = $env:UPDATER_PUBLIC_KEY } } } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 $updater
            $args += @('--config', $updater)
            'updater=true' >> $env:GITHUB_OUTPUT
          } else {
            Get-ChildItem Env:TAURI_SIGNING_* | Remove-Item
            'updater=false' >> $env:GITHUB_OUTPUT
          }
          & pnpm @args
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed.' }
          & pnpm --dir desktop check:size
          if ($LASTEXITCODE -ne 0) { throw 'Desktop bundle size budget exceeded.' }
      - name: Verify installed Linux RPM files and bundled CLI
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          docker run --rm -i -e DO_NOT_TRACK=1 \
            -v "$PWD/desktop/src-tauri/target/release/bundle/rpm:/packages:ro" fedora:41 bash -se <<'FEDORA'
          set -o pipefail
          scratch=$(mktemp -d)
          export HOME="$scratch/home" COTAL_HOME="$scratch/cotal" XDG_CONFIG_HOME="$scratch/config" TMPDIR="$scratch/tmp"
          mkdir -p "$HOME" "$COTAL_HOME" "$XDG_CONFIG_HOME" "$TMPDIR"
          dnf install -y /packages/*.rpm
          rpm -V cotal
          /usr/bin/cotal-node /usr/lib/Cotal/runtime/dist/cotal.js --version
          FEDORA
      # The only notarization: Tauri gets no notarization login, so it signs the app and the disk image and
      # skips submitting. Gatekeeper assesses a downloaded disk image on open and rejects a signed, unnotarized
      # one; the notary service checks everything nested in the image, the app included, so one submission and
      # the image's stapled ticket cover both, with one wait for Apple instead of two.
      - name: Notarize and staple the macOS disk image
        if: runner.os == 'macOS' && steps.signing.outputs.signed == 'true'
        shell: bash
        env:
          APPLE_ID: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_ISSUER: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_API_KEY || '' }}
        run: |
          set -euo pipefail
          dmgs=()
          while IFS= read -r found; do dmgs+=("$found"); done < <(find desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg')
          [ "${#dmgs[@]}" -eq 1 ] || { echo "expected one disk image, found ${#dmgs[@]}"; exit 1; }
          dmg=${dmgs[0]}
          if [ -n "$APPLE_API_KEY" ]; then auth=(--key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")
          else auth=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID"); fi
          result="$RUNNER_TEMP/dmg-notarization.json"
          # A rejected submission can exit nonzero; the status check below handles every outcome and prints the log.
          xcrun notarytool submit "$dmg" "${auth[@]}" --wait --output-format json > "$result" || true
          cat "$result"
          id=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).id ?? '')" "$result")
          status=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).status ?? '')" "$result")
          if [ "$status" != 'Accepted' ]; then
            [ -n "$id" ] && xcrun notarytool log "$id" "${auth[@]}"
            echo "disk image notarization ended with status '${status:-none}'"; exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -vv -t open --context context:primary-signature "$dmg" 2>&1 | tee "$RUNNER_TEMP/dmg-spctl.txt"
          grep -q 'source=Notarized Developer ID' "$RUNNER_TEMP/dmg-spctl.txt"
      - name: Verify compiled updater release inputs
        env:
          COTAL_UPDATER_EXPECTED_PUBLIC_KEY: ${{ steps.build.outputs.updater == 'true' && vars.COTAL_UPDATER_PUBLIC_KEY || '' }}
        run: node desktop/scripts/check-updater-release.mjs
      # Both Mac builds name their update bundle Cotal.app.tar.gz; give it the disk image's name so the two
      # architectures can share one release.
      - name: Name the macOS update bundle after its disk image
        if: runner.os == 'macOS' && steps.build.outputs.updater == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bundle=desktop/src-tauri/target/release/bundle
          archives=("$bundle"/macos/*.app.tar.gz)
          dmgs=("$bundle"/dmg/*.dmg)
          [ "${#archives[@]}" -eq 1 ] && [ -f "${archives[0]}" ] && [ -f "${archives[0]}.sig" ] || { echo 'expected one signed update bundle'; exit 1; }
          [ "${#dmgs[@]}" -eq 1 ] && [ -f "${dmgs[0]}" ] || { echo 'expected one disk image'; exit 1; }
          name=$(basename "${dmgs[0]}" .dmg).app.tar.gz
          mv "${archives[0]}" "$bundle/macos/$name"
          mv "${archives[0]}.sig" "$bundle/macos/$name.sig"
          echo "Update bundle: $name"
      - name: Verify the macOS bundle signature seals the whole app
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app=$(find desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          [ -n "$app" ] || { echo 'no built app bundle'; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -q '^Sealed Resources version=' "$RUNNER_TEMP/codesign.txt"
          grep -q '^Info.plist entries=' "$RUNNER_TEMP/codesign.txt"
          # The same check on a copy carrying the download quarantine mark, as a browser leaves it.
          copy="$RUNNER_TEMP/quarantined/$(basename "$app")"
          mkdir -p "$RUNNER_TEMP/quarantined" && cp -R "$app" "$copy"
          xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Browser;" "$copy"
          codesign --verify --deep --strict "$copy"
      - name: Run the bundled Node under the signature the app ships with
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app=$(find desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          node="$app/Contents/MacOS/cotal-node"
          runtime="$app/Contents/Resources/runtime"
          codesign -d --verbose=2 "$node" 2>&1 | grep '^CodeDirectory'
          codesign -d --entitlements - "$node" 2>&1 | grep -q 'com.apple.security.cs.allow-jit'
          # The hardened runtime refuses V8's executable memory and the bundled native addons unless
          # the signature carries the entitlements for them. Node then dies before it runs a line.
          "$node" -e 'console.log(process.version)'
          "$node" "$runtime/dist/cotal.js" --version
          find "$runtime/node_modules" -name '*.node' -print0 | xargs -0 -n 1 "$node" -e 'require(require("node:path").resolve(process.argv[1]))'
      - name: Remove temporary signing material
        if: always()
        shell: pwsh
        run: |
          if ($env:APPLE_API_KEY_PATH -and (Test-Path -LiteralPath $env:APPLE_API_KEY_PATH)) { Remove-Item -LiteralPath $env:APPLE_API_KEY_PATH }
          if ($env:WINDOWS_SIGNING_CONFIG -and (Test-Path -LiteralPath $env:WINDOWS_SIGNING_CONFIG)) { Remove-Item -LiteralPath $env:WINDOWS_SIGNING_CONFIG }
          if ($env:WINDOWS_SIGNING_THUMBPRINT) { Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:WINDOWS_SIGNING_THUMBPRINT" }
      - name: Upload built desktop packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-validation-${{ runner.os }}-${{ runner.arch }}
          path: desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 7
      - name: Verify macOS window-scoped Dock presence, focus and reopen
        if: runner.os == 'macOS'
        run: bash desktop/scripts/check-presence-macos.sh
      - name: Verify installed Windows shortcuts and taskbar presence
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./desktop/scripts/check-presence-windows.ps1
      - name: Verify Linux launcher packaging
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/desktop-presence"
          deb=$(find desktop/src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          rpm=$(find desktop/src-tauri/target/release/bundle/rpm -name '*.rpm' -print -quit)
          dpkg-deb --contents "$deb" | tee "$RUNNER_TEMP/desktop-presence/deb-files.txt"
          rpm -qlp "$rpm" | tee "$RUNNER_TEMP/desktop-presence/rpm-files.txt"
          for manifest in "$RUNNER_TEMP/desktop-presence/"*-files.txt; do
            grep -E 'share/applications/.*\.desktop' "$manifest"
            grep -E 'share/icons/.*\.png' "$manifest"
          done
      - name: Upload native presence evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-presence-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/desktop-presence/
          if-no-files-found: warn
          retention-days: 7
      - name: Stage release installers
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-release-${{ runner.os }}-${{ runner.arch }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.rpm
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.app.tar.gz
            desktop/src-tauri/target/release/bundle/**/*.app.tar.gz.sig
            desktop/src-tauri/target/release/bundle/**/*-setup.exe.sig
          if-no-files-found: error
          retention-days: 7
  clean-install-linux:
    needs: native-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Keep the unfinished bootstrap check advisory until clean installs and upgrades pass.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        format: [deb, rpm]
        cell: [first-install, upgrade]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-validation-Linux-X64
          path: ${{ runner.temp }}/candidate
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --workspace-concurrency=2 --filter cotal-ai... build
      - name: Run the packaged desktop journey in a clean container
        env:
          GH_TOKEN: ${{ github.token }}
          FORMAT: ${{ matrix.format }}
          OLD_VERSION: ${{ matrix.cell == 'upgrade' && '0.177.0' || '' }}
        run: |
          set -euo pipefail
          downloads="$RUNNER_TEMP/downloads"
          node desktop/e2e/clean-install-assets.mjs "$downloads" "$FORMAT" "$OLD_VERSION"
          mapfile -t candidate < <(find "$RUNNER_TEMP/candidate" -name "*.$FORMAT")
          [ "${#candidate[@]}" -eq 1 ]
          old=''
          if [ -n "$OLD_VERSION" ]; then old=$(find "$downloads" -name "*.$FORMAT"); fi
          bash desktop/e2e/clean-install-linux.sh "$FORMAT" "${candidate[0]}" "$old" "$downloads/nats-server-v2.15.1-linux-amd64/nats-server"
  clean-install-macos:
    needs: native-build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
        cell: [first-install, upgrade]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-validation-macOS-${{ runner.arch }}
          path: ${{ runner.temp }}/candidate
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --workspace-concurrency=2 --filter cotal-ai... build
      - name: Run the packaged desktop journey without system tools
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_VERSION: ${{ matrix.cell == 'upgrade' && '0.177.0' || '' }}
        run: |
          set -euo pipefail
          downloads="$RUNNER_TEMP/downloads"
          node desktop/e2e/clean-install-assets.mjs "$downloads" dmg "$OLD_VERSION"
          candidate=$(find "$RUNNER_TEMP/candidate" -name '*.dmg')
          old=''
          if [ -n "$OLD_VERSION" ]; then old=$(find "$downloads" -name '*.dmg'); fi
          broker=$(find "$downloads" -type f -name nats-server)
          bash desktop/e2e/clean-install-macos.sh "$candidate" "$old" "$broker"
  clean-install-windows:
    needs: native-build
    runs-on: windows-2022
    timeout-minutes: 35
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        cell: [first-install, '0.162.0', '0.177.0']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-validation-Windows-X64
          path: ${{ runner.temp }}/candidate
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: Build the local acceptance fixture
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -property installationPath`) do set "VS=%%i"
          if not defined VS exit /b 1
          call "%VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=amd64 -host_arch=amd64
          if errorlevel 1 exit /b 1
          call pnpm --workspace-concurrency=2 --filter cotal-ai... build
      - name: Run the packaged desktop journey without system tools
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_VERSION: ${{ matrix.cell != 'first-install' && matrix.cell || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $downloads = Join-Path $env:RUNNER_TEMP 'downloads'
          node desktop/e2e/clean-install-assets.mjs $downloads exe $env:OLD_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $candidate = @(Get-ChildItem "$env:RUNNER_TEMP/candidate" -Recurse -Filter '*-setup.exe')
          if ($candidate.Count -ne 1) { throw 'Expected one candidate setup program.' }
          $old = if ($env:OLD_VERSION) { Join-Path $downloads "Cotal_$($env:OLD_VERSION)_x64-setup.exe" } else { '' }
          $broker = (Get-ChildItem $downloads -Recurse -Filter 'nats-server.exe').FullName
          ./desktop/e2e/clean-install-windows.ps1 $candidate[0].FullName $old $broker
  updater-arm:
    if: inputs.updater_apply
    uses: ./.github/workflows/desktop-mac-updater.yml
    with:
      runner: macos-15
      mode: explicit
      fixture_head: ${{ inputs.updater_fixture_head }}
  updater-followup:
    if: inputs.updater_apply
    needs: updater-arm
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-15
            mode: hidden
          - runner: macos-15-intel
            mode: explicit
    uses: ./.github/workflows/desktop-mac-updater.yml
    with:
      runner: ${{ matrix.runner }}
      mode: ${{ matrix.mode }}
      fixture_head: ${{ inputs.updater_fixture_head }}
  updater-windows:
    if: inputs.updater_apply
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - run: pnpm install --frozen-lockfile
      - name: Build Windows native bindings and debug N, N+1 and N+2 NSIS bundles
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -property installationPath`) do set "VS=%%i"
          if not defined VS exit /b 1
          call "%VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=amd64 -host_arch=amd64
          if errorlevel 1 exit /b 1
          node packages/workspace/scripts/build-native.mjs
          if errorlevel 1 exit /b 1
          node packages/seat/scripts/build-native.mjs --host
          if errorlevel 1 exit /b 1
          call pnpm --workspace-concurrency=3 --filter cotal-ai... build
          if errorlevel 1 exit /b 1
          call pnpm exec node desktop/test/win-updater-build.mjs
          if errorlevel 1 exit /b 1
      - name: Install fixture broker
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $version='2.12.2'
          $zip=Join-Path $env:RUNNER_TEMP 'nats.zip'
          Invoke-WebRequest "https://github.com/nats-io/nats-server/releases/download/v$version/nats-server-v$version-windows-amd64.zip" -OutFile $zip
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP 'nats')
          (Join-Path $env:RUNNER_TEMP "nats/nats-server-v$version-windows-amd64") >> $env:GITHUB_PATH
      - name: Exercise 2-hop native Windows app update, Scheduled Task service and real occupied PTY
        run: pnpm exec tsx desktop/test/win-updater-proof.mjs
      - name: Upload Windows native updater acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: win-updater-windows-2022
          path: |
            ${{ runner.temp }}/win-updater-build/*.log
            ${{ runner.temp }}/win-updater-build/build-result.json
            ${{ runner.temp }}/win-updater-result/
          if-no-files-found: error
          retention-days: 7
  # This only stages the draft and its update feed. A required clean-install job must succeed before it runs.
  release:
    needs: [clean-install-linux, clean-install-macos, clean-install-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      actions: read
      contents: write
    steps:
      - name: Attach each platform's installers as soon as they are staged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          expected=(desktop-release-Linux-X64 desktop-release-Windows-X64 desktop-release-macOS-X64 desktop-release-macOS-ARM64)
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes 'Desktop installer validation packages. Check each platform signature before distribution.' \
              || gh release view "$TAG" > /dev/null
          fi
          attached=" "
          final=false
          while :; do
            # Read the jobs before the artifacts: a build that has ended has already staged what it will stage.
            running=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" --paginate \
              -q '.jobs[] | select((.name | startswith("native-build")) and .status != "completed") | .name' | wc -l)
            [ "$running" -eq 0 ] && final=true
            for name in "${expected[@]}"; do
              [[ "$attached" == *" $name "* ]] && continue
              id=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts?name=$name" -q '[.artifacts[] | select(.expired | not)] | max_by(.created_at) | .id // empty')
              [ -n "$id" ] || continue
              rm -rf "installers/$name" && mkdir -p "installers/$name"
              curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -o "installers/$name.zip" "https://api.github.com/repos/$GH_REPO/actions/artifacts/$id/zip"
              unzip -q "installers/$name.zip" -d "installers/$name"
              mapfile -d '' packages < <(find "installers/$name" -type f -print0)
              test "${#packages[@]}" -gt 0
              gh release upload "$TAG" --clobber "${packages[@]}"
              attached+="$name "
              echo "Attached ${#packages[@]} installers from $name."
            done
            missing=()
            for name in "${expected[@]}"; do [[ "$attached" == *" $name "* ]] || missing+=("$name"); done
            [ "${#missing[@]}" -eq 0 ] && { echo "All ${#expected[@]} platforms attached."; break; }
            $final && { echo "::error::Builds ended without installers for: ${missing[*]}"; exit 1; }
            sleep 30
          done
      # Installed Mac and Windows apps poll releases/latest/download/desktop-latest.json. It is attached last,
      # after every update bundle it names, and only when all three are there.
      - name: Publish the app update feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          one() {
            mapfile -t found < <(find installers -type f -name "$1")
            [ "${#found[@]}" -eq 1 ] && [ -f "${found[0]}.sig" ] || { echo "::error::expected one update file matching $1 with its .sig beside it, found ${#found[@]} files" >&2; exit 1; }
            printf '%s' "${found[0]}"
          }
          arm=$(one '*_aarch64.app.tar.gz')
          intel=$(one '*_x64.app.tar.gz')
          windows=$(one '*-setup.exe')
          url="https://github.com/$GH_REPO/releases/download/$TAG"
          entry() { jq -n --arg url "$url/$(basename "$1")" --rawfile signature "$1.sig" '{url: $url, signature: $signature}'; }
          jq -n --arg version "${TAG#v}" --arg notes "https://github.com/$GH_REPO/releases/tag/$TAG" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson arm "$(entry "$arm")" --argjson intel "$(entry "$intel")" --argjson windows "$(entry "$windows")" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {"darwin-aarch64": $arm, "darwin-x86_64": $intel, "windows-x86_64": $windows}}' > desktop-latest.json
          jq . desktop-latest.json
          gh release upload "$TAG" --clobber desktop-latest.json
