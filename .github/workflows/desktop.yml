name: Measure published desktop replacement
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replacement:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [macos-15, windows-2022]
        mode: [window-open, service-only]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Prepare Microsoft query-only Handle diagnostic
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'Handle.zip'
          Invoke-WebRequest https://download.sysinternals.com/files/Handle.zip -OutFile $archive
          $directory = Join-Path $env:RUNNER_TEMP 'handle-query'
          Expand-Archive $archive $directory
          $binary = Join-Path $directory 'handle64.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $binary
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Handle must carry a valid Microsoft signature.' }
          "DESKTOP_MEASURE_HANDLE=$binary" >> $env:GITHUB_ENV
      - name: Replace published 0.164.6 with published 0.164.7
        env:
          DESKTOP_REPLACEMENT_MODE: ${{ matrix.mode }}
          DO_NOT_TRACK: '1'
        run: node desktop/e2e/published-replacement.mjs
      - name: Upload original replacement observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-replacement-${{ runner.os }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/desktop-replacement/
          if-no-files-found: error
          retention-days: 7
