name: Desktop apps
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      real_service:
        description: 'Install and remove an isolated per-user daemon service on disposable Linux/macOS/Windows runners'
        type: boolean
        default: false
      windows_only:
        description: 'Run only the Windows native job for an installed-service diagnostic'
        type: boolean
        default: false
  schedule:
    - cron: '17 6 * * 1'
  pull_request:
    paths:
      - 'desktop/**'
      - 'bin/daemon/**'
      - 'bin/smoke/daemon-install-*.smoke.*'
      - 'packages/seat/**'
      - 'packages/workspace/native/**'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    if: ${{ !inputs.windows_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify passive native diagnostic wiring
        run: node --test desktop/e2e/diagnostic-wiring.test.mjs desktop/e2e/receipt-mirror.test.mjs
      - run: pnpm --dir desktop exec playwright-core install --with-deps chromium
      - run: pnpm --dir desktop test:render
      - name: Verify desktop motion
        run: pnpm --dir desktop test:render
        env:
          MOTION: '1'
          CASES: waiting,signed-in,spaces,connecting,ready,no-application,declined,progress-done,notice,details-open
          SHOTS: test/render/artifacts/motion
      - name: Upload desktop renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-render
          path: desktop/test/render/artifacts
          if-no-files-found: error
          retention-days: 7
  native-build:
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.windows_only &&
          '[{"os":"windows-2022","bundles":"nsis,msi"}]' ||
          '[{"os":"ubuntu-24.04","bundles":"deb,rpm"},{"os":"macos-15","bundles":"app,dmg"},{"os":"macos-26","bundles":"app,dmg","artifact_suffix":"-macos26"},{"os":"macos-15-intel","bundles":"app,dmg"},{"os":"windows-2022","bundles":"nsis,msi"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux webview and tray build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb xdotool x11-utils imagemagick tesseract-ocr python3-pyatspi at-spi2-core dbus-x11 xfce4-panel xfconf openbox wmctrl
      - run: pnpm install --frozen-lockfile
      - name: Build the stock Windows identity bindings
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" exit /b 1
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -property installationPath`) do set "VS=%%i"
          if not defined VS exit /b 1
          call "%VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=amd64 -host_arch=amd64
          if errorlevel 1 exit /b 1
          node packages/workspace/scripts/build-native.mjs
          if errorlevel 1 exit /b 1
      - name: Build the stock macOS identity bindings
        if: runner.os == 'macOS'
        run: node packages/workspace/scripts/build-native.mjs
      - run: pnpm --workspace-concurrency=1 --filter cotal-ai... build
      - name: Typecheck native desktop test sources
        run: pnpm --dir desktop exec tsc --noEmit -p e2e/tsconfig.json
      - name: Build the daemon host primitives
        if: runner.os != 'Windows'
        run: pnpm --filter @cotal-ai/seat build:native
      - name: Build the daemon host primitives in the MSVC developer environment
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -property installationPath`) do set "VS=%%i"
          if not defined VS exit /b 1
          call "%VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=amd64 -host_arch=amd64
          if errorlevel 1 exit /b 1
          node packages/seat/scripts/build-native.mjs --host
          if errorlevel 1 exit /b 1
      - run: pnpm smoke:daemon-transport
      - run: pnpm --dir desktop test
      - run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --no-default-features --lib
      - run: pnpm smoke:daemon-install-native
      - name: Prepare the disposable Linux user manager
        if: runner.os == 'Linux'
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" -ne 0
          test "$USER" = "$(id -un)"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user show-environment > /dev/null
          test "$(loginctl show-user "$USER" --property=Linger --value)" = yes
          printf 'XDG_RUNTIME_DIR=%s\nDBUS_SESSION_BUS_ADDRESS=%s\n' "$XDG_RUNTIME_DIR" "$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
      - name: Verify the real per-user daemon service
        if: inputs.real_service && runner.os == 'macOS'
        env:
          COTAL_TEST_REAL_SERVICE: '1'
        run: node bin/smoke/daemon-install-real.smoke.mjs
      - name: Upload the real service result
        if: always() && inputs.real_service && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: daemon-service-${{ runner.os }}-${{ runner.arch }}${{ matrix.artifact_suffix }}
          path: ${{ runner.temp }}/daemon-service-result.json
          if-no-files-found: error
          retention-days: 7
      - run: pnpm --filter cotal-ai seeded-connectors
      - run: pnpm --dir desktop prepare:runtime
      - run: pnpm --dir desktop check:runtime
      - name: Check notarization credential selection
        shell: pwsh
        run: ./desktop/scripts/check-notarization.ps1
      - name: Prepare release signing
        id: signing
        shell: pwsh
        env:
          RELEASE_BUILD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          APPLE_CERTIFICATE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_ISSUER: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_CONTENT: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_API_KEY_CONTENT || '' }}
          WINDOWS_CERTIFICATE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          WINDOWS_TIMESTAMP_URL: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_TIMESTAMP_URL || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          'signed=false' >> $env:GITHUB_OUTPUT
          if ($env:RELEASE_BUILD -ne 'true') { exit 0 }
          if ($env:RUNNER_OS -eq 'macOS') {
            $cert = @($env:APPLE_CERTIFICATE, $env:APPLE_CERTIFICATE_PASSWORD, $env:APPLE_SIGNING_IDENTITY)
            $appleId = @($env:APPLE_ID, $env:APPLE_PASSWORD, $env:APPLE_TEAM_ID)
            $api = @($env:APPLE_API_ISSUER, $env:APPLE_API_KEY, $env:APPLE_API_KEY_CONTENT)
            $present = @($cert + $appleId + $api | Where-Object { $_ })
            if ($present.Count -eq 0) { Write-Output 'No macOS signing secrets: unsigned validation packages.'; exit 0 }
            if (@($cert | Where-Object { $_ }).Count -ne 3) { throw 'Incomplete macOS signing certificate configuration.' }
            $idCount = @($appleId | Where-Object { $_ }).Count
            $apiCount = @($api | Where-Object { $_ }).Count
            if (($idCount -ne 0 -and $idCount -ne 3) -or ($apiCount -ne 0 -and $apiCount -ne 3) -or ($idCount + $apiCount -ne 3)) { throw 'Configure one complete notarization credential set.' }
            if ($apiCount -eq 3) {
              $keyPath = Join-Path $env:RUNNER_TEMP 'cotal-notary-key.p8'
              [IO.File]::WriteAllText($keyPath, $env:APPLE_API_KEY_CONTENT)
              & chmod 600 $keyPath
              if ($LASTEXITCODE -ne 0) { throw 'Could not protect notarization key.' }
              "APPLE_API_KEY_PATH=$keyPath" >> $env:GITHUB_ENV
            }
            'signed=true' >> $env:GITHUB_OUTPUT
          } elseif ($env:RUNNER_OS -eq 'Windows') {
            $values = @($env:WINDOWS_CERTIFICATE, $env:WINDOWS_CERTIFICATE_PASSWORD, $env:WINDOWS_TIMESTAMP_URL)
            $count = @($values | Where-Object { $_ }).Count
            if ($count -eq 0) { Write-Output 'No Windows signing secrets: unsigned validation packages.'; exit 0 }
            if ($count -ne 3) { throw 'Incomplete Windows signing certificate configuration.' }
            $pfx = Join-Path $env:RUNNER_TEMP 'cotal-signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            try {
              $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
              if (-not $cert.HasPrivateKey) { throw 'The signing certificate has no private key.' }
              "WINDOWS_SIGNING_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
              $config = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = $env:WINDOWS_TIMESTAMP_URL } } }
              $path = Join-Path $env:RUNNER_TEMP 'cotal-signing.json'
              $config | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 $path
              "WINDOWS_SIGNING_CONFIG=$path" >> $env:GITHUB_ENV
            } finally { Remove-Item -LiteralPath $pfx }
            'signed=true' >> $env:GITHUB_OUTPUT
          }
      - name: Build desktop packages
        shell: pwsh
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
          SIGNED_BUILD: ${{ steps.signing.outputs.signed }}
          APPLE_CERTIFICATE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_ISSUER: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_API_KEY || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SIGNED_BUILD -ne 'true') {
            Get-ChildItem Env:APPLE_* | Remove-Item
            Write-Output 'Building unsigned validation packages.'
          } else { Write-Output 'Building signed release packages.' }
          $args = @('--dir', 'desktop', 'exec', 'tauri', 'build', '--bundles', '${{ matrix.bundles }}')
          if ($env:WINDOWS_SIGNING_CONFIG) { $args += @('--config', $env:WINDOWS_SIGNING_CONFIG) }
          if ($env:RUNNER_OS -eq 'macOS' -and $env:SIGNED_BUILD -ne 'true') {
            # Without a certificate the bundle is signed ad hoc. A linker-signed binary alone leaves the
            # bundle's resources unsealed, and macOS reports a downloaded copy as damaged.
            $adhoc = Join-Path $env:RUNNER_TEMP 'cotal-adhoc-signing.json'
            '{"bundle":{"macOS":{"signingIdentity":"-"}}}' | Set-Content -Encoding utf8 $adhoc
            $args += @('--config', $adhoc)
          }
          & pnpm @args
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed.' }
          & pnpm --dir desktop check:size
          if ($LASTEXITCODE -ne 0) { throw 'Desktop bundle size budget exceeded.' }
      - name: Verify the macOS bundle signature seals the whole app
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app=$(find desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          [ -n "$app" ] || { echo 'no built app bundle'; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -q '^Sealed Resources version=' "$RUNNER_TEMP/codesign.txt"
          grep -q '^Info.plist entries=' "$RUNNER_TEMP/codesign.txt"
          # The same check on a copy carrying the download quarantine mark, as a browser leaves it.
          copy="$RUNNER_TEMP/quarantined/$(basename "$app")"
          mkdir -p "$RUNNER_TEMP/quarantined" && cp -R "$app" "$copy"
          xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Browser;" "$copy"
          codesign --verify --deep --strict "$copy"
      - name: Run the bundled Node under the signature the app ships with
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app=$(find desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          node="$app/Contents/MacOS/cotal-node"
          runtime="$app/Contents/Resources/runtime"
          codesign -d --verbose=2 "$node" 2>&1 | grep '^CodeDirectory'
          codesign -d --entitlements - "$node" 2>&1 | grep -q 'com.apple.security.cs.allow-jit'
          # The hardened runtime refuses V8's executable memory and the bundled native addons unless
          # the signature carries the entitlements for them. Node then dies before it runs a line.
          "$node" -e 'console.log(process.version)'
          "$node" "$runtime/dist/cotal.js" --version
          find "$runtime/node_modules" -name '*.node' -print0 | xargs -0 -n 1 "$node" -e 'require(require("node:path").resolve(process.argv[1]))'
      - name: Install Windows screenshot text verifier
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Windows OCR installation failed.' }
      - name: Launch the installed release package and capture its first window
        timeout-minutes: 8
        env:
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          GTK_A11Y: always
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- xvfb-run -a --server-args='-screen 0 1440x1200x24' pnpm --dir desktop exec tsx e2e/launch.ts
          else
            pnpm --dir desktop exec tsx e2e/launch.ts
          fi
      - name: Measure Windows native task queries with cold and warm private profiles
        if: runner.os == 'Windows'
        timeout-minutes: 9
        run: pnpm --dir desktop exec tsx e2e/windows-native.ts
      - name: Upload Windows native task query measurements
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-native
          path: ${{ runner.temp }}/desktop-windows-native/
          if-no-files-found: error
          retention-days: 7
      - name: Upload installed-package window proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-launch-${{ runner.os }}-${{ runner.arch }}${{ matrix.artifact_suffix }}
          path: ${{ runner.temp }}/desktop-launch/
          if-no-files-found: error
          retention-days: 7
      - name: Install native window driver
        if: runner.os != 'macOS'
        timeout-minutes: 10
        shell: bash
        run: cargo install tauri-driver --locked
      - name: Match Windows Edge WebDriver to the app's WebView2 runtime
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = @(Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe")
          if ($runtime.Count -ne 1) { throw 'Expected one installed WebView2 runtime.' }
          $edge = $runtime[0].VersionInfo.ProductVersion
          Write-Output "Matching WebView2 runtime $edge"
          $zip = Join-Path $env:RUNNER_TEMP 'edge-driver.zip'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$edge/edgedriver_win64.zip" -OutFile $zip
          $driver = Join-Path $env:RUNNER_TEMP 'edge-driver'
          Expand-Archive $zip $driver
          $driver >> $env:GITHUB_PATH
      - name: Install fixture broker
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '2.12.2'
          if ($env:RUNNER_OS -eq 'Windows') {
            $archive = Join-Path $env:RUNNER_TEMP 'nats.zip'
            Invoke-WebRequest "https://github.com/nats-io/nats-server/releases/download/v$version/nats-server-v$version-windows-amd64.zip" -OutFile $archive
            Expand-Archive $archive (Join-Path $env:RUNNER_TEMP 'nats')
            (Join-Path $env:RUNNER_TEMP "nats/nats-server-v$version-windows-amd64") >> $env:GITHUB_PATH
          } else {
            $platform = if ($env:RUNNER_OS -eq 'macOS') { 'darwin' } else { 'linux' }
            $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'amd64' }
            $archive = Join-Path $env:RUNNER_TEMP 'nats.tar.gz'
            Invoke-WebRequest "https://github.com/nats-io/nats-server/releases/download/v$version/nats-server-v$version-$platform-$arch.tar.gz" -OutFile $archive
            tar -xzf $archive -C $env:RUNNER_TEMP
            if ($LASTEXITCODE -ne 0) { throw 'Fixture broker extraction failed.' }
            (Join-Path $env:RUNNER_TEMP "nats-server-v$version-$platform-$arch") >> $env:GITHUB_PATH
          }
      - name: Build release-isolated real-window test binary
        timeout-minutes: 20
        shell: pwsh
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_DEV_INCREMENTAL: 'false'
        run: |
          pnpm --dir desktop exec tauri build --debug --no-bundle --features e2e
          if ($LASTEXITCODE -ne 0) { throw 'E2E test binary build failed.' }
          Copy-Item -Recurse desktop/src-tauri/runtime desktop/src-tauri/target/debug/runtime
      - name: Verify Windows stock peer identity observation
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        env:
          PEER_TRACE_BUNDLED_RUNTIME: ${{ github.workspace }}/desktop/src-tauri/target/debug/runtime
        run: |
          $outer = Join-Path $env:RUNNER_TEMP ('desktop-peer-outer-' + [guid]::NewGuid().ToString('N'))
          foreach ($entry in @{ HOME='home'; COTAL_HOME='cotal'; XDG_CONFIG_HOME='config'; XDG_DATA_HOME='data'; XDG_STATE_HOME='state'; XDG_CACHE_HOME='cache' }.GetEnumerator()) {
            $path = Join-Path $outer $entry.Value
            New-Item -ItemType Directory -Path $path -Force | Out-Null
            [Environment]::SetEnvironmentVariable($entry.Key, $path, 'Process')
          }
          node --test desktop/e2e/windows-peer-trace.test.mjs desktop/e2e/windows-peer-trace-native.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Stock Windows peer identity observation failed.' }
      - name: Diagnose Windows native deep-link argv and plugin delivery
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 3
        shell: pwsh
        run: pnpm --dir desktop exec tsx e2e/windows-deep-link.ts
      - name: Upload Windows native deep-link diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-deep-link
          path: ${{ runner.temp }}/desktop-windows-deep-link/
          if-no-files-found: error
          retention-days: 7
      - name: Verify Windows deep-link diagnostic released its context
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'desktop/src-tauri/target/debug/desktop-e2e.json') {
            throw 'Windows diagnostic context remains owned; real journeys will not overwrite it.'
          }
      - name: Windows service installation and disabled-task recovery
        if: runner.os == 'Windows'
        timeout-minutes: 12
        shell: pwsh
        env:
          COTAL_DAEMON_SMOKE_TMP: ${{ runner.temp }}
        run: node desktop/e2e/windows-journey.mjs start "${{ runner.temp }}/desktop-windows-journey" "${{ runner.temp }}/desktop-e2e"
      - name: Windows application refresh, per-space links and account lifecycle cleanup
        if: runner.os == 'Windows'
        timeout-minutes: 12
        shell: pwsh
        run: node desktop/e2e/windows-journey.mjs resume "${{ runner.temp }}/desktop-windows-journey" "${{ runner.temp }}/desktop-e2e"
      - name: Cancel an unfinished Windows journey through its fixture owner
        if: always() && runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: |
          $state = Join-Path $env:RUNNER_TEMP 'desktop-windows-journey/controller.json'
          if (Test-Path -LiteralPath $state) {
            node desktop/e2e/windows-journey.mjs cancel "${{ runner.temp }}/desktop-windows-journey" "${{ runner.temp }}/desktop-e2e"
            if ($LASTEXITCODE -ne 0) { throw 'Windows journey cleanup is failed or still outstanding. See phase and suite logs.' }
          }
      - name: Real-window onboarding, recovery and app-installed service lifecycle
        if: runner.os == 'Linux'
        timeout-minutes: 12
        env:
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          GTK_A11Y: always
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/desktop-e2e"
          outer=$(mktemp -d "$RUNNER_TEMP/desktop-service-outer.XXXXXX")
          export HOME="$outer/home" COTAL_HOME="$outer/cotal" XDG_CONFIG_HOME="$outer/config" XDG_DATA_HOME="$outer/data" XDG_STATE_HOME="$outer/state" XDG_CACHE_HOME="$outer/cache"
          mkdir -p "$HOME" "$COTAL_HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME" "$XDG_CACHE_HOME"
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- xvfb-run -a --server-args='-screen 0 1440x1200x24' pnpm exec tsx bin/smoke/daemon-service-connect.smoke.ts --desktop-window --keep-fixture 2>&1 | tee "$RUNNER_TEMP/desktop-e2e/suite.log"
          else
            pnpm exec tsx bin/smoke/daemon-service-connect.smoke.ts --desktop-window --keep-fixture 2>&1 | tee "$RUNNER_TEMP/desktop-e2e/suite.log"
          fi
      - name: Upload real-window screenshots and daemon observations
        if: always() && runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-${{ runner.os }}-${{ runner.arch }}${{ matrix.artifact_suffix }}
          path: ${{ runner.temp }}/desktop-e2e/
          if-no-files-found: error
          retention-days: 7
      - name: Connected account Ready, native Settings and login-command lifecycle
        if: runner.os != 'Windows'
        timeout-minutes: 15
        env:
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          GTK_A11Y: always
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/desktop-account-e2e"
          outer=$(mktemp -d "$RUNNER_TEMP/desktop-account-outer.XXXXXX")
          export HOME="$outer/home" COTAL_HOME="$outer/cotal" XDG_CONFIG_HOME="$outer/config" XDG_DATA_HOME="$outer/data" XDG_STATE_HOME="$outer/state" XDG_CACHE_HOME="$outer/cache"
          mkdir -p "$HOME" "$COTAL_HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME" "$XDG_CACHE_HOME"
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- xvfb-run -a --server-args='-screen 0 1440x1200x24' pnpm exec tsx bin/smoke/daemon-service-connect.smoke.ts --desktop-window --desktop-account --keep-fixture 2>&1 | tee "$RUNNER_TEMP/desktop-account-e2e/suite.log"
          else
            pnpm exec tsx bin/smoke/daemon-service-connect.smoke.ts --desktop-window --desktop-account --keep-fixture 2>&1 | tee "$RUNNER_TEMP/desktop-account-e2e/suite.log"
          fi
      - name: Upload connected account native lifecycle observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-account-e2e-${{ runner.os }}-${{ runner.arch }}${{ matrix.artifact_suffix }}
          path: |
            ${{ runner.temp }}/desktop-account-e2e/
            ${{ runner.temp }}/desktop-e2e-lifecycle/
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        shell: pwsh
        run: |
          if ($env:APPLE_API_KEY_PATH -and (Test-Path -LiteralPath $env:APPLE_API_KEY_PATH)) { Remove-Item -LiteralPath $env:APPLE_API_KEY_PATH }
          if ($env:WINDOWS_SIGNING_CONFIG -and (Test-Path -LiteralPath $env:WINDOWS_SIGNING_CONFIG)) { Remove-Item -LiteralPath $env:WINDOWS_SIGNING_CONFIG }
          if ($env:WINDOWS_SIGNING_THUMBPRINT) { Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:WINDOWS_SIGNING_THUMBPRINT" }
      - name: Upload built desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-validation-${{ runner.os }}-${{ runner.arch }}${{ matrix.artifact_suffix }}
          path: desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 7
      - name: Verify macOS window-scoped Dock presence, focus and reopen
        if: runner.os == 'macOS'
        run: bash -x desktop/scripts/check-presence-macos.sh
      - name: Verify installed Windows shortcuts and taskbar presence
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./desktop/scripts/check-presence-windows.ps1
      - name: Verify Linux launcher packaging
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/desktop-presence"
          deb=$(find desktop/src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          rpm=$(find desktop/src-tauri/target/release/bundle/rpm -name '*.rpm' -print -quit)
          dpkg-deb --contents "$deb" | tee "$RUNNER_TEMP/desktop-presence/deb-files.txt"
          rpm -qlp "$rpm" | tee "$RUNNER_TEMP/desktop-presence/rpm-files.txt"
          for manifest in "$RUNNER_TEMP/desktop-presence/"*-files.txt; do
            grep -E 'share/applications/.*\.desktop' "$manifest"
            grep -E 'share/icons/.*\.png' "$manifest"
          done
      - name: Upload native presence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-presence-${{ runner.os }}-${{ runner.arch }}${{ matrix.artifact_suffix }}
          path: ${{ runner.temp }}/desktop-presence/
          if-no-files-found: warn
          retention-days: 7
      - name: Stage release installers
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && matrix.os != 'macos-26'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-${{ runner.os }}-${{ runner.arch }}${{ matrix.artifact_suffix }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.rpm
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error
          retention-days: 7
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: native-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-release-*
          path: installers
      - name: Attach installers to the version release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes 'Desktop installer validation packages. Check each platform signature before distribution.'
          fi
          mapfile -d '' packages < <(find installers -type f -print0)
          test "${#packages[@]}" -gt 0
          gh release upload "$TAG" "${packages[@]}"
