name: Measure self-update duration
on:
  push:
    branches: [measure/win-update-duration]
permissions:
  contents: read
jobs:
  throughput:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Measure original published rollback copy throughput
        env:
          SAMPLE: '1'
          MODE: passive
          COPY_THROUGHPUT: '1'
          COPY_THROUGHPUT_OBSERVER: ${{ github.workspace }}/scripts/update-copy-throughput.cjs
        run: node scripts/measure-update-duration.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: update-copy-throughput-${{ matrix.runner }}
          path: ${{ runner.temp }}/update-duration-evidence
          if-no-files-found: error
