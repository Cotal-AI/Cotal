name: Mutation reproof

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

jobs:
  plan:
    # One checkout runs the selector and names the shards that hold a selected fixture. Before this
    # job every push fanned all 12 shards; on 2026-09-10, 107 of 228 shard jobs installed and built
    # the tree and then printed "No selected mutation fixtures are assigned to shard N", 173
    # job-minutes of setup against the org's 20 concurrent jobs. The plan uses the same selector,
    # the same UNMEASURED refusals and the same dangling check as a shard run, so a shard that is
    # not fanned is one the selector would have emptied. No install and no build: selection reads
    # git and fixture JSON only.
    if: github.event_name != 'schedule'
    timeout-minutes: 10
    runs-on: tenki-standard-small-2c-4g
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Plan the fan-out
        id: plan
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD~1)" || { echo "no base commit or first parent"; exit 2; }
            echo "no base commit on this event; using first parent $base"
          fi
          out="$(node scripts/mutation-reproof.mjs --base "$base" --head "$(git rev-parse HEAD)" --list-shards 12)"
          printf '%s\n' "$out"
          # The plan's last line is the JSON. A selector refusal exits non-zero above and fails this
          # job, which fails the gate: an unmeasured selection must not read as an empty fan-out.
          shards="$(printf '%s\n' "$out" | tail -n 1 | node -e 'const p=JSON.parse(require("fs").readFileSync(0,"utf8"));if(!Array.isArray(p.shards))process.exit(3);console.log(JSON.stringify(p.shards))')"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  changed_shard:
    # At dfbb4550f, PR #1350 selected 32 fixtures and exhausted the 145-minute serial step.
    # Each path is assigned to one shard by the runner's existing hash. Shards use separate
    # checkouts because mutation-proof temporarily changes source and compiled artifacts.
    # Only the shards the plan named are fanned; the shard run re-selects for itself, so a shard
    # that disagrees with the plan prints its own selection rather than trusting the plan's.
    if: github.event_name != 'schedule' && needs.plan.outputs.shards != '[]'
    needs: [plan]
    timeout-minutes: 150
    runs-on: tenki-standard-medium-4c-8g
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    name: changed shard ${{ matrix.shard }}/12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache nats-server
        id: nats
        uses: actions/cache@v4
        with:
          path: ~/nats-bin
          key: nats-server-v2.12.12-${{ runner.os }}
      - name: Install nats-server
        if: steps.nats.outputs.cache-hit != 'true'
        run: |
          NATS_VERSION=v2.12.12
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/nats-server-${NATS_VERSION}-linux-amd64.tar.gz" -o /tmp/nats-server.tar.gz
          tar -xzf /tmp/nats-server.tar.gz -C /tmp
          mkdir -p ~/nats-bin
          install "/tmp/nats-server-${NATS_VERSION}-linux-amd64/nats-server" ~/nats-bin/nats-server
      - name: nats-server on PATH
        run: echo "$HOME/nats-bin" >> "$GITHUB_PATH"
      - name: Build
        run: pnpm build
      - name: Re-prove fixtures for changed guarded sources
        # Leave time after a step timeout to report elapsed time for that shard.
        timeout-minutes: 145
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD~1)" || { echo "no base commit or first parent"; exit 2; }
            echo "no base commit on this event; using first parent $base"
          fi
          # A file survives a timed-out step even when its environment-file updates do not.
          date +%s > "$RUNNER_TEMP/mutation-started"
          node scripts/mutation-reproof.mjs --base "$base" --head "$(git rev-parse HEAD)" --shard "${{ matrix.shard }}/12"
      - name: Report elapsed
        if: always()
        run: |
          marker="$RUNNER_TEMP/mutation-started"
          if [ -s "$marker" ]; then
            echo "mutation reproof: shard ${{ matrix.shard }}/12 elapsed $(( $(date +%s) - $(cat "$marker") ))s (budget 150m)"
          else
            echo "mutation reproof: no start marker; the job ended before the re-prove step began"
          fi

  changed:
    if: github.event_name != 'schedule' && always()
    needs: [plan, changed_shard]
    runs-on: tenki-standard-medium-4c-8g
    steps:
      - name: Gate
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN_SHARDS: ${{ needs.plan.outputs.shards }}
          SHARD_RESULT: ${{ needs.changed_shard.result }}
        run: |
          set -euo pipefail
          echo "plan=$PLAN_RESULT shards=$PLAN_SHARDS changed_shard=$SHARD_RESULT"
          # A failed plan is UNMEASURED and fails the gate. An empty plan skips the fan-out, and the
          # skipped matrix reads `skipped`, which passes only when the plan itself succeeded and
          # said `[]`; a skipped fan-out for any other reason is a failure. `set -e` is explicit so
          # the first test is a gate under any shell, not only under the runner's default `-e`.
          test "$PLAN_RESULT" = success
          if [ "$PLAN_SHARDS" = "[]" ]; then test "$SHARD_RESULT" = skipped; else test "$SHARD_RESULT" = success; fi

  full:
    # A daily sweep keeps the remaining ambient-drift window bounded without making every pull
    # request pay for all 1,714 mutations. It is manually runnable after an infrastructure repair.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 360
    runs-on: tenki-standard-medium-4c-8g
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache nats-server
        id: nats
        uses: actions/cache@v4
        with:
          path: ~/nats-bin
          key: nats-server-v2.12.12-${{ runner.os }}
      - name: Install nats-server
        if: steps.nats.outputs.cache-hit != 'true'
        run: |
          NATS_VERSION=v2.12.12
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/nats-server-${NATS_VERSION}-linux-amd64.tar.gz" -o /tmp/nats-server.tar.gz
          tar -xzf /tmp/nats-server.tar.gz -C /tmp
          mkdir -p ~/nats-bin
          install "/tmp/nats-server-${NATS_VERSION}-linux-amd64/nats-server" ~/nats-bin/nats-server
      - name: nats-server on PATH
        run: echo "$HOME/nats-bin" >> "$GITHUB_PATH"
      - name: Build
        run: pnpm build
      - name: Re-prove every mutation fixture
        run: node scripts/mutation-reproof.mjs --all
      - name: File a tracking issue when the sweep fails
        # The scheduled sweep runs on no pull request, so a red run is otherwise visible only to
        # whoever opens the Actions tab. This turns a failed sweep into one open, labelled tracking
        # issue: a run that fails while the marker issue is still open comments on it instead of
        # opening a second. The key is the label, read through the Issues API, not title search
        # (tokenised and eventually consistent). No failure here is swallowed: the job is already
        # red, so an aborted filing step hides nothing, while a false "no marker" would file a
        # duplicate, which is the one thing this step exists to prevent.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label="ci:mutation-reproof"
          title="mutation-reproof: full sweep failing"
          gh label create "$label" --description "Open while the scheduled mutation-reproof full sweep is failing" --color B60205 --force
          existing="$(gh issue list --state open --label "$label" --json number --jq '.[0].number // empty')"
          body="The daily mutation-reproof full sweep failed: $RUN_URL

          Read the run log. A fatal verdict (SURVIVED, UNGRADABLE, WRONG-RED, ERROR) means a guarded suite no longer discriminates its named mutant or the fixture's anchor is broken; an UNMEASURED refusal names dangling or malformed fixtures; a failure before the sweep step (checkout, install, build) has no verdict lines at all. Repair the fixture or file the named finding, then close this issue once a scheduled sweep is green."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label "$label" --body "$body"
          fi
