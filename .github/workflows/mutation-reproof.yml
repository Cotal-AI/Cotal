name: Mutation reproof

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

jobs:
  changed:
    # Anchors diagnose rot. This job executes fixtures whose guarded source changed, so a workload
    # or test-seam change that leaves every anchor present still has to kill at this head. The
    # corpus is 329 configs / 1,714 mutations, too expensive to multiply into every revision.
    # Source intersection catches the #1217 shape at the changing commit. The daily full sweep
    # below catches cross-cutting changes a fixture did not name within a day.
    if: github.event_name != 'schedule'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache nats-server
        id: nats
        uses: actions/cache@v4
        with:
          path: ~/nats-bin
          key: nats-server-v2.12.12-${{ runner.os }}
      - name: Install nats-server
        if: steps.nats.outputs.cache-hit != 'true'
        run: |
          NATS_VERSION=v2.12.12
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/nats-server-${NATS_VERSION}-linux-amd64.tar.gz" -o /tmp/nats-server.tar.gz
          tar -xzf /tmp/nats-server.tar.gz -C /tmp
          mkdir -p ~/nats-bin
          install "/tmp/nats-server-${NATS_VERSION}-linux-amd64/nats-server" ~/nats-bin/nats-server
      - name: nats-server on PATH
        run: echo "$HOME/nats-bin" >> "$GITHUB_PATH"
      - name: Build
        run: pnpm build
      - name: Re-prove fixtures for changed guarded sources
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD~1)" || { echo "no base commit or first parent"; exit 2; }
            echo "no base commit on this event; using first parent $base"
          fi
          node scripts/mutation-reproof.mjs --base "$base" --head "$(git rev-parse HEAD)"

  full:
    # A daily sweep keeps the remaining ambient-drift window bounded without making every pull
    # request pay for all 1,714 mutations. It is manually runnable after an infrastructure repair.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 360
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache nats-server
        id: nats
        uses: actions/cache@v4
        with:
          path: ~/nats-bin
          key: nats-server-v2.12.12-${{ runner.os }}
      - name: Install nats-server
        if: steps.nats.outputs.cache-hit != 'true'
        run: |
          NATS_VERSION=v2.12.12
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/nats-server-${NATS_VERSION}-linux-amd64.tar.gz" -o /tmp/nats-server.tar.gz
          tar -xzf /tmp/nats-server.tar.gz -C /tmp
          mkdir -p ~/nats-bin
          install "/tmp/nats-server-${NATS_VERSION}-linux-amd64/nats-server" ~/nats-bin/nats-server
      - name: nats-server on PATH
        run: echo "$HOME/nats-bin" >> "$GITHUB_PATH"
      - name: Build
        run: pnpm build
      - name: Re-prove every mutation fixture
        run: node scripts/mutation-reproof.mjs --all
      - name: File a tracking issue when the sweep fails
        # The scheduled sweep runs on no pull request, so a red run is otherwise visible only to
        # whoever opens the Actions tab. This turns a failed sweep into one open, labelled tracking
        # issue: a run that fails while the marker issue is still open comments on it instead of
        # opening a second. The key is the label, read through the Issues API, not title search
        # (tokenised and eventually consistent). No failure here is swallowed: the job is already
        # red, so an aborted filing step hides nothing, while a false "no marker" would file a
        # duplicate, which is the one thing this step exists to prevent.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label="ci:mutation-reproof"
          title="mutation-reproof: full sweep failing"
          gh label create "$label" --description "Open while the scheduled mutation-reproof full sweep is failing" --color B60205 --force
          existing="$(gh issue list --state open --label "$label" --json number --jq '.[0].number // empty')"
          body="The daily mutation-reproof full sweep failed: $RUN_URL

          Read the run log. A fatal verdict (SURVIVED, UNGRADABLE, WRONG-RED, ERROR) means a guarded suite no longer discriminates its named mutant or the fixture's anchor is broken; an UNMEASURED refusal names dangling or malformed fixtures; a failure before the sweep step (checkout, install, build) has no verdict lines at all. Repair the fixture or file the named finding, then close this issue once a scheduled sweep is green."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label "$label" --body "$body"
          fi
