name: Mutation reproof

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

jobs:
  changed:
    # Anchors diagnose rot. This job executes fixtures whose guarded source changed, so a workload
    # or test-seam change that leaves every anchor present still has to kill at this head. The
    # corpus is 329 configs / 1,714 mutations, too expensive to multiply into every revision.
    # Source intersection catches the #1217 shape at the changing commit. The daily full sweep
    # below catches cross-cutting changes a fixture did not name within a day.
    if: github.event_name != 'schedule'
    # 150, raised from the previous 60-minute budget (150 = 2.5 x 60). A PR touching a high-fan-in
    # guarded source selects a large fixture set, and #1294 could not satisfy this gate by any
    # action its author could take: its `changed` job was cancelled at the 60-minute cap on five
    # consecutive heads. `pr-head-gate.mjs` grades a non-success as failing and this workflow is in
    # its expected set, so the gate failed closed on a job that could not finish rather than on a
    # defect.
    #
    # The selection differs per head, so each figure names its own sha:
    #   647e21b5e (run 33973541717)  42 fixtures selected from 341
    #   d1db29e23 (run 33978243970)  43 fixtures selected from 342, the extra one being
    #                                self-update-handoff.json, which that head added
    #
    # The budget is derived from d1db29e23's own progress rather than from a model. That job spent
    # 56s on setup, then ran the re-prove step 16:34:33Z -> 17:33:49Z (59.3 min) before the cap
    # cancelled it, completing 109 of its 183 mutations, 60% of that set. That is 32.6 s/mutation
    # ON THAT SET, projecting 99.5 min for the re-prove and ~100 min for the whole job. 150 leaves
    # about 1.49x headroom over that projection and stays well under `full`'s 360.
    #
    # Models fitted from OTHER runs under-predict badly and should not be used to re-derive. The
    # fastest observed successful run (9 fixtures / 39 mutations in 7m27s) puts d1db's 183
    # mutations at ~35 min, and the corpus fraction (183 of 1,714) against `full`'s budget puts it
    # at ~38. The real set needed ~100. Per-mutation cost is dominated by WHICH suites a fixture
    # guards, not by how many mutations it carries, so a rate measured on a small set does not
    # transfer to a large one.
    #
    # Re-derive from the elapsed line the Report elapsed step prints, on a real high-fan-in set,
    # and name the sha you measured. Do not raise this again without that data.
    timeout-minutes: 150
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache nats-server
        id: nats
        uses: actions/cache@v4
        with:
          path: ~/nats-bin
          key: nats-server-v2.12.12-${{ runner.os }}
      - name: Install nats-server
        if: steps.nats.outputs.cache-hit != 'true'
        run: |
          NATS_VERSION=v2.12.12
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/nats-server-${NATS_VERSION}-linux-amd64.tar.gz" -o /tmp/nats-server.tar.gz
          tar -xzf /tmp/nats-server.tar.gz -C /tmp
          mkdir -p ~/nats-bin
          install "/tmp/nats-server-${NATS_VERSION}-linux-amd64/nats-server" ~/nats-bin/nats-server
      - name: nats-server on PATH
        run: echo "$HOME/nats-bin" >> "$GITHUB_PATH"
      - name: Build
        run: pnpm build
      - name: Re-prove fixtures for changed guarded sources
        # A STEP timeout, deliberately below the job's 150. This changes what a budget breach MEANS
        # to the head gate and that is the point: a job timeout produces `cancelled`, a step timeout
        # produces `failure`, and `pr-head-gate.mjs` grades them differently. A breach should read
        # as a failure the author can see and act on, not as a cancellation that looks like
        # unrelated CI churn. It also lets the Report elapsed step run normally instead of racing a
        # cancellation grace period, so the one run whose duration matters most is the one that can
        # now report it.
        timeout-minutes: 145
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD~1)" || { echo "no base commit or first parent"; exit 2; }
            echo "no base commit on this event; using first parent $base"
          fi
          # A FILE, not $GITHUB_ENV. The runner processes a step's env file when the step ENDS, so a
          # step killed by `timeout-minutes` never contributes its variables and the next step would
          # see nothing — on precisely the timed-out run this measurement exists for. A file written
          # by the shell exists the moment the redirect completes.
          date +%s > "$RUNNER_TEMP/mutation-started"
          node scripts/mutation-reproof.mjs --base "$base" --head "$(git rev-parse HEAD)"
      - name: Report elapsed
        # Until this step existed, no run of this job recorded how long it took, so a cancellation
        # at the cap and a run finishing one second inside it were indistinguishable afterwards,
        # and the budget above could only ever be guessed.
        #
        # `always()` rather than `failure()` because the run whose duration matters most is the one
        # the timer kills. The start marker is a file for the same reason: $GITHUB_ENV is processed
        # by the runner only when a step ENDS (FileCommandManager.ProcessFiles runs in its finally),
        # so a step the timer kills contributes nothing and this step would take its else branch on
        # exactly the run it was added for. $RUNNER_TEMP is job-scoped, emptied at job start and end
        # rather than per step, so the marker survives between steps.
        #
        # The step-level timeout below is what actually makes this reachable. A JOB timeout cancels,
        # and a cancelled job gives its remaining steps only a grace period; a STEP timeout fails
        # the step and the job continues to this one normally.
        if: always()
        run: |
          marker="$RUNNER_TEMP/mutation-started"
          if [ -s "$marker" ]; then
            echo "mutation reproof: changed-set elapsed $(( $(date +%s) - $(cat "$marker") ))s (budget 150m)"
          else
            echo "mutation reproof: no start marker; the job ended before the re-prove step began"
          fi

  full:
    # A daily sweep keeps the remaining ambient-drift window bounded without making every pull
    # request pay for all 1,714 mutations. It is manually runnable after an infrastructure repair.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 360
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache nats-server
        id: nats
        uses: actions/cache@v4
        with:
          path: ~/nats-bin
          key: nats-server-v2.12.12-${{ runner.os }}
      - name: Install nats-server
        if: steps.nats.outputs.cache-hit != 'true'
        run: |
          NATS_VERSION=v2.12.12
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/nats-server-${NATS_VERSION}-linux-amd64.tar.gz" -o /tmp/nats-server.tar.gz
          tar -xzf /tmp/nats-server.tar.gz -C /tmp
          mkdir -p ~/nats-bin
          install "/tmp/nats-server-${NATS_VERSION}-linux-amd64/nats-server" ~/nats-bin/nats-server
      - name: nats-server on PATH
        run: echo "$HOME/nats-bin" >> "$GITHUB_PATH"
      - name: Build
        run: pnpm build
      - name: Re-prove every mutation fixture
        run: node scripts/mutation-reproof.mjs --all
      - name: File a tracking issue when the sweep fails
        # The scheduled sweep runs on no pull request, so a red run is otherwise visible only to
        # whoever opens the Actions tab. This turns a failed sweep into one open, labelled tracking
        # issue: a run that fails while the marker issue is still open comments on it instead of
        # opening a second. The key is the label, read through the Issues API, not title search
        # (tokenised and eventually consistent). No failure here is swallowed: the job is already
        # red, so an aborted filing step hides nothing, while a false "no marker" would file a
        # duplicate, which is the one thing this step exists to prevent.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label="ci:mutation-reproof"
          title="mutation-reproof: full sweep failing"
          gh label create "$label" --description "Open while the scheduled mutation-reproof full sweep is failing" --color B60205 --force
          existing="$(gh issue list --state open --label "$label" --json number --jq '.[0].number // empty')"
          body="The daily mutation-reproof full sweep failed: $RUN_URL

          Read the run log. A fatal verdict (SURVIVED, UNGRADABLE, WRONG-RED, ERROR) means a guarded suite no longer discriminates its named mutant or the fixture's anchor is broken; an UNMEASURED refusal names dangling or malformed fixtures; a failure before the sweep step (checkout, install, build) has no verdict lines at all. Repair the fixture or file the named finding, then close this issue once a scheduled sweep is green."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label "$label" --body "$body"
          fi
