name: Windows native install measurement
on:
  push:
    branches: [fix/windows-native-install-timeout]
    paths: ['.github/workflows/windows-native-install-measurement.*', 'bin/daemon/install*.ts', 'bin/daemon/ownership-win32.ts']
permissions:
  contents: read
env:
  DO_NOT_TRACK: 1
jobs:
  measure:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Windows native bindings
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -property installationPath`) do set "VS=%%i"
          if not defined VS exit /b 1
          call "%VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=amd64 -host_arch=amd64
          if errorlevel 1 exit /b 1
          node packages/workspace/scripts/build-native.mjs
          if errorlevel 1 exit /b 1
          node packages/seat/scripts/build-native.mjs --host
      - run: pnpm --workspace-concurrency=3 --filter cotal-ai... build
      - name: Measure slow Task Scheduler lookup during real CLI install
        run: node .github/workflows/windows-native-install-measurement.mjs
