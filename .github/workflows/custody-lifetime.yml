name: Backup user-mode reproduction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DO_NOT_TRACK: "1"
      COTAL_TELEMETRY: "off"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.11
          cache: false
      - name: Install CI-pinned broker from verified Go modules
        shell: bash
        env:
          GOSUMDB: sum.golang.org
          GOPROXY: https://proxy.golang.org
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          export GOBIN="$RUNNER_TEMP/backup-broker"
          mkdir -p "$GOBIN"
          go install github.com/nats-io/nats-server/v2@v2.12.12
          printf '%s\n' "$GOBIN" >> "$GITHUB_PATH"
      - run: pnpm --filter "cotal-ai..." build
      - name: Verify unchanged source and an unused runner
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fd5e4b95de5c3e059d5afec78823d1defad3f8f4 HEAD
          test "$(git diff --name-only fd5e4b95de5c3e059d5afec78823d1defad3f8f4 HEAD)" = .github/workflows/custody-lifetime.yml
          if pgrep -x nats-server; then exit 1; else test "$?" -eq 1; fi
          test ! -e "$HOME/.cotal"
          git rev-parse HEAD
          sha256sum bin/smoke/backup-usermode-live.smoke.ts
          node --version
          pnpm --version
          nats-server --version
      - name: Reproduce the user-mode backup lifecycle
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export TMPDIR="$RUNNER_TEMP/backup-usermode"
          mkdir -p "$TMPDIR"
          timeout --signal=TERM --kill-after=30s 600s pnpm smoke:backup-usermode:live
