name: Emergency A recovery proof

on:
  push:
    branches: [measure/dead-updater-recovery-proof]

permissions:
  contents: read
  actions: read

jobs:
  before:
    if: github.ref == 'refs/heads/measure/dead-updater-recovery-proof'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, route: npm, activation: passive120 }
          - { os: macos-15, route: npm, activation: passive120 }
          - { os: ubuntu-24.04, route: installer, activation: immediate }
    env:
      DO_NOT_TRACK: '1'
      COTAL_TELEMETRY: 'off'
      FIXED_SOURCE: 0ed6cc3c6a5deb3e130448746874e0b308e633bb
      LEGACY_SOURCE: 8cddd397a05afc15842c0a2402beb2a983b226c7
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Guard before dependency install
        run: node -e "const d=require('node:fs').statfsSync(process.env.RUNNER_TEMP);if(d.bavail*d.bsize<25769803776)throw Error('Less than 24 GiB before install')"
      - run: pnpm install --frozen-lockfile --child-concurrency=2
      - name: Guard before fixture build
        run: node -e "const d=require('node:fs').statfsSync(process.env.RUNNER_TEMP);if(d.bavail*d.bsize<25769803776)throw Error('Less than 24 GiB before build')"
      - name: Build native macOS host primitives
        if: runner.os == 'macOS'
        run: |
          node -e "const d=require('node:fs').statfsSync(process.env.RUNNER_TEMP);if(d.bavail*d.bsize<25769803776)throw Error('Less than 24 GiB before native build')"
          node packages/seat/scripts/build-native.mjs --host
      - name: Build only fixture dependency closure
        run: |
          node -e "const d=require('node:fs').statfsSync(process.env.RUNNER_TEMP);if(d.bavail*d.bsize<25769803776)throw Error('Less than 24 GiB before fixture build')"
          pnpm --filter 'cotal-ai...' --workspace-concurrency 3 build
      - name: Await exact A producer candidate artifact
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {appendFileSync,writeFileSync} from 'node:fs';
          const api=async path=>{const r=await fetch('https://api.github.com/repos/Cotal-AI/Cotal/'+path,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});assert(r.ok,'GitHub artifact query failed: '+r.status);return r.json();};
          const deadline=Date.now()+25*60*1000;
          for(;;){
            const run=await api('actions/runs/43935096341');
            assert.equal(run.head_sha,process.env.FIXED_SOURCE,'producer head changed');
            const rows=await api('actions/runs/43935096341/artifacts?per_page=100');
            const matches=rows.artifacts.filter(a=>a.name==='release-candidate'&&!a.expired);
            assert(matches.length<=1,'ambiguous candidate artifact');
            if(matches.length){const a=matches[0];assert.match(a.digest,/^sha256:[a-f0-9]{64}$/);writeFileSync(process.env.RUNNER_TEMP+'/A-producer-artifact.json',JSON.stringify({run:43935096341,source:run.head_sha,id:a.id,digest:a.digest},null,2));appendFileSync(process.env.GITHUB_OUTPUT,'artifact='+a.id+'\n');break;}
            assert(!(run.status==='completed'&&run.conclusion!=='success'),'A producer failed before candidate artifact');
            assert(Date.now()<deadline,'A artifact wait expired, no alternate source allowed');
            await new Promise(r=>setTimeout(r,30000));
          }
          NODE
      - name: Download fixed candidate from the authorized producer
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43935096341
          artifact-ids: ${{ steps.candidate.outputs.artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/fixed
      - name: Download legacy fencing source closure from completed baseline producer
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43900187125
          name: admission-legacy-candidate
          path: ${{ runner.temp }}/legacy-a
      - name: Download legacy fencing next closure from completed baseline producer
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43900187125
          name: admission-legacy-next
          path: ${{ runner.temp }}/legacy-b
      - name: Verify archive origins and immutable fixed manifest
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync, writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const origins=[];
          for(const [name,source] of [['fixed',process.env.FIXED_SOURCE],['legacy-a',process.env.LEGACY_SOURCE],['legacy-b',process.env.LEGACY_SOURCE]]) {
            const root=process.env.RUNNER_TEMP+'/'+name;
            const bytes=readFileSync(root+'/manifest.json'), manifest=JSON.parse(bytes);
            assert.equal(manifest.source,source);
            assert.equal(manifest.packages.length,24);
            for(const p of manifest.packages) assert.equal(createHash('sha256').update(readFileSync(root+'/'+p.archive)).digest('hex'),p.sha256);
            origins.push({name,source,manifestSha256:createHash('sha256').update(bytes).digest('hex'),versions:[...new Set(manifest.packages.map(p=>p.version))]});
          }
          writeFileSync(process.env.RUNNER_TEMP+'/before-origins.json',JSON.stringify({legacyRun:43900187125,fixed:JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/A-producer-artifact.json')),origins},null,2));
          NODE
      - name: Fetch verified NATS test broker
        run: |
          work="$RUNNER_TEMP/nats"
          mkdir -p "$work"
          case "$RUNNER_OS" in Linux) platform=linux ;; macOS) platform=darwin ;; *) exit 1 ;; esac
          case "$(uname -m)" in x86_64) arch=amd64 ;; arm64|aarch64) arch=arm64 ;; *) exit 1 ;; esac
          archive="nats-server-v2.14.0-$platform-$arch.tar.gz"
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/v2.14.0/$archive" -o "$work/$archive"
          curl -fsSL https://github.com/nats-io/nats-server/releases/download/v2.14.0/SHA256SUMS -o "$work/SHA256SUMS"
          awk -v archive="$archive" '$2 == archive { print }' "$work/SHA256SUMS" > "$work/selected.sha256"
          test -s "$work/selected.sha256"
          (cd "$work" && shasum -a 256 -c selected.sha256 && tar -xzf "$archive")
          echo "$work/nats-server-v2.14.0-$platform-$arch" >> "$GITHUB_PATH"
      - name: Run one fresh official18 native before state
        env:
          ROUTE: ${{ matrix.route }}
          ACTIVATION: ${{ matrix.activation }}
        run: |
          node --import tsx scripts/dead-updater-recovery-proof.mts "$GITHUB_WORKSPACE" "$RUNNER_TEMP/stuck-$ROUTE" "$RUNNER_TEMP/legacy-a" "$RUNNER_TEMP/legacy-b" "$RUNNER_TEMP/fixed" "$ROUTE" registered "$ACTIVATION"
      - name: Hash public evidence only
        if: always()
        env:
          ROUTE: ${{ matrix.route }}
        run: |
          if [ -f "$RUNNER_TEMP/stuck-$ROUTE/result.json" ]; then
            shasum -a 256 "$RUNNER_TEMP/stuck-$ROUTE/result.json" > "$RUNNER_TEMP/before-result.sha256"
          fi
          shasum -a 256 scripts/dead-updater-recovery-proof.mts > "$RUNNER_TEMP/before-script.sha256"
      - name: Retain result and source receipts, never private profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emergency-A-recovery-${{ matrix.os }}-${{ matrix.route }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/stuck-${{ matrix.route }}/result.json
            ${{ runner.temp }}/before-result.sha256
            ${{ runner.temp }}/before-script.sha256
            ${{ runner.temp }}/A-producer-artifact.json
            ${{ runner.temp }}/before-origins.json
            ${{ runner.temp }}/nats/selected.sha256
