name: Remotion typecheck

on:
  pull_request:
    paths:
      - 'remotion/**'
      - 'package.json'
      - '.github/workflows/remotion.yml'
  push:
    branches: [main]
    paths:
      - 'remotion/**'
      - 'package.json'
      - '.github/workflows/remotion.yml'

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/remotion-pnpm-store"
      - run: pnpm typecheck
