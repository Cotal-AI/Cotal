[package]
name = "cotal-desktop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "cotal_desktop"
path = "src/lib.rs"

[[bin]]
name = "cotal-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
updater-e2e = []
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-shell", "dep:tauri-plugin-opener", "dep:tauri-plugin-autostart", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-deep-link", "dep:tokio", "dep:windows", "dep:tauri-plugin-updater", "dep:rustls"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri = { version = "2", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"], optional = true }
tauri-plugin-deep-link = { version = "2", optional = true }
tauri-plugin-updater = { version = "=2.14.1", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
tokio = { version = "1", features = ["time", "sync"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["UI_Shell", "Win32_Foundation", "Win32_Security", "Win32_UI_Shell", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Environment", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[profile.release]
strip = true
