[package]
name = "cotal-desktop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "cotal_desktop"
path = "src/lib.rs"

[[bin]]
name = "cotal-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-shell", "dep:tauri-plugin-opener", "dep:tauri-plugin-autostart", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-deep-link", "dep:tokio", "dep:windows"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri = { version = "2", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"], optional = true }
tauri-plugin-deep-link = { version = "2", optional = true }
tokio = { version = "1", features = ["time", "sync"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["UI_Shell", "Win32_UI_Shell", "Win32_System_Registry"], optional = true }

[profile.release]
strip = true

